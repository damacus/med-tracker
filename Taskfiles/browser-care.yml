version: '3'
tasks:
  seed-otp:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1
        -c "INSERT INTO public.account_otp_keys(id,key,last_use,num_failures) VALUES(71001,'abcdefghijklmnop',now()-interval '1 day',0)"
  otp-probe:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align
        -c "SELECT json_build_object('num_failures',num_failures,'recent_use',last_use>now()-interval '1 minute') FROM public.account_otp_keys WHERE id=71001"
  close-otp-account:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "UPDATE public.accounts SET status=3 WHERE id=71001"'
  scheduled-medicine:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1
        -c "INSERT INTO public.schedules(id,household_id,person_id,medication_id,active,start_date,end_date,dose_amount,dose_unit,schedule_type,schedule_config,created_at,updated_at) VALUES(83001,72001,73001,80001,true,current_date-1,current_date+7,2,'tablet',6,'{}',now(),now())"
  oauth-probe:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align
        -c "SELECT json_build_object(
        'native_grants',(SELECT count(*) FROM public.oauth_grants WHERE account_id=71001 AND oauth_application_id=75002),
        'smart_grants',(SELECT count(*) FROM public.oauth_grants WHERE account_id=71001 AND oauth_application_id=75003),
        'native_code_seconds',(SELECT extract(epoch FROM expires_in-now()) FROM public.oauth_grants WHERE account_id=71001 AND oauth_application_id=75002 ORDER BY id DESC LIMIT 1),
        'smart_code_seconds',(SELECT extract(epoch FROM expires_in-now()) FROM public.oauth_grants WHERE account_id=71001 AND oauth_application_id=75003 ORDER BY id DESC LIMIT 1),
        'native_auth_time_preserved',(SELECT authenticated_at=(SELECT created_at FROM public.account_active_session_keys WHERE account_id=71001 ORDER BY created_at DESC LIMIT 1) FROM public.oauth_grants WHERE account_id=71001 AND oauth_application_id=75002 ORDER BY id DESC LIMIT 1),
        'native_consent_audits',(SELECT count(*) FROM public.versions WHERE item_type='Account' AND item_id=71001 AND event='mobile_oauth.consent_granted' AND object::jsonb->>'oauth_application_id'='75002'),
        'native_revoke_audits',(SELECT count(*) FROM public.versions WHERE item_type='Account' AND item_id=71001 AND event='mobile_oauth.token_revoked' AND object::jsonb->>'oauth_application_id'='75002'),
        'smart_consent_audits',(SELECT count(*) FROM public.security_audit_events WHERE actor_account_id=71001 AND event_type='smart_oauth.consent_granted' AND metadata->>'oauth_application_id'='75003'),
        'smart_revoke_audits',(SELECT count(*) FROM public.security_audit_events WHERE actor_account_id=71001 AND event_type='smart_oauth.token_revoked' AND metadata->>'oauth_application_id'='75003'));"
  age-authentication:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1
        -c "UPDATE public.account_active_session_keys SET created_at=now()-interval '2 hours' WHERE account_id=71001"
  fail-oauth-audit:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --single-transaction
        -c "ALTER TABLE public.versions ADD CONSTRAINT browser_oauth_audit_failure CHECK(event NOT IN('mobile_oauth.consent_granted','mobile_oauth.token_revoked')) NOT VALID;
        ALTER TABLE public.security_audit_events ADD CONSTRAINT browser_oauth_audit_failure CHECK(event_type NOT IN('smart_oauth.consent_granted','smart_oauth.token_revoked')) NOT VALID;"
  restore-oauth-audit:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --single-transaction
        -c "ALTER TABLE public.versions DROP CONSTRAINT IF EXISTS browser_oauth_audit_failure;
        ALTER TABLE public.security_audit_events DROP CONSTRAINT IF EXISTS browser_oauth_audit_failure;"
  second-person:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --single-transaction
        -c "INSERT INTO public.person_access_grants(id,household_id,household_membership_id,person_id,access_level,relationship_type,created_at,updated_at) VALUES(78002,72001,74001,73002,'manage','parent',now(),now());
        INSERT INTO public.person_medications(id,household_id,person_id,medication_id,dose_amount,dose_unit,position,created_at,updated_at) VALUES(81002,72001,73002,80001,1,'tablet',1,now(),now());"
  seed:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --single-transaction -f tests/fixtures/persistence-records.sql -f tests/fixtures/care-doses.sql -f tests/oauth_server/clients.sql'
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --single-transaction
        -c "CREATE ROLE medtracker_browser_runtime LOGIN PASSWORD 'password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS IN ROLE med_tracker_app;
        INSERT INTO public.accounts(id,email,status,password_hash,created_at,updated_at) VALUES(71002,'foreign@example.test',2,crypt('password',gen_salt('bf',4)),now(),now());
        INSERT INTO public.households(id,created_by_account_id,name,slug,timezone,created_at,updated_at) VALUES(72002,71002,'Synthetic foreign household','foreign-fixture','Europe/London',now(),now());
        INSERT INTO public.locations(id,household_id,name,created_at,updated_at) VALUES(79002,72002,'Synthetic foreign cabinet',now(),now());
        INSERT INTO public.medications(id,household_id,location_id,name,current_supply,dose_amount,dose_unit,created_at,updated_at) VALUES(80002,72002,79002,'Synthetic foreign medicine',10,2,'tablet',now(),now());"
  probe:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align
        -c "SELECT json_build_object('supply',(SELECT current_supply::text FROM public.medications WHERE id=80001),'takes',(SELECT count(*) FROM public.medication_takes WHERE taken_from_medication_id=80001),'foreign_supply',(SELECT current_supply::text FROM public.medications WHERE id=80002),'foreign_takes',(SELECT count(*) FROM public.medication_takes WHERE taken_from_medication_id=80002),'runtime_superuser',(SELECT rolsuper FROM pg_roles WHERE rolname='medtracker_browser_runtime'),'runtime_bypassrls',(SELECT rolbypassrls FROM pg_roles WHERE rolname='medtracker_browser_runtime'),'stored_sessions',(SELECT count(*) FROM public.browser_sessions),'session_plaintext',(SELECT COALESCE(bool_or(session LIKE '%persistence@example.test%' OR session LIKE '%account_id%'),false) FROM public.browser_sessions),'registry_sessions',(SELECT count(*) FROM public.account_active_session_keys WHERE account_id=71001),'active_sessions',(SELECT count(*) FROM public.account_active_session_keys WHERE account_id=71001 AND last_use>now()-interval '30 days'));"
  revoke:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "UPDATE public.person_access_grants SET revoked_at=now() WHERE id=78001"'
  reactivate:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "UPDATE public.person_access_grants SET revoked_at=NULL WHERE id=78001"'
  revoke-session:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "DELETE FROM public.account_active_session_keys WHERE account_id=71001"'
  expire-session:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "UPDATE public.account_active_session_keys SET last_use=now()-interval ''31 days'' WHERE account_id=71001"'
  dose-request-id:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align
        -c "SELECT request_id FROM public.versions WHERE item_type='MedicationTake' AND item_id=(SELECT id FROM public.medication_takes WHERE taken_from_medication_id=80001 ORDER BY id DESC LIMIT 1) ORDER BY id DESC LIMIT 1"
