version: '3'
tasks:
  freeze-template:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds: ['psql {{.CARE_DATABASE_URL | shellQuote}} -X -v ON_ERROR_STOP=1 -c "ALTER DATABASE medtracker_reference ALLOW_CONNECTIONS false"']
  clone:
    requires:
      vars: [CARE_DATABASE_URL, CARE_DATABASE_NAME]
    preconditions:
      - sh: 'node -e "if (!/^browser_[a-f0-9]{32}$/.test(process.argv[1])) process.exit(1)" {{.CARE_DATABASE_NAME | shellQuote}}'
    cmds:
      - 'psql {{.CARE_DATABASE_URL | shellQuote}} -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE {{.CARE_DATABASE_NAME}} TEMPLATE medtracker_reference"'
      - 'psql {{.CARE_DATABASE_URL | shellQuote}} -X -v ON_ERROR_STOP=1 -c "CREATE ROLE {{.CARE_DATABASE_NAME}}_runtime LOGIN PASSWORD ''password'' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS IN ROLE med_tracker_app"'
  drop:
    requires:
      vars: [CARE_DATABASE_URL, CARE_DATABASE_NAME]
    preconditions:
      - sh: 'node -e "if (!/^browser_[a-f0-9]{32}$/.test(process.argv[1])) process.exit(1)" {{.CARE_DATABASE_NAME | shellQuote}}'
    cmds:
      - 'psql {{.CARE_DATABASE_URL | shellQuote}} -X -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS {{.CARE_DATABASE_NAME}} WITH (FORCE)"'
      - 'psql {{.CARE_DATABASE_URL | shellQuote}} -X -v ON_ERROR_STOP=1 -c "DROP ROLE IF EXISTS {{.CARE_DATABASE_NAME}}_runtime"'
  storage-bucket:
    requires:
      vars: [STORAGE_ENDPOINT, STORAGE_BUCKET]
    cmds: ['curl --fail --silent --show-error --aws-sigv4 aws:amz:us-east-1:s3 --user storage-smoke-access:storage-smoke-secret --request PUT {{printf "%s/%s" .STORAGE_ENDPOINT .STORAGE_BUCKET | shellQuote}}']
  profile-reference:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --single-transaction
        -c "UPDATE public.people SET name='Jane Doe',date_of_birth='1980-01-02' WHERE id=73001;
        UPDATE public.accounts SET email='jane.doe@example.com',preferences=coalesce(preferences,'{}'::jsonb)||jsonb_build_object('time_zone','London') WHERE id=71001;
        UPDATE public.household_memberships SET role='member' WHERE id=74001;"
  profile-birthday:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds: ['psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "UPDATE public.people SET date_of_birth=''1980-06-15'' WHERE id=73001"']
  profile-newborn:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds: ['psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "UPDATE public.people SET date_of_birth=timezone(''UTC'',clock_timestamp())::date,person_type=1,has_capacity=false WHERE id=73001"']
  profile-closure-devices:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --single-transaction
        -c "INSERT INTO public.push_subscriptions(account_id,endpoint,p256dh,auth,created_at,updated_at) SELECT id,'https://web.push.apple.com/synthetic-'||id,'synthetic-key','synthetic-auth',now(),now() FROM public.accounts WHERE id IN(71001,71002);
        INSERT INTO public.native_device_tokens(account_id,device_token,platform,apns_environment,created_at,updated_at) SELECT id,'synthetic-device-'||id,'ios','sandbox',now(),now() FROM public.accounts WHERE id IN(71001,71002);"
  profile-device-probe:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align
        -c "SELECT json_build_object('browser',(SELECT count(*) FROM public.push_subscriptions WHERE account_id=71001),'native',(SELECT count(*) FROM public.native_device_tokens WHERE account_id=71001),'other_browser',(SELECT count(*) FROM public.push_subscriptions WHERE account_id=71002),'other_native',(SELECT count(*) FROM public.native_device_tokens WHERE account_id=71002));"
  profile-notification-fixture:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds: ['psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --single-transaction -f tests/fixtures/browser-profile-notifications.sql']
  profile-notification-probe:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds: ['psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align -c "SELECT json_object_agg(person_id,enabled) FROM public.household_notification_subscriptions WHERE account_id=71001 AND household_id=72001"']
  prepare-avatar-storage:
    cmds:
      - >-
        {{if .LOCO_PREBUILT}}node scripts/ci/loco-validate.mjs &&
        cargo nextest run --archive-file target/ci/loco-tests.tar.zst --workspace-remap {{.ROOT_DIR | shellQuote}}
        {{else}}cargo nextest run --locked --test care_api{{end}}
        --run-ignored only --no-tests=fail
        -E 'binary_id(=med-tracker::care_api) & test(=avatar_storage::prepare_owned_bucket)'
  occurrence-probe:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align -f tests/fixtures/browser-occurrence-probe.sql'
  fail-occurrence-audit:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -f tests/fixtures/browser-occurrence-audit-failure.sql'
  treatment-probe:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align -f tests/fixtures/browser-treatment-probe.sql'
  fail-treatment-audit:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -f tests/fixtures/browser-treatment-audit-failure.sql'
  binary:
    cmds: ['{{if .LOCO_PREBUILT}}node -e "console.log(require(''node:path'').resolve(''target/ci/med-tracker''))"{{else}}cargo metadata --locked --no-deps --format-version 1 | jq -r ''.target_directory + "/debug/med-tracker"''{{end}}']
  serve:
    vars:
      BROWSER_BINARY:
        sh: task browser-care:binary
    cmds: ['{{.BROWSER_BINARY | shellQuote}} start {{if eq (.SERVER_AND_WORKER | default "false") "true"}}--server-and-worker{{end}} --environment {{.LOCO_ENV | default "test"}}']
  migrate:
    requires:
      vars: [MIGRATION_DATABASE_URL]
    vars:
      BROWSER_BINARY:
        sh: task browser-care:binary
    env:
      DATABASE_URL: '{{.MIGRATION_DATABASE_URL}}'
    cmds: ['env DATABASE_URL={{.MIGRATION_DATABASE_URL | shellQuote}} {{.BROWSER_BINARY | shellQuote}} db migrate --environment {{.LOCO_ENV | default "test"}}']
  snapshot:
    requires:
      vars: [FOUNDATION_PROJECT, SNAPSHOT_PATH]
    cmds: ['docker compose -f {{printf "%s/compose.yaml" .ROOT_DIR | shellQuote}} --env-file /dev/null -p {{.FOUNDATION_PROJECT | shellQuote}} exec -T postgres pg_dump -U medtracker -d {{.CARE_DATABASE_NAME | default "medtracker_reference" | shellQuote}} --format=custom --data-only --exclude-table=public.seaql_migrations > {{.SNAPSHOT_PATH | shellQuote}}']
  reset:
    requires:
      vars: [FOUNDATION_PROJECT, CARE_DATABASE_URL, SNAPSHOT_PATH]
    cmds:
      - 'psql {{.CARE_DATABASE_URL | shellQuote}} -X -v ON_ERROR_STOP=1 --single-transaction -f tests/fixtures/browser-reset.sql'
      - 'docker compose -f {{printf "%s/compose.yaml" .ROOT_DIR | shellQuote}} --env-file /dev/null -p {{.FOUNDATION_PROJECT | shellQuote}} exec -T postgres pg_restore -U medtracker -d {{.CARE_DATABASE_NAME | default "medtracker_reference" | shellQuote}} --data-only --disable-triggers --single-transaction --exit-on-error < {{.SNAPSHOT_PATH | shellQuote}}'
  order-probe:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align -f tests/fixtures/browser-order-probe.sql'
  restock-probe:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align -f tests/fixtures/browser-restock-probe.sql'
  fail-restock-audit:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "ALTER TABLE public.versions ADD CONSTRAINT browser_restock_audit_failure CHECK(event NOT LIKE ''restock (%'') NOT VALID"'
  fail-order-audit:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -f tests/fixtures/browser-order-audit-failure.sql'
  use-order-member:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "UPDATE public.household_memberships SET role=''member'' WHERE id=74001"'
  age-verification-email:
    requires:
      vars: [CARE_DATABASE_URL, REGISTRATION_EMAIL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1
        -v email={{.REGISTRATION_EMAIL | shellQuote}} -f tests/fixtures/verification-email-age.sql
  verification-probe:
    requires:
      vars: [CARE_DATABASE_URL, REGISTRATION_EMAIL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align
        -v email={{.REGISTRATION_EMAIL | shellQuote}} -f tests/fixtures/verification-email-probe.sql
  registration-policy:
    requires:
      vars: [CARE_DATABASE_URL, REGISTRATION_INVITE_ONLY]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --single-transaction
        -v invite_only={{.REGISTRATION_INVITE_ONLY | shellQuote}} -f tests/fixtures/registration-policy.sql
  clear-registration-policy:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "DELETE FROM public.app_settings;"'
  registration-probe:
    requires:
      vars: [CARE_DATABASE_URL, REGISTRATION_EMAIL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align
        -v email={{.REGISTRATION_EMAIL | shellQuote}} -f tests/fixtures/registration-probe.sql
  invitation-signup-probe:
    requires:
      vars: [CARE_DATABASE_URL, INVITATION_EMAIL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align
        -v email={{.INVITATION_EMAIL | shellQuote}} -f tests/fixtures/invitation-browser-signup-probe.sql
  seed-invitation-account:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --single-transaction -f tests/fixtures/invitation-browser-account.sql'
  seed-invitation-otp:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1
        -c "INSERT INTO public.account_otp_keys(id,key,last_use,num_failures) VALUES(71002,'abcdefghijklmnop',now()-interval '1 day',0);"
  invitation-acceptance-probe:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align -f tests/fixtures/invitation-browser-acceptance-probe.sql'
  invitation-probe:
    requires:
      vars: [CARE_DATABASE_URL, INVITATION_EMAIL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align
        -v email={{.INVITATION_EMAIL | shellQuote}} -f tests/fixtures/invitation-browser-probe.sql
  expire-invitation:
    requires:
      vars: [CARE_DATABASE_URL, INVITATION_EMAIL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1
        -v email={{.INVITATION_EMAIL | shellQuote}} -f tests/fixtures/invitation-browser-expire.sql
  revoke-invitation:
    requires:
      vars: [CARE_DATABASE_URL, INVITATION_EMAIL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1
        -v email={{.INVITATION_EMAIL | shellQuote}} -f tests/fixtures/invitation-browser-revoke.sql
  mail-up:
    requires:
      vars: [MAILPIT_NAME]
    cmds:
      - >-
        docker run --detach --name {{.MAILPIT_NAME | shellQuote}}
        --publish 127.0.0.1::1025 --publish 127.0.0.1::8025
        axllent/mailpit:v1.31.4
  mail-port:
    requires:
      vars: [MAILPIT_NAME, MAILPIT_PORT]
    cmds:
      - 'docker port {{.MAILPIT_NAME | shellQuote}} {{.MAILPIT_PORT | shellQuote}}'
  mail-down:
    requires:
      vars: [MAILPIT_NAME]
    cmds:
      - 'docker rm --force {{.MAILPIT_NAME | shellQuote}}'
  seed-unsupported-passkey:
    requires:
      vars: [CARE_DATABASE_URL, UNSUPPORTED_PUBLIC_KEY]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --single-transaction
        -v public_key={{.UNSUPPORTED_PUBLIC_KEY | shellQuote}}
        -f tests/fixtures/identity/unsupported-passkey-seed.sql
  seed-retained-passkey:
    requires:
      vars: [CARE_DATABASE_URL, RETAINED_WEBAUTHN_ID, RETAINED_PUBLIC_KEY, RETAINED_SIGN_COUNT, RETAINED_USER_HANDLE]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --single-transaction
        -v webauthn_id={{.RETAINED_WEBAUTHN_ID | shellQuote}} -v public_key={{.RETAINED_PUBLIC_KEY | shellQuote}}
        -v sign_count={{.RETAINED_SIGN_COUNT | shellQuote}} -v user_handle={{.RETAINED_USER_HANDLE | shellQuote}}
        -f tests/fixtures/identity/rails-passkey-seed.sql
  expire-retained-factor-lock:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "UPDATE public.identity_onboarding SET legacy_totp_locked_until=now()-interval ''1 second'' WHERE account_id=71001"'
  fail-retained-factor-audit:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1
        -c "ALTER TABLE public.versions ADD CONSTRAINT browser_totp_audit_failure CHECK(event <> 'auth_token/totp/verified') NOT VALID;"
  age-retained-factor-use:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "UPDATE public.account_otp_keys SET last_use=now()-interval ''1 minute'' WHERE id=71001"'
  clear-adopted-onboarding:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "DELETE FROM public.identity_onboarding WHERE account_id=71001"'
  security-revocation-race:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -f tests/fixtures/identity/security-revocation-race.sql'
  security-factor-race:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -f tests/fixtures/identity/security-factor-race.sql'
  framework-session-peer:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align
        -c "SELECT ip_address FROM public.identity_sessions WHERE account_id=71001 ORDER BY created_at DESC LIMIT 1"
  expire-authentication-limits:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1
        -c "UPDATE public.identity_rate_limits SET expires_at=clock_timestamp()-interval '1 second'"
  age-framework-idle:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "UPDATE public.identity_sessions SET created_at=clock_timestamp()-interval ''2 days'',updated_at=clock_timestamp()-interval ''2 days'',expires_at=clock_timestamp()+interval ''1 day'' WHERE account_id=71001"'
  age-framework-absolute:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "UPDATE public.identity_sessions SET created_at=clock_timestamp()-interval ''29 days'',updated_at=clock_timestamp()-interval ''2 days'',expires_at=clock_timestamp()+interval ''1 day'' WHERE account_id=71001"'
  expire-framework-idle:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "UPDATE public.identity_sessions SET expires_at=clock_timestamp()-interval ''1 second'' WHERE account_id=71001"'
  age-pending-factor-session:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -c "UPDATE public.identity_sessions SET created_at=clock_timestamp()-interval ''4 minutes'',expires_at=clock_timestamp()+interval ''1 minute'' WHERE account_id=71001 AND additional_fields->>''legacy_factor_pending''=''true''"'
  framework-session-limits:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align
        -c "SELECT json_build_object('idle_seconds',extract(epoch FROM expires_at-clock_timestamp()),'within_absolute',expires_at<=created_at+interval '30 days','within_pending',expires_at<=created_at+interval '5 minutes') FROM public.identity_sessions WHERE account_id=71001 ORDER BY created_at DESC LIMIT 1"
  security-factor-race-ready:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align
        -c "SELECT EXISTS(SELECT 1 FROM pg_stat_activity WHERE datname=current_database() AND application_name='security-factor-race' AND xact_start IS NOT NULL AND state='active')"
  security-revocation-race-ready:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align
        -c "SELECT EXISTS(SELECT 1 FROM pg_stat_activity WHERE datname=current_database() AND application_name='security-revocation-race' AND xact_start IS NOT NULL AND state='active')"
  passkey-removal-race:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 -f tests/fixtures/identity/passkey-removal-race.sql'
  passkey-removal-race-ready:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align
        -c "SELECT EXISTS(SELECT 1 FROM pg_stat_activity WHERE datname=current_database() AND application_name='passkey-removal-race' AND xact_start IS NOT NULL AND state='active')"
  seed-foreign-passkey:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --single-transaction
        -c "INSERT INTO public.identity_passkeys(id,account_id,name,public_key,credential_id,counter,device_type,backed_up,transports,credential,aaguid,created_at,updated_at)
        SELECT gen_random_uuid()::text,71002,'Foreign synthetic device',public_key,'Zm9yZWlnbi1jcmVkZW50aWFs',counter,device_type,backed_up,transports,credential,aaguid,now(),now() FROM public.identity_passkeys WHERE account_id=71001 ORDER BY created_at LIMIT 1;"
  seed-administration:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --single-transaction
        -c "UPDATE public.household_memberships SET role='owner' WHERE id=74001;
        UPDATE public.people SET date_of_birth=current_date-interval '10 years' WHERE id=73002;
        INSERT INTO public.people(id,clinical_name,date_of_birth,person_type,has_capacity,created_at,updated_at) VALUES(73004,'Synthetic administration member',current_date-interval '30 years',0,true,now(),now());
        INSERT INTO public.accounts(id,person_id,name,email,status,created_at,updated_at) VALUES(71003,73004,'Synthetic administration member','administration-member@example.test',2,now(),now());
        INSERT INTO public.identity_provider_accounts(id,account_id,provider_id,provider_account_id,password,created_at,updated_at) VALUES('administration-member-credential',71003,'credential','71003',crypt('password',gen_salt('bf',4)),now(),now());
        INSERT INTO public.identity_onboarding(account_id,recovery_saved_at) VALUES(71003,now());
        INSERT INTO public.household_memberships(id,household_id,person_id,role,status,joined_at,created_at,updated_at) VALUES(74002,72001,73004,'member','active',now(),now(),now());"
  seed-platform:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - 'psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --single-transaction -f tests/fixtures/platform-seed.sql'
  platform-probe:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align
        -c "SELECT json_build_object(
        'admin_target',EXISTS(SELECT 1 FROM public.platform_admins WHERE account_id=71004 AND status='active'),
        'target_active',(SELECT active FROM public.users WHERE id=77006),
        'recovery_member_role',(SELECT role FROM public.household_memberships WHERE id=74601),
        'admin_membership_fabricated',EXISTS(SELECT 1 FROM public.household_memberships WHERE account_id=71001 AND household_id IN (72601,72602)),
        'invite_only',(SELECT COALESCE(bool_or(invite_only),false) FROM public.app_settings),
