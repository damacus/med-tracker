  seed:
    desc: Prepare the browser template through Loco migrations and seeds
    requires:
      vars: [CARE_DATABASE_URL]
    vars:
      BROWSER_BINARY:
        sh: task browser-care:binary
    cmds:
      - 'env DATABASE_URL={{.CARE_DATABASE_URL | shellQuote}} {{.BROWSER_BINARY | shellQuote}} db seed --environment test --from tests/fixtures/browser'
      - 'psql {{.CARE_DATABASE_URL | shellQuote}} -X -v ON_ERROR_STOP=1 -c "CREATE ROLE medtracker_browser_runtime LOGIN PASSWORD ''password'' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS IN ROLE med_tracker_app"'
  wizard-probe:
    requires:
      vars: [CARE_DATABASE_URL, WIZARD_NAME]
    cmds:
      - 'psql {{.CARE_DATABASE_URL | shellQuote}} -X -v ON_ERROR_STOP=1 --tuples-only --no-align -v name={{.WIZARD_NAME | shellQuote}} -f tests/fixtures/browser-wizard-probe.sql'
  probe:
    requires:
      vars: [CARE_DATABASE_URL]
    cmds:
      - >-
        psql "{{.CARE_DATABASE_URL}}" -X -v ON_ERROR_STOP=1 --tuples-only --no-align
        -c "SELECT json_build_object('supply',(SELECT current_supply::text FROM public.medications WHERE id=80001),'takes',(SELECT count(*) FROM public.medication_takes WHERE taken_from_medication_id=80001),'foreign_supply',(SELECT current_supply::text FROM public.medications WHERE id=80002),'foreign_takes',(SELECT count(*) FROM public.medication_takes WHERE taken_from_medication_id=80002),'runtime_superuser',(SELECT rolsuper FROM pg_roles WHERE rolname='{{.CARE_RUNTIME_ROLE | default "medtracker_browser_runtime"}}'),'runtime_bypassrls',(SELECT rolbypassrls FROM pg_roles WHERE rolname='{{.CARE_RUNTIME_ROLE | default "medtracker_browser_runtime"}}'),'stored_sessions',(SELECT count(*) FROM public.browser_sessions),'session_plaintext',(SELECT COALESCE(bool_or(session LIKE '%persistence@example.test%' OR session LIKE '%account_id%'),false) FROM public.browser_sessions),'registry_digests',(SELECT COALESCE(bool_and(token ~ '^[A-Za-z0-9_-]{43}=$'),false) FROM public.identity_sessions WHERE account_id=71001),'audit_session_digest',EXISTS(SELECT 1 FROM public.versions v JOIN public.identity_sessions s ON v.audit_context->>'session_reference'='browser_session:'||s.token WHERE s.account_id=71001 AND s.token ~ '^[A-Za-z0-9_-]{43}=$'),'registry_sessions',(SELECT count(*) FROM public.identity_sessions WHERE account_id=71001 AND active AND COALESCE(additional_fields->>'legacy_factor_pending','false')<>'true'),'active_sessions',(SELECT count(*) FROM public.identity_sessions WHERE account_id=71001 AND active AND COALESCE(additional_fields->>'legacy_factor_pending','false')<>'true' AND expires_at>clock_timestamp()));"
