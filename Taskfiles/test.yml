version: "3"
vars:
  ENV: test
includes:
  internal:
    taskfile: compose.yml
    dir: ..
    internal: true
tasks:
  invitation-mail:
    desc: "Deliver a browser invitation to disposable local SMTP capture"
    summary: |
      Usage: rtk task test:invitation-mail

      Requires the repository's native Rust, Node, Fish, Task and Docker tools.
      Creates a private PostgreSQL/RustFS/Mailpit project with random loopback
      ports and removes only that project's containers and volumes on exit.
      Mailpit has no relay or forwarding configuration; published ports bind
      only to 127.0.0.1.

      A synthetic household manager submits the existing browser invitation form.
      The normal PostgreSQL worker checks current permission and token validity,
      then sends through Loco MailerWorker to local SMTP capture. The check
      inspects sender, recipient, subject and body and opens the emailed token link
      on the configured local origin. An SMTP 421 Service unavailable response proves
      that job completion does not mean email delivery succeeded.
      Synthetic message MIME, parsed fields and delivery results are retained in
      target/invitation-mail/<run-id>/ after the disposable services are removed.

      MEDTRACKER_CAPTURE_MAIL remains false by default. Local test/development
      SMTP uses 127.0.0.1 and MEDTRACKER_SMTP_PORT. The synthetic sender comes from
      MEDTRACKER_INVITATION_MAIL_FROM; links use MEDTRACKER_PUBLIC_ORIGIN.
      For the Docker development stack, run:
      env MEDTRACKER_CAPTURE_MAIL=true task dev:up
      This starts Mailpit and connects dev-app through its container address.
      MEDTRACKER_SMTP_PORT configures both container SMTP endpoints in that mode;
      direct host runs keep the default 127.0.0.1 SMTP address.
      This is local SMTP evidence, not provider acceptance or inbox delivery.
    cmds:
      - fish --no-config scripts/invitation_mail.fish
  up:
    desc: "Local test up"
    cmds: [{task: "internal:up"}]
  down:
    desc: "Local test down"
    cmds: [{task: "internal:down"}]
  restart:
    desc: "Local test restart"
    cmds: [{task: "internal:restart"}]
  logs:
    desc: "Local test logs"
    cmds: [{task: "internal:logs"}]
  ps:
    desc: "Local test ps"
    cmds: [{task: "internal:ps"}]
  build:
    desc: "Local test build"
    cmds: [{task: "internal:build"}]
  seed:
    desc: "Local test seed"
    cmds: [{task: "internal:seed"}]
  reset:
    desc: "Local test reset"
    cmds: [{task: "internal:reset"}]
  unit:
    desc: "Run Docker unit tests; TARGET and FILTER narrow selection"
    cmds:
      - task: internal:build
      - task: internal:caches
      - task: run
        vars:
          COMMAND: 'cargo nextest run --locked --no-tests=fail --lib {{if .TARGET}}--package {{.TARGET | shellQuote}}{{else}}--workspace{{end}} {{.FILTER | default "" | shellQuote}}'
      - task: unit-extras
  integration:
    desc: "Run Docker integration tests; TARGET and FILTER narrow selection"
    vars:
      API_RUN_ID:
        sh: uuidgen
    cmds:
      - defer:
          task: run
          vars:
            COMMAND: 'env MEDTRACKER_TEST_RUN_ID={{.API_RUN_ID | shellQuote}} cargo run --locked --example api-fixtures -- cleanup'
      - task: internal:build
      - task: internal:caches
      - task: internal:services
      - task: run
        vars:
          COMMAND: 'env MEDTRACKER_TEST_RUN_ID={{.API_RUN_ID | shellQuote}} cargo nextest run --locked --profile api --no-tests=fail {{if .TARGET}}--test {{.TARGET | shellQuote}}{{else}}--test "*"{{end}} {{.FILTER | default "" | shellQuote}} {{.CLI_ARGS}}'
      - task: acceptance-process
  browser:
    desc: "Run Docker browser tests; TARGET and FILTER narrow selection"
    cmds:
      - task: internal:build
      - task: internal:caches
      - task: internal:services
      - task: run
        vars:
          COMMAND: 'cargo nextest run --locked --no-tests=fail --test {{.TARGET | default "browser" | shellQuote}} --run-ignored only {{.FILTER | default "" | shellQuote}}'
  run:
    internal: true
    run: always
    requires: {vars: [COMMAND]}
    cmds:
      - task: internal:run
        vars: {COMMAND: '{{.COMMAND}}'}
  unit-extras:
    internal: true
    status: ['test -n {{.FILTER | default "" | shellQuote}}']
    cmds:
      - task: run
        vars:
          COMMAND: node --test tests/browser/appearance.test.mjs tests/browser/profile-push-worker.test.mjs tests/browser/dashboard-cancellation.test.mjs
      - task: run
        vars: {COMMAND: cargo test --locked --workspace --doc}
  acceptance-process:
    internal: true
    status: ['test -n {{printf "%s%s%s" (.TARGET | default "") (.FILTER | default "") .CLI_ARGS | shellQuote}}']
    cmds:
      - task: run
        vars:
          COMMAND: cargo test --locked --test template_concurrency competing_processes_prepare_once -- --ignored --exact
