version: "3"
tasks:
  install:
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds: [npm ci]
  lock:
    cmds: [npm install --package-lock-only --ignore-scripts]
  deps:watcher:
    cmds: [npm update @parcel/watcher --package-lock-only --ignore-scripts]
  audit:
    cmds: [npm audit --json]
  build:
    sources:
      - package.json
      - package-lock.json
      - assets/static/css/app.css
      - assets/static/css/themes.css
      - assets/static/css/fonts.css
      - assets/static/css/platform.css
      - assets/static/css/shared-layout.css
      - assets/static/css/administration.css
      - assets/views/**/*.html
      - assets/static/js/*.js
      - exclude: assets/static/js/html5-qrcode.min.js
      - node_modules/html5-qrcode/html5-qrcode.min.js
    generates:
      - assets/static/css/compiled.css
      - assets/static/js/html5-qrcode.min.js
    cmds:
      - ./node_modules/.bin/tailwindcss -i assets/static/css/app.css -o assets/static/css/compiled.css --minify
      - cp node_modules/html5-qrcode/html5-qrcode.min.js assets/static/js/html5-qrcode.min.js
  prepare:
    cmds:
      - task: install
      - task: build
  test:
    cmds:
      [
        node --test tests/browser/appearance.test.mjs tests/browser/profile-push-worker.test.mjs tests/browser/canary-status.test.mjs,
      ]
