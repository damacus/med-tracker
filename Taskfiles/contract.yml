---
version: "3"

tasks:
  prepare-db:
    desc: Create the disposable contract database in the isolated test PostgreSQL container
    cmds:
      - task: :internal:up-db
        vars: { ENVIRONMENT: test }
      - task: :internal:run
        vars:
          ENVIRONMENT: test
          SERVICE: db-test
          COMMAND: env PGPASSWORD=medtracker_password psql -v ON_ERROR_STOP=1 -h db-test -U medtracker -d medtracker -f /contract-db.sql

  run:
    desc: Run API black-box cases against a checked target and fixture
    requires:
      vars: [BASE_URL, FIXTURE_PATH]
    env:
      CONTRACT_BASE_URL: '{{ .BASE_URL }}'
      CONTRACT_FIXTURE_PATH: '{{ .FIXTURE_PATH }}'
      CONTRACT_APPROVED_ORIGIN: '{{ .APPROVED_ORIGIN | default "" }}'
    cmds:
      - cargo test --manifest-path rust/contract-tests/Cargo.toml --lib --test auth --test care --test medication_stock --test dosage_health --test schedules --test assignments --test doses --test reviews --test oauth --test envelopes --no-fail-fast -- --test-threads=1

  run-reviews:
    desc: Run medication review prompt cases against a checked target and fixture
    requires:
      vars: [BASE_URL, FIXTURE_PATH]
    env:
      CONTRACT_BASE_URL: '{{ .BASE_URL }}'
      CONTRACT_FIXTURE_PATH: '{{ .FIXTURE_PATH }}'
      CONTRACT_APPROVED_ORIGIN: '{{ .APPROVED_ORIGIN | default "" }}'
    cmds:
      - cargo test --manifest-path rust/contract-tests/Cargo.toml --test reviews -- --test-threads=1

  run-care:
    desc: Run people, grant, and location cases against a checked target and fixture
    requires:
      vars: [BASE_URL, FIXTURE_PATH]
    env:
      CONTRACT_BASE_URL: '{{ .BASE_URL }}'
      CONTRACT_FIXTURE_PATH: '{{ .FIXTURE_PATH }}'
      CONTRACT_APPROVED_ORIGIN: '{{ .APPROVED_ORIGIN | default "" }}'
    cmds:
      - cargo test --manifest-path rust/contract-tests/Cargo.toml --test care -- --test-threads=1

  run-doses:
    desc: Run dose outcome and medication take cases against a checked target and fixture
    requires:
      vars: [BASE_URL, FIXTURE_PATH]
    env:
      CONTRACT_BASE_URL: '{{ .BASE_URL }}'
      CONTRACT_FIXTURE_PATH: '{{ .FIXTURE_PATH }}'
      CONTRACT_APPROVED_ORIGIN: '{{ .APPROVED_ORIGIN | default "" }}'
    cmds:
      - cargo test --manifest-path rust/contract-tests/Cargo.toml --test doses -- --test-threads=1

  run-dose-precision:
    desc: Probe fractional medication-take timestamp precision against a checked target
    requires:
      vars: [BASE_URL, FIXTURE_PATH]
    env:
      CONTRACT_BASE_URL: '{{ .BASE_URL }}'
      CONTRACT_FIXTURE_PATH: '{{ .FIXTURE_PATH }}'
      CONTRACT_APPROVED_ORIGIN: '{{ .APPROVED_ORIGIN | default "" }}'
    cmds:
      - cargo test --manifest-path rust/contract-tests/Cargo.toml --test doses -- --exact medication_take_preserves_fractional_second_timestamp --ignored --test-threads=1

  run-assignments:
    desc: Run direct-assignment and pause-period cases against a checked target and fixture
    requires:
      vars: [BASE_URL, FIXTURE_PATH]
    env:
      CONTRACT_BASE_URL: '{{ .BASE_URL }}'
      CONTRACT_FIXTURE_PATH: '{{ .FIXTURE_PATH }}'
      CONTRACT_APPROVED_ORIGIN: '{{ .APPROVED_ORIGIN | default "" }}'
    cmds:
      - cargo test --manifest-path rust/contract-tests/Cargo.toml --test assignments -- --test-threads=1

  run-assignment-precision:
    desc: Demonstrate the expected-failing Rails direct-assignment decimal precision case
    requires:
      vars: [BASE_URL, FIXTURE_PATH]
    env:
      CONTRACT_BASE_URL: '{{ .BASE_URL }}'
      CONTRACT_FIXTURE_PATH: '{{ .FIXTURE_PATH }}'
      CONTRACT_APPROVED_ORIGIN: '{{ .APPROVED_ORIGIN | default "" }}'
    cmds:
      - cargo test --manifest-path rust/contract-tests/Cargo.toml --test assignments -- --ignored --exact assignment_preserves_three_decimal_dose_amount --test-threads=1

  run-schedules:
    desc: Run schedule cases against a checked target and fixture
    requires:
      vars: [BASE_URL, FIXTURE_PATH]
    env:
      CONTRACT_BASE_URL: '{{ .BASE_URL }}'
      CONTRACT_FIXTURE_PATH: '{{ .FIXTURE_PATH }}'
      CONTRACT_APPROVED_ORIGIN: '{{ .APPROVED_ORIGIN | default "" }}'
    cmds:
      - cargo test --manifest-path rust/contract-tests/Cargo.toml --test schedules -- --test-threads=1

  run-schedule-precision:
    desc: Run the expected-failing Rails schedule precision case against a checked target
    requires:
      vars: [BASE_URL, FIXTURE_PATH]
    env:
      CONTRACT_BASE_URL: '{{ .BASE_URL }}'
      CONTRACT_FIXTURE_PATH: '{{ .FIXTURE_PATH }}'
      CONTRACT_APPROVED_ORIGIN: '{{ .APPROVED_ORIGIN | default "" }}'
    cmds:
      - cargo test --manifest-path rust/contract-tests/Cargo.toml --test schedules -- --ignored --exact schedule_preserves_fractional_min_hours_between_doses --test-threads=1

  run-dosage-health:
    desc: Run dosage-option and health-event cases against a checked target and fixture
    requires:
      vars: [BASE_URL, FIXTURE_PATH]
    env:
      CONTRACT_BASE_URL: '{{ .BASE_URL }}'
      CONTRACT_FIXTURE_PATH: '{{ .FIXTURE_PATH }}'
      CONTRACT_APPROVED_ORIGIN: '{{ .APPROVED_ORIGIN | default "" }}'
    cmds:
      - cargo test --manifest-path rust/contract-tests/Cargo.toml --test dosage_health -- --test-threads=1

  run-dosage-health-privacy:
    desc: Run the expected-failing dosage privacy case against a checked target and fixture
    requires:
      vars: [BASE_URL, FIXTURE_PATH]
    env:
      CONTRACT_BASE_URL: '{{ .BASE_URL }}'
      CONTRACT_FIXTURE_PATH: '{{ .FIXTURE_PATH }}'
      CONTRACT_APPROVED_ORIGIN: '{{ .APPROVED_ORIGIN | default "" }}'
    cmds:
      - cargo test --manifest-path rust/contract-tests/Cargo.toml --test dosage_health -- --ignored --exact dosage_option_collection_hides_ungranted_medication --test-threads=1

  run-dosage-health-default-validation:
    desc: Run the expected-failing duplicate adult dosage default validation case
    requires:
      vars: [BASE_URL, FIXTURE_PATH]
    env:
      CONTRACT_BASE_URL: '{{ .BASE_URL }}'
      CONTRACT_FIXTURE_PATH: '{{ .FIXTURE_PATH }}'
      CONTRACT_APPROVED_ORIGIN: '{{ .APPROVED_ORIGIN | default "" }}'
    cmds:
      - cargo test --manifest-path rust/contract-tests/Cargo.toml --test dosage_health -- --ignored --exact dosage_option_duplicate_adult_default_returns_validation_error --test-threads=1

  run-health-event-kind-validation:
    desc: Run the expected-failing invalid health-event kind validation case
    requires:
      vars: [BASE_URL, FIXTURE_PATH]
    env:
      CONTRACT_BASE_URL: '{{ .BASE_URL }}'
      CONTRACT_FIXTURE_PATH: '{{ .FIXTURE_PATH }}'
      CONTRACT_APPROVED_ORIGIN: '{{ .APPROVED_ORIGIN | default "" }}'
    cmds:
      - cargo test --manifest-path rust/contract-tests/Cargo.toml --test dosage_health -- --ignored --exact health_event_invalid_kind_returns_validation_error --test-threads=1

  oauth:
    desc: Run OAuth black-box cases against a checked target and fixture
    requires:
      vars: [BASE_URL, FIXTURE_PATH]
    env:
      CONTRACT_BASE_URL: '{{ .BASE_URL }}'
      CONTRACT_FIXTURE_PATH: '{{ .FIXTURE_PATH }}'
      CONTRACT_APPROVED_ORIGIN: '{{ .APPROVED_ORIGIN | default "" }}'
    cmds:
      - cargo test --manifest-path rust/contract-tests/Cargo.toml --test oauth -- --test-threads=1

  fmt:
    desc: Format the black-box test crate
    cmds:
      - cargo fmt --manifest-path rust/contract-tests/Cargo.toml --all

  clippy:
    desc: Lint the black-box test crate
    cmds:
      - cargo clippy --manifest-path rust/contract-tests/Cargo.toml --all-targets -- -D warnings

  rails:
    desc: Provision disposable test fixtures and run API contract cases against isolated Rails
    cmds:
      - fish rust/contract-tests/run.fish rails

  oauth-rails:
    desc: Run OAuth contract cases against isolated Rails
    cmds:
      - fish rust/contract-tests/run.fish rails oauth

  dosage-health-rails:
    desc: Run dosage-option and health-event cases against isolated Rails
    cmds:
      - fish rust/contract-tests/run.fish rails dosage-health

  schedules-rails:
    desc: Run schedule cases against isolated Rails
    cmds:
      - fish rust/contract-tests/run.fish rails schedules

  assignments-rails:
    desc: Run direct-assignment and pause-period cases against isolated Rails
    cmds:
      - fish rust/contract-tests/run.fish rails assignments

  doses-rails:
    desc: Run dose outcome and medication take cases against isolated Rails
    cmds:
      - fish rust/contract-tests/run.fish rails doses

  reviews-rails:
    desc: Run medication review prompt cases against isolated Rails
    cmds:
      - fish rust/contract-tests/run.fish rails reviews

  care-rails:
    desc: Run people, grant, and location cases against isolated Rails
    cmds:
      - fish rust/contract-tests/run.fish rails care

  dose-precision-rails:
    desc: Demonstrate Rails medication-take timestamp precision
    cmds:
      - fish rust/contract-tests/run.fish rails dose-precision

  assignment-precision-rails:
    desc: Demonstrate Rails' current assignment decimal precision limit
    cmds:
      - fish rust/contract-tests/run.fish rails assignment-precision

  schedule-precision-rails:
    desc: Demonstrate Rails' current loss of fractional schedule minimum hours
    cmds:
      - fish rust/contract-tests/run.fish rails schedule-precision

  dosage-health-privacy-rails:
    desc: Demonstrate the currently failing Rails dosage privacy case
    cmds:
      - fish rust/contract-tests/run.fish rails dosage-health-privacy

  dosage-health-default-validation-rails:
    desc: Demonstrate the currently failing Rails duplicate adult dosage default validation case
    cmds:
      - fish rust/contract-tests/run.fish rails dosage-health-default-validation

  health-event-kind-validation-rails:
    desc: Demonstrate the currently failing Rails invalid health-event kind validation case
    cmds:
      - fish rust/contract-tests/run.fish rails health-event-kind-validation

  rust:
    desc: Run API contract cases against a Rust URL after provisioning isolated Rails fixtures
    env:
      CONTRACT_RUST_URL: '{{ .RUST_URL | default "http://127.0.0.1:39999" }}'
      CONTRACT_RUST_APPROVED_ORIGIN: '{{ .APPROVED_ORIGIN | default "" }}'
    cmds:
      - fish rust/contract-tests/run.fish rust
