version: "3"

tasks:
  prepare:
    desc: Compile application and integration binaries once and prepare frontend assets
    run: once
    status:
      - 'test "$LOCO_CI_ARTIFACT" = "1" && test -x target/ci/med-tracker && test -f target/ci/loco-tests.tar.zst && test -f target/ci/tests.json && test -f assets/static/css/compiled.css && test -f assets/static/js/html5-qrcode.min.js'
    cmds:
      - task: :frontend:prepare
      - node scripts/ci/loco-build.mjs
      - node scripts/ci/loco-compiled-units.mjs
  acceptance:
    deps: [':lint', ':test:acceptance']
  report:
    desc: Summarise Loco stage and fixture timings
    cmds: [node scripts/ci/loco-report.mjs]
  package:
    desc: Package prepared executables and assets without duplicating binaries in the Cargo cache
    cmds:
      - tar -czf target/loco-tests.tar.gz target/ci assets/static/css/compiled.css assets/static/js/html5-qrcode.min.js
      - node -e "require('node:fs').rmSync('target/ci', { recursive:true, force:true })"
  cached-build:
    desc: Build using an optional machine-wide sccache instead of Cargo incremental compilation
    preconditions:
      - sh: command -v sccache
        msg: Install sccache before selecting the shared compiler cache
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: '0'
    cmds:
      - task: :build
      - sccache --show-stats
  rust-port:
    desc: Check Rust dashboard UI, API, web and contract-test compilation
    cmds:
      - task -d rust/ui-preview fmt
      - task -d rust/ui-preview test
      - task -d rust/ui-preview lint
      - task -d rust/ui-preview build
      - task: :api:fmt
      - task: :api:clippy
      - task: :api:test
      - cargo test --manifest-path rust/web/Cargo.toml
      - cargo check --manifest-path rust/contract-tests/Cargo.toml --all-targets

  test:
    desc: Test CI scripts with Node, without Rails or Docker
    cmds:
      - task: :frontend:install
      - node --test "scripts/ci/tests/*.test.mjs"

  coverage:test:
    desc: Verify coverage collation without loading Rails or RSpec
    cmds:
      - task: :rails:internal:run
        vars:
          ENVIRONMENT: test
          SERVICE: tools-test
          COMMAND: env RAILS_APPLICATION_ROOT=/app bundle exec ruby /workspace/scripts/ci/tests/coverage.rb
  coverage:lint:
    desc: Lint shared Rails coverage helpers
    cmds:
      - task: :rails:internal:run
        vars:
          ENVIRONMENT: test
          SERVICE: tools-test
          COMMAND: bundle exec rubocop --config /app/.rubocop.yml /workspace/scripts/ci/collate_simplecov.rb /workspace/scripts/ci/tests/coverage.rb

  classify:
    desc: Select mandatory CI suites from the changed paths
    cmds:
      - node scripts/ci/classify.mjs

  paths:
    desc: Reject tracked files that have no CI suite mapping
    cmds:
      - node scripts/ci/tracked_paths.mjs

  gate:
    desc: Require every selected CI suite to succeed
    cmds:
      - node scripts/ci/gate.mjs

  markdown:
    desc: Check changed Markdown syntax and whitespace
    cmds:
      - node scripts/ci/markdown.mjs

  check:
    desc: Validate GitHub Actions workflows and CI scripts
    cmds:
      - actionlint
      - node --check scripts/ci/classify.mjs
      - node --check scripts/ci/gate.mjs
      - node --check scripts/ci/markdown.mjs
      - node scripts/ci/contract_compose_regression.mjs
      - node scripts/ci/task_exec_regression.mjs
      - task: test
