components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    household_id:
      name: household_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NumericId'
    id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NumericId'
    resource_id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceIdentifier'
    native_device_token:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DeviceTokenIdentifier'
    push_subscription_endpoint:
      name: endpoint
      in: query
      required: true
      schema:
        type: string
        format: uri
        pattern: '^https://'
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    per_page:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    updated_since:
      name: updated_since
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Timestamp'
    if_match:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
  headers:
    etag:
      description: Version identifier for optimistic concurrency.
      required: true
      schema:
        type: string
    retry_after:
      description: Seconds until the request may be retried.
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: A required request parameter is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: The bearer credential is absent, invalid, expired, revoked, or no longer active.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The credential cannot perform the operation in the routed household or person scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AdminWriteForbidden:
      description: The credential cannot manage the household, or fresh MFA or OIDC MFA proof is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminWriteForbiddenErrorEnvelope'
    NotFound:
      description: The resource does not exist inside the authorized scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: The submitted attributes or filters are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: The resource or idempotency state conflicts with the requested mutation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionRequired:
      description: The mutation requires a version precondition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: The request exceeded an API rate limit.
      headers:
        Retry-After:
          $ref: '#/components/headers/retry_after'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitErrorEnvelope'
  schemas:
    NumericId:
      type: integer
      minimum: 1
    PortableId:
      type: string
      format: uuid
    ResourceIdentifier:
      oneOf:
        - $ref: '#/components/schemas/NumericId'
        - $ref: '#/components/schemas/PortableId'
    DeviceTokenIdentifier:
      type: string
      minLength: 1
    NullableNumericId:
      oneOf:
        - $ref: '#/components/schemas/NumericId'
        - type: 'null'
    NullablePortableId:
      oneOf:
        - $ref: '#/components/schemas/PortableId'
        - type: 'null'
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      oneOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    Date:
      type: string
      format: date
    DecimalValue:
      oneOf:
        - type: number
        - type: string
          pattern: '^-?[0-9]+(?:\.[0-9]+)?$'
    NullableDecimalValue:
      oneOf:
        - $ref: '#/components/schemas/DecimalValue'
        - type: 'null'
    PaginationMeta:
      type: object
      additionalProperties: false
      required:
        - page
        - per_page
        - total_count
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total_count:
          type: integer
          minimum: 0
    PersonAttributes:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        email:
          type:
            - string
            - 'null'
          format: email
        date_of_birth:
          $ref: '#/components/schemas/Date'
        person_type:
          type: string
          enum:
            - adult
            - minor
            - dependent_adult
        has_capacity:
          type: boolean
    HouseholdAdminSettings:
