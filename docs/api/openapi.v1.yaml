            - $ref: '#/components/schemas/PersonAttributes'
            - required:
                - name
                - date_of_birth
    PersonUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - person
      properties:
        person:
          $ref: '#/components/schemas/PersonAttributes'
    PersonResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Person'
    PersonCollectionResponse:
      type: object
      additionalProperties: false
      required:
        - data
