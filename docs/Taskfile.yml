---
version: "3"

tasks:
  install:
    internal: true
    dir: "{{.TASKFILE_DIR}}/../docs-site"
    cmds:
      - bundle check || bundle install
      - npm ci

  serve:
    dir: "{{.TASKFILE_DIR}}/../docs-site"
    desc: Serve documentation locally with live reload
    deps: [install]
    cmds:
      - npm run build
      - bundle exec bridgetown start --bind 127.0.0.1 --skip-frontend

  build:
    dir: "{{.TASKFILE_DIR}}/../docs-site"
    desc: Build static documentation site
    deps: [install]
    env:
      BRIDGETOWN_ENV: production
    cmds:
      - npm run build
      - bundle exec bridgetown build
      - test -s output/pagefind/pagefind-entry.json
      - rsync -a --delete output/ ../site/
      - bundle exec ruby scripts/check.rb
