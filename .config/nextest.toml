experimental = ["setup-scripts"]

[scripts.setup.api-fixtures]
command = ["cargo", "run", "--locked", "--example", "api-fixtures", "--", "prepare"]

[test-groups.api-global]
max-threads = 1

[profile.default]
test-threads = 4

[[profile.default.overrides]]
filter = 'binary(=migration_roles)'
priority = 100
threads-required = "num-test-threads"

[profile.api]
inherits = "default"
test-threads = 8
fail-fast = false

[[profile.api.scripts]]
filter = 'binary(=shared_api) | binary(=care_api) | binary(=care_doses) | binary(=care_medications) | binary(=identity_resource) | binary(=identity_compatibility) | binary(=tenant_access) | binary(=migration_roles) | binary(=oauth_server) | binary(=queue_runtime) | binary(=persistence) | binary(=requests)'
setup = 'api-fixtures'

