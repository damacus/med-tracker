[workspace]
members = ["migration"]
exclude = ["rust", "client-tools"]

[package]
name = "med-tracker"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
default-run = "med-tracker"

[dependencies]
loco-rs = { version = "=1.2.0", default-features = false, features = ["cli", "with-db", "worker"] }
async-trait = "0.1"
aws-sdk-s3 = { version = "=1.146.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "rustls", "behavior-version-latest"] }
base64 = "=0.23.1"
bcrypt = "=0.19.3"
better-auth = { git = "https://github.com/better-auth-rs/better-auth-rs", rev = "9f91cd7fdb8a5f73a9c69d5c56d363468a7dc281", default-features = false, features = ["axum", "rustls"] }
better-auth-core = { git = "https://github.com/better-auth-rs/better-auth-rs", rev = "9f91cd7fdb8a5f73a9c69d5c56d363468a7dc281" }
openidconnect = "=4.0.1"
cedar-policy = { version = "=4.13.0", default-features = false }
headers = "=0.4.2"
hex = "=0.4.3"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
md-5 = "=0.11.0"
hmac = "=0.13.0"
totp-rs = { version = "=6.0.0", features = ["otpauth"] }
oxide-auth = "=0.6.1"
oxide-auth-async = "=0.2.1"
serde_urlencoded = "=0.7.1"
url = "=2.5.8"
subtle = "=2.6.1"
webauthn-rs-core = "=0.5.5"
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
web-push = { version = "=0.11.0", default-features = false, features = ["hyper-client"] }
zip = { version = "=9.0.0", default-features = false }
serde_cbor_2 = "0.13"
getrandom = "=0.4.3"
ulid = "=1.2.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
axum = { version = "0.8", features = ["multipart"] }
axum_session = "=0.21.0"
axum_session_sqlx = { version = "=0.11.0", default-features = false, features = ["postgres", "tls-rustls"] }
axum_csrf = { version = "=0.11.0", features = ["layer"] }
tower-http = { version = "=0.7.1", default-features = false, features = ["csrf"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-json", "with-rust_decimal"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "=0.1.44"
slug = "=0.1.6"
sghtmltopdf = { version = "=0.5.1", default-features = false, features = ["cli"] }
serde_yaml_ng = "=0.10.0"
migration = { path = "migration" }

[dev-dependencies]
loco-rs = { version = "=1.2.0", default-features = false, features = ["testing"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }

[features]
cutover-rehearsal = []

[[test]]
name = "cutover"
path = "tests/rehearsal/cutover.rs"
required-features = ["cutover-rehearsal"]
