[workspace]
members = ["migration"]
exclude = ["rust", "client-tools"]

[package]
name = "med-tracker"
version = "0.6.5"
edition = "2024"
rust-version = "1.94.1"
publish = false
default-run = "med-tracker"

[dependencies]
loco-rs = { version = "=1.3.1", default-features = false, features = [
    "cli",
    "with-db",
    "db-postgres",
    "mailer",
    "worker",
    "multi-tenancy",
    "storage_aws_s3",
] }
async-trait = "0.1"
opendal = { version = "=0.58.2", default-features = false, features = [
    "http-transport-reqwest",
    "services-s3",
] }
opendal-http-transport-reqwest = "=0.58.2"
bytes = "=1.12.1"
futures-util = "=0.3.34"
md-5 = "=0.11.0"
quick-xml = "=0.41.0"
regex = "=1.13.1"
tempfile = "3"
zip = { version = "=9.5.1", default-features = false, features = ["deflate"] }
aes-gcm = "=0.11.1"
base64 = "=0.23.1"
bcrypt = "=0.19.3"
better-auth = { version = "=1.0.0-alpha.5", default-features = false, features = [
    "axum",
    "rustls",
    "seaorm2",
] }
better-auth-core = { version = "=1.0.0-alpha.5" }
better-auth-seaorm = "=1.0.0-alpha.5"
cedar-policy = { version = "=4.14.1", default-features = false }
headers = "=0.4.2"
hex = "=0.4.3"
image = { version = "=0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
hmac = "=0.13.0"
oxide-auth = "=0.6.1"
oxide-auth-async = "=0.2.1"
serde_urlencoded = "=0.7.1"
url = "=2.5.8"
percent-encoding = "=2.3.2"
pbkdf2 = "=0.13.0"

web-push = { version = "=0.11.0", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = [
    "json",
    "rustls",
] }
getrandom = "=0.4.3"
ulid = "=3.0.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "=4.6.7", features = ["derive", "env"] }
axum = { version = "0.8", features = ["multipart"] }
axum_session = "=0.23.1"
axum_session_sqlx = { version = "=0.13.0", default-features = false, features = [
    "postgres",
    "tls-rustls",
] }
axum_csrf = { version = "=0.12.0", features = ["layer"] }
tower-http = { version = "=0.7.1", default-features = false, features = [
    "csrf",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
scraper = "=0.29.0"
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
sea-orm = { version = "=2.0.4", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-chrono",
    "with-json",
    "with-rust_decimal",
] }
time = "=0.3.55"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
opentelemetry = "=0.33.1"
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = [
    "trace",
    "metrics",
    "rt-tokio",
    "testing",
] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls",
    "trace",
    "metrics",
    "internal-logs",
] }
tracing-opentelemetry = "=0.34.0"
slug = "=0.1.6"
sghtmltopdf = { version = "=0.6.1", default-features = false, features = [
    "cli",
] }
serde_yaml_ng = "=0.10.0"
migration = { path = "migration" }

[package.metadata.db.entity]
ignore-tables = "account_active_session_keys,account_login_change_keys,account_password_reset_keys,account_remember_keys,account_verification_keys"

[dev-dependencies]
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "metrics"] }
prost = "=0.14.6"
josekit = "=0.10.3"
base32 = "=0.5.1"
iri-string = { version = "=0.7.14", default-features = false }
loco-rs = { version = "=1.3.1", default-features = false, features = [
    "testing",
] }
proptest = "=1.12.0"
regex = "=1.13.1"
playwright-rs = { version = "=0.20.1", default-features = false, features = [
    "macros",
    "ring",
    "rustls-tls-webpki-roots",
] }

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package."*"]
opt-level = 1
