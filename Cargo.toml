[workspace]
members = ["migration"]
exclude = ["rust", "client-tools"]

[package]
name = "med-tracker"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
default-run = "med-tracker"

[dependencies]
loco-rs = { version = "=1.2.0", default-features = false, features = ["cli", "with-db", "worker"] }
async-trait = "0.1"
base64 = "=0.22.1"
bcrypt = "=0.19.3"
headers = "=0.4.1"
hex = "=0.4.3"
oxide-auth = "=0.6.1"
oxide-auth-async = "=0.2.1"
serde_urlencoded = "=0.7.1"
url = "=2.5.8"
subtle = "=2.6.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
axum = "0.8"
axum_session = "=0.21.0"
axum_session_sqlx = { version = "=0.11.0", default-features = false, features = ["postgres", "tls-rustls"] }
axum_csrf = { version = "=0.11.0", features = ["layer"] }
tower-http = { version = "=0.7.1", default-features = false, features = ["csrf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-json", "with-rust_decimal"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
migration = { path = "migration" }

[dev-dependencies]
loco-rs = { version = "=1.2.0", default-features = false, features = ["testing"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
