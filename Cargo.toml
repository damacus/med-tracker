[workspace]
members = ["migration"]
exclude = ["rust", "client-tools"]

[package]
name = "med-tracker"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
default-run = "med-tracker"

[dependencies]
loco-rs = { version = "=1.2.0", default-features = false, features = ["cli", "with-db", "worker"] }
async-trait = "0.1"
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
migration = { path = "migration" }

[dev-dependencies]
loco-rs = { version = "=1.2.0", default-features = false, features = ["testing"] }
