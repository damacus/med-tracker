[workspace]
members = ["migration"]
exclude = ["rust", "client-tools"]

[package]
name = "med-tracker"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
default-run = "med-tracker"

[dependencies]
loco-rs = { version = "=1.2.0", default-features = false, features = ["cli", "with-db", "worker"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-json", "with-rust_decimal"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
migration = { path = "migration" }

[dev-dependencies]
loco-rs = { version = "=1.2.0", default-features = false, features = ["testing"] }
