Rails/OutputSafety:
  Exclude:
    - "app/components/reports/pdf_stylesheet.rb"
    - "spec/services/reports/pdf_renderer_spec.rb"

Rails/SkipsModelValidations:
  Exclude:
    - "spec/models/medication_dose_occurrence_spec.rb"
    - "spec/migrations/add_window_end_to_medication_dose_occurrences_spec.rb"

RSpec/ExampleLength:
  Max: 15
  Exclude:
    - "spec/system/**/*"
    - "spec/features/**/*"
    - "spec/requests/**/*"

RSpec/MultipleExpectations:
  Max: 5
  Exclude:
    - "spec/system/**/*"
    - "spec/features/**/*"
    - "spec/requests/**/*"

RSpec/MultipleMemoizedHelpers:
  Max: 5
  Exclude:
    - "spec/system/authorization/**/*"
    - "spec/policies/**/*"

RSpec/NestedGroups:
  Max: 3
  Exclude:
    - "spec/policies/**/*"

Metrics/BlockLength:
  Max: 100
  Exclude:
    - "test/system/playwright/**/*"
    - "spec/**/*_spec.rb"
    - "config/routes.rb"
  AllowedMethods:
    - test

Metrics/ClassLength:
  Max: 200
  Exclude:
    - "test/system/playwright/**/*"
    - "test/**/*_test.rb"
    - "db/migrate/**/*"
    - "app/components/**/*"
    - "app/controllers/**/*"

Metrics/MethodLength:
  Max: 15
  Exclude:
    - "test/system/playwright/**/*"
    - "db/migrate/**/*"
    - "app/views/**/*"
    - "app/components/**/*"
    - "app/controllers/**/*"

Metrics/AbcSize:
  Exclude:
    - "test/system/playwright/**/*"
    - "db/migrate/**/*"
    - "app/controllers/**/*"
    - "app/models/**/*"
    - "app/components/**/*"

Metrics/CyclomaticComplexity:
  Exclude:
    - "app/components/ruby_ui/**/*"

RSpec/DescribeClass:
  Exclude:
    - "spec/features/**/*"
    - "spec/requests/**/*"
    - "spec/system/**/*"
    - "spec/architecture/**/*"

# Disable documentation requirement - not always necessary for Rails apps
Style/Documentation:
  Enabled: false

# Allow long lines in certain contexts
Layout/LineLength:
  Max: 120
  Exclude:
    - "config/**/*"
    - "db/**/*"
    - "app/views/**/*"
    - "app/controllers/**/*"
    - "app/components/ruby_ui/**/*"
    - "app/components/icons/**/*"

# Allow case-when for size classes in UI components
Style/HashLikeCase:
  Exclude:
    - "app/components/ruby_ui/**/*"

# Allow missing super in component base classes
Lint/MissingSuper:
  Exclude:
    - "app/components/**/*"

# Allow variable numbers in test fixtures
Naming/VariableNumber:
  Exclude:
    - "test/**/*"

# Allow single-letter form parameter names (f) in components
Naming/MethodParameterName:
  Exclude:
    - "app/components/**/*"
