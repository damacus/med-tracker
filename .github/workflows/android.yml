name: Android

"on":
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'docs/api/openapi.v1.yaml'
      - 'Taskfile.yml'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'docs/api/openapi.v1.yaml'
      - 'Taskfile.yml'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: 3.52.0
          repo-token: ${{ github.token }}
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Fish
        run: sudo apt-get install --yes fish
      - name: Verify Gradle JDK 17
        run: task android:jvm:check
      - name: Verify Android
        run: task android:ci
