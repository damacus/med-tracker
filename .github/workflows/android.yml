name: Android

"on":
  workflow_call:
    outputs:
      android:
        description: Android validation job result
        value: ${{ jobs.android.outputs.result }}

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.verified.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: 3.52.0
          repo-token: ${{ github.token }}
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Fish
        run: sudo apt-get install --yes fish
      - name: Verify Android
        run: task android:ci
      - id: verified
        run: echo "result=success" >> "$GITHUB_OUTPUT"
      - name: Upload Android failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-failure-reports-${{ github.sha }}
          path: |
            mobile/android/phone/build/test-results/**/*.xml
            mobile/android/phone/build/reports/tests/**
            mobile/android/phone/build/reports/lint-results*
            mobile/android/wear/build/test-results/**/*.xml
            mobile/android/wear/build/reports/tests/**
            mobile/android/wear/build/reports/lint-results*
            mobile/android/wear-protocol/build/test-results/**/*.xml
            mobile/android/wear-protocol/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
