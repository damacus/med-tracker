---
name: Private PostgreSQL PID perf smoke
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: medtracker
          POSTGRES_PASSWORD: medtracker_password
          POSTGRES_DB: medtracker_loco
        options: >-
          --health-cmd "pg_isready -U medtracker -d medtracker_loco"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install smoke tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fish age ripgrep
      - name: Install kernel-matched perf
        shell: fish --no-config {0}
        run: sudo apt-get install -y linux-tools-(uname -r)
      - name: Run PID-scoped profiler smoke
        shell: fish --no-config {0}
        env:
          PG_DIAGNOSTIC_CONTAINER: ${{ job.services.postgres.id }}
          MEDTRACKER_PGSS_RECIPIENT: age1jzdak3qe6qhskt0ua0nhacqerwsrxxz2rawf7l3zzdy0ty70acwqmucu4e
        run: |
          fish scripts/diagnostics/pg-pid-perf-smoke.fish --validator-selftest; or exit 1
          fish scripts/diagnostics/pg-pid-perf-smoke.fish
      - name: Ensure owned PostgreSQL service is unpaused
        if: always()
        timeout-minutes: 1
        shell: fish --no-config {0}
        env:
          PG_DIAGNOSTIC_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          string match -rq '^[0-9a-f]{64}$' "$PG_DIAGNOSTIC_CONTAINER"; or exit 1
          test (docker inspect --format '{{.Config.Image}}' "$PG_DIAGNOSTIC_CONTAINER") = postgres:18-alpine; or exit 1
          set -l paused (docker inspect --format '{{.State.Paused}}' "$PG_DIAGNOSTIC_CONTAINER"); or exit 1
          if test "$paused" = true
            docker unpause "$PG_DIAGNOSTIC_CONTAINER" >/dev/null; or exit 1
          else if test "$paused" != false
            exit 1
          end
      - name: Preserve encrypted smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pg-pid-perf-smoke-encrypted
          path: ${{ runner.temp }}/pg-pid-perf-smoke/*.age
          if-no-files-found: error
          retention-days: 1
