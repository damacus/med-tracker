---
name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: [ubuntu-latest]
    name: Classify Changes
    outputs:
      app: ${{ steps.filter.outputs.rails }}
      rails: ${{ steps.filter.outputs.rails }}
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
      markdown: ${{ steps.filter.outputs.markdown }}
      android: ${{ steps.filter.outputs.android }}
      api_clients: ${{ steps.filter.outputs.api_clients }}
      policy: ${{ steps.filter.outputs.policy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
          CI_EVENT: ${{ github.event_name }}
        run: node scripts/ci/classify.mjs

  android:
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    uses: ./.github/workflows/android.yml

  api_clients:
    needs: changes
    if: ${{ needs.changes.outputs.api_clients == 'true' }}
    uses: ./.github/workflows/api-clients.yml

  policy_check:
    needs: changes
    if: ${{ needs.changes.outputs.policy == 'true' }}
    name: CI Workflow Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: 3.52.0
          repo-token: ${{ github.token }}
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: task ci:check

  markdown_check:
    needs: changes
    if: ${{ needs.changes.outputs.markdown == 'true' }}
    name: Markdown Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: 3.52.0
          repo-token: ${{ github.token }}
      - name: Check changed Markdown
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
          CI_EVENT: ${{ github.event_name }}
        run: task ci:markdown

  scan_ruby:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: [ubuntu-latest]
    name: Ruby Security Scan
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: [ubuntu-latest]
    name: JavaScript Security Scan
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: [ubuntu-latest]
    name: Code Style Check
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  client_tools:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: [ubuntu-latest]
    name: Rust Client Tools
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: client-tools

      - name: Check formatting
        run: cargo fmt --manifest-path client-tools/Cargo.toml --all --check

      - name: Check workspace
        run: cargo check --manifest-path client-tools/Cargo.toml --workspace --all-targets

      - name: Lint workspace
        run: cargo clippy --manifest-path client-tools/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --manifest-path client-tools/Cargo.toml --workspace

  docs_check:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: [ubuntu-latest]
    name: Documentation Check
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install documentation dependencies
        run: pip install uv==0.10.12

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: 3.52.0
          repo-token: ${{ github.token }}

      - name: Build documentation
        run: task docs:build

  test_non_system:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: [ubuntu-latest]
    name: RSpec Tests (Models, Policies, Controllers, Components)
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: medtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_ADAPTER: postgresql
      DATABASE_URL: postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/medtracker_test
      RAILS_ENV: test
      COVERAGE: true
      SIMPLECOV_COMMAND_NAME: rspec-non-system

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true

      - name: Set up database
        run: bundle exec rails db:migrate

      - name: Precompile assets
        run: bundle exec rails assets:precompile

      - name: Run non-browser tests
        run: bundle exec rspec --format RSpec::Github::Formatter --tag ~browser

      - name: Upload SimpleCov coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simplecov-non-system
          path: coverage
          if-no-files-found: ignore

  test_system:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: [ubuntu-latest]
    name: RSpec System Tests (Playwright) - Shard ${{ matrix.shard }}/2
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: medtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_ADAPTER: postgresql
      DATABASE_URL: postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/medtracker_test
      RAILS_ENV: test
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers and deps
        run: npx playwright install --with-deps chromium

      - name: Set up database
        run: bundle exec rails db:migrate

      - name: Precompile assets
        run: bundle exec rails assets:precompile

      - name: Run browser tests (shard ${{ matrix.shard }}/2)
        shell: bash
        run: |
          # Get all spec files and split tagged browser examples for this shard
          mapfile -t file_array < <(find spec -name '*_spec.rb' | sort)
          total_shards=2
          shard=${{ matrix.shard }}

          # Split files across shards using modulo
          shard_files=()
          for i in "${!file_array[@]}"; do
            if (( (i % total_shards) + 1 == shard )); then
              shard_files+=("${file_array[$i]}")
            fi
          done

          if [ ${#shard_files[@]} -gt 0 ]; then
            echo "Running tests for shard $shard: ${shard_files[*]}"
            bundle exec rspec --tag browser --format RSpec::Github::Formatter --format documentation "${shard_files[@]}"
          else
            echo "No files for this shard"
          fi

      - name: Upload Capybara failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: capybara-failures-shard-${{ matrix.shard }}
          path: |
            tmp/capybara/**/*.png
            tmp/capybara/**/*.html
          if-no-files-found: ignore
          retention-days: 7

  production_image_medication_search:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: [ubuntu-latest]
    name: Production Image Medication Search
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.52.0
          repo-token: ${{ github.token }}

      - name: Install Fish
        run: sudo apt-get update && sudo apt-get install --yes fish

      - name: Exercise medication search from the final app image
        run: task prod:medication-search-smoke

  mutation:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: [ubuntu-latest]
    name: Mutation Testing (advisory, changed subjects)
    timeout-minutes: 20
    continue-on-error: true # advisory until the signal is trusted
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: medtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_ADAPTER: postgresql
      DATABASE_URL: postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/medtracker_test
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # mutant --since needs history + the base ref

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true

      - name: Set up database
        run: bundle exec rails db:migrate

      - name: Ensure base ref is available
        run: git fetch --no-tags --depth=1 origin main

      # Only mutates subjects changed since main (mutant --since), so a typical
      # PR is fast. usage: opensource (config/mutant.yml) means no licence/token.
      - name: Mutation test changed subjects (advisory)
        run: bundle exec mutant run --since origin/main

  lighthouse:
    runs-on: [ubuntu-latest]
    name: Lighthouse Mobile Audit
    continue-on-error: true
    needs: [changes, test_non_system]
    if: ${{ needs.changes.outputs.app == 'true' }}
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: medtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_ADAPTER: postgresql
      DATABASE_URL: postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/medtracker_test
      RAILS_ENV: test
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.52.0
          repo-token: ${{ github.token }}

      - name: Install Node dependencies
        run: npm ci

      - name: Set up database
        run: bundle exec rails db:prepare

      - name: Seed database
        run: bundle exec rails db:seed

      - name: Precompile assets
        run: bundle exec rails assets:precompile

      - name: Start Rails server
        run: |
          bundle exec rails server -p 3000 > tmp/lighthouse-server.log 2>&1 &
          for _attempt in {1..30}; do
            curl -fsS http://localhost:3000/up && break
            sleep 1
          done
          curl -fsS http://localhost:3000/up

      - name: Audit public login
        run: task lighthouse:ci URL=http://localhost:3000/login REPORT_PATH=./lighthouse-login

      - name: Audit authenticated dashboard
        run: |
          curl -fsS -c lighthouse-cookies.txt -X POST \
            --data-urlencode email=jane.doe@example.com \
            --data-urlencode password=password \
            -o /dev/null http://localhost:3000/login
          COOKIE_HEADER=$(awk 'BEGIN { separator="" } /^#HttpOnly_/ || $0 !~ /^#/ { if (NF >= 7) { printf "%s%s=%s", separator, $6, $7; separator="; " } } END { print "" }' lighthouse-cookies.txt)
          test -n "$COOKIE_HEADER"
          task lighthouse:ci \
            URL=http://localhost:3000/households/fixture-household/dashboard \
            REPORT_PATH=./lighthouse-dashboard \
            EXTRA_HEADERS="{\"Cookie\":\"${COOKIE_HEADER}\"}"

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-mobile-reports
          path: |
            lighthouse-*.report.json
            lighthouse-*.report.html
            tmp/lighthouse-server.log
          if-no-files-found: ignore
          retention-days: 30

  ci_success:
    if: ${{ always() }}
    needs:
      - changes
      - scan_ruby
      - scan_js
      - lint
      - client_tools
      - docs_check
      - test_non_system
      - test_system
      - production_image_medication_search
      - android
      - api_clients
      - policy_check
      - markdown_check
    runs-on: [ubuntu-latest]
    name: CI Success
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require selected suites to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/gate.mjs
