---
name: Private PostgreSQL cleanup probe
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup_probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: medtracker
          POSTGRES_PASSWORD: medtracker_password
          POSTGRES_DB: medtracker_loco
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U medtracker -d medtracker_loco"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://medtracker:medtracker_password@127.0.0.1:5432/medtracker_loco
      MEDTRACKER_OWNED_DATABASE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
          check-latest: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: 3.52.0
          repo-token: ${{ github.token }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: loco-tests-v1
          cache-bin: false
      - name: Install diagnostic tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age fish
      - name: Install matching perf
        shell: fish --no-config {0}
        run: sudo apt-get install -y linux-tools-(uname -r)
      - name: Verify bounded child shutdown
        shell: fish --no-config {0}
        run: |
          fish scripts/diagnostics/cleanup-probe.fish --shutdown-selftest; or exit 1
          fish scripts/diagnostics/cleanup-probe.fish --nested-selftest; or exit 1
      - name: Build native fixture tools
        run: task host:diagnostic:cleanup-build
      - name: Compare fixture cleanup lifecycle
        shell: fish --no-config {0}
        env:
          PG_DIAGNOSTIC_CONTAINER: ${{ job.services.postgres.id }}
          MEDTRACKER_PGSS_RECIPIENT: age1jzdak3qe6qhskt0ua0nhacqerwsrxxz2rawf7l3zzdy0ty70acwqmucu4e
        run: |
          fish scripts/diagnostics/cleanup-probe.fish >/dev/null 2>&1
          set -l probe_status $status
          test -s "$RUNNER_TEMP/cleanup-probe/safe-evidence.age"; or exit 1
          exit "$probe_status"
      - name: Ensure PostgreSQL is unpaused
        if: always()
        timeout-minutes: 1
        shell: fish --no-config {0}
        env:
          PG_DIAGNOSTIC_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          string match -rq '^[0-9a-f]{64}$' "$PG_DIAGNOSTIC_CONTAINER"; or exit 1
          test (docker inspect --format '{{.Config.Image}}' "$PG_DIAGNOSTIC_CONTAINER") = postgres:18-alpine; or exit 1
          set -l paused (docker inspect --format '{{.State.Paused}}' "$PG_DIAGNOSTIC_CONTAINER"); or exit 1
          if test "$paused" = true
            docker unpause "$PG_DIAGNOSTIC_CONTAINER" >/dev/null; or exit 1
          else if test "$paused" != false
            exit 1
          end
      - name: Remove private probe files
        if: always()
        timeout-minutes: 1
        shell: fish --no-config {0}
        run: sudo rm -rf -- "$RUNNER_TEMP/cleanup-probe/private"
      - name: Preserve encrypted safe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleanup-probe-encrypted
          path: ${{ runner.temp }}/cleanup-probe/*.age
          if-no-files-found: error
          retention-days: 1
