---
name: Private PostgreSQL aggregate capture
"on":
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  loco_integration:
    name: API, security and database integration tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: medtracker
          POSTGRES_PASSWORD: medtracker_password
          POSTGRES_DB: medtracker_loco
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U medtracker -d medtracker_loco"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
      DATABASE_URL: postgres://medtracker:medtracker_password@127.0.0.1:5432/medtracker_loco
      MEDTRACKER_OWNED_DATABASE: "1"
      MEDTRACKER_OWNED_STORAGE: "1"
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: scanner-fixture
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: storage-smoke-access
      AWS_SECRET_ACCESS_KEY: storage-smoke-secret
      ACTIVE_STORAGE_SERVICE: s3
      ACTIVE_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
      ACTIVE_STORAGE_S3_BUCKET: medtracker-fixture
      ACTIVE_STORAGE_S3_REGION: us-east-1
      ACTIVE_STORAGE_S3_ACCESS_KEY_ID: storage-smoke-access
      ACTIVE_STORAGE_S3_SECRET_ACCESS_KEY: storage-smoke-secret
      ACTIVE_STORAGE_S3_FORCE_PATH_STYLE: "true"
      MEDTRACKER_SESSION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBw==
      RAILS_SECRET_KEY_BASE: synthetic-slice-rails-verification-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
          check-latest: true
          cache: "npm"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Install nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.149
          fallback: cargo-binstall
        env:
          BINSTALL_STRATEGIES: crate-meta-data
      - name: Verify nextest checksum
        run: echo "7f557542ea0d9d7218c2d564987a2cebf367de1d0f9eca45f93f270932a3d9ff  $(command -v cargo-nextest)" | sha256sum --check --strict
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: 3.52.0
          repo-token: ${{ github.token }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: loco-tests-v1
          cache-bin: false
      - name: Start RustFS and provision reference database
        run: |
          docker compose -f compose.yaml --env-file /dev/null -p mtloco-ci --profile fixture-storage up -d --wait rustfs
          STORAGE_PORT=$(docker compose -f compose.yaml --env-file /dev/null -p mtloco-ci --profile fixture-storage port rustfs 9000 | cut -d: -f2)
          echo "S3_ENDPOINT=http://127.0.0.1:${STORAGE_PORT}" >> "$GITHUB_ENV"
          echo "ACTIVE_STORAGE_S3_ENDPOINT=http://127.0.0.1:${STORAGE_PORT}" >> "$GITHUB_ENV"
          task foundation:storage-init STORAGE_ENDPOINT="http://127.0.0.1:${STORAGE_PORT}"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE medtracker_reference"
      - name: Install temporary capture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age fish ripgrep
      - name: Install matching perf
        shell: fish --no-config {0}
        run: sudo apt-get install -y linux-tools-(uname -r)
      - name: Capture integration diagnostics
        shell: fish --no-config {0}
        env:
          PG_DIAGNOSTIC_CONTAINER: ${{ job.services.postgres.id }}
          MEDTRACKER_PGSS_RECIPIENT: age1jzdak3qe6qhskt0ua0nhacqerwsrxxz2rawf7l3zzdy0ty70acwqmucu4e
        run: |
          set -gx MEDTRACKER_DIAGNOSTIC_TIMEOUT_FILE "$RUNNER_TEMP/pg-capture/timeout.ns"
          set -gx MEDTRACKER_DIAGNOSTIC_CLEANUP_DONE_FILE "$RUNNER_TEMP/pg-capture/tests-done"
          set -gx MEDTRACKER_DIAGNOSTIC_COLLECTOR_STOPPED_FILE "$RUNNER_TEMP/pg-capture/collector-stopped"
          set -l collector_wrapper 'const fs=require("node:fs"),os=require("node:os"),{spawn}=require("node:child_process");const [result,command,...args]=process.argv.slice(1);const child=spawn(command,args,{stdio:"inherit"});child.once("error",()=>{process.exitCode=1});child.once("exit",(code,signal)=>{const status=code===null?128+(os.constants.signals[signal]??127):code;fs.writeFileSync(result+".tmp",`${status}\n`,{mode:0o600});fs.renameSync(result+".tmp",result)})'
          fish scripts/diagnostics/pg-perf-capture.fish --validator-selftest; or exit 1
          node -e "$collector_wrapper" "$RUNNER_TEMP/pg-capture/collector.result" fish scripts/diagnostics/pg-perf-capture.fish >/dev/null 2>&1 &
          set -l collector $last_pid
          for attempt in (seq 1 200)
            test -f "$RUNNER_TEMP/pg-capture/collector.ready"; and break
            if not kill -0 "$collector" 2>/dev/null
              wait "$collector"
              echo 'Diagnostic collector could not start' >&2
              exit 1
            end
            sleep 0.1
          end
          if not test -f "$RUNNER_TEMP/pg-capture/collector.ready"
            printf 'workflow-fallback\n' >"$RUNNER_TEMP/pg-capture/tests-done"
            wait "$collector"
            test -f "$RUNNER_TEMP/pg-capture/collector.result"; or exit 1
            echo 'Diagnostic collector readiness failed' >&2
            exit 1
          end
          task host:test:integration
          set -l test_status $status
          if not test -f "$RUNNER_TEMP/pg-capture/tests-done"
            printf 'workflow-fallback\n' >"$RUNNER_TEMP/pg-capture/tests-done"
          end
          wait "$collector"
          if test "$test_status" -ne 0; exit "$test_status"; end
          if not test -f "$RUNNER_TEMP/pg-capture/collector.result"
            echo 'Diagnostic collector returned no exit status' >&2
            exit 1
          end
          set -l capture_status (cat "$RUNNER_TEMP/pg-capture/collector.result")
          string match -rq '^(0|[1-9][0-9]{0,2})$' "$capture_status"; or exit 1
          if test "$capture_status" -eq 0; exit 0; end
          if test "$capture_status" -eq 3
            test (cat "$RUNNER_TEMP/pg-capture/no-targeted-timeout" 2>/dev/null) = no_targeted_timeout; or exit 1
            set -l run_marker (cat "$RUNNER_TEMP/pg-capture/tests-done" 2>/dev/null)
            string match -rq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' "$run_marker"; or exit 1
            test (cat "$RUNNER_TEMP/pg-capture/collector-stopped" 2>/dev/null) = "stopped:$run_marker"; or exit 1
            echo 'Integration tests passed; capture incomplete because no targeted timeout occurred.'
            exit 0
          end
          exit 1
      - name: Ensure owned PostgreSQL service is unpaused
        if: always()
        timeout-minutes: 1
        shell: fish --no-config {0}
        env:
          PG_DIAGNOSTIC_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          string match -rq '^[0-9a-f]{64}$' "$PG_DIAGNOSTIC_CONTAINER"; or exit 1
          test (docker inspect --format '{{.Config.Image}}' "$PG_DIAGNOSTIC_CONTAINER") = postgres:18-alpine; or exit 1
          set -l paused (docker inspect --format '{{.State.Paused}}' "$PG_DIAGNOSTIC_CONTAINER"); or exit 1
          if test "$paused" = true
            docker unpause "$PG_DIAGNOSTIC_CONTAINER" >/dev/null; or exit 1
          else if test "$paused" != false
            exit 1
          end
      - name: Remove private capture files
        if: always()
        timeout-minutes: 1
        shell: fish --no-config {0}
        run: sudo rm -rf -- "$RUNNER_TEMP/pg-capture/private"
      - name: Preserve encrypted aggregate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pg-aggregate-encrypted
          path: ${{ runner.temp }}/pg-capture/*.age
          if-no-files-found: error
          retention-days: 1
