---
name: Private PostgreSQL query costs
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loco_integration:
    name: API, security and database integration tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: medtracker
          POSTGRES_PASSWORD: medtracker_password
          POSTGRES_DB: medtracker_loco
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U medtracker -d medtracker_loco"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
      DATABASE_URL: postgres://medtracker:medtracker_password@127.0.0.1:5432/medtracker_loco
      MEDTRACKER_OWNED_DATABASE: "1"
      MEDTRACKER_OWNED_STORAGE: "1"
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: scanner-fixture
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: storage-smoke-access
      AWS_SECRET_ACCESS_KEY: storage-smoke-secret
      ACTIVE_STORAGE_SERVICE: s3
      ACTIVE_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
      ACTIVE_STORAGE_S3_BUCKET: medtracker-fixture
      ACTIVE_STORAGE_S3_REGION: us-east-1
      ACTIVE_STORAGE_S3_ACCESS_KEY_ID: storage-smoke-access
      ACTIVE_STORAGE_S3_SECRET_ACCESS_KEY: storage-smoke-secret
      ACTIVE_STORAGE_S3_FORCE_PATH_STYLE: "true"
      MEDTRACKER_SESSION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBw==
      RAILS_SECRET_KEY_BASE: synthetic-slice-rails-verification-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
          check-latest: true
          cache: "npm"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Install nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.149
          fallback: cargo-binstall
        env:
          BINSTALL_STRATEGIES: crate-meta-data
      - name: Verify nextest checksum
        run: echo "7f557542ea0d9d7218c2d564987a2cebf367de1d0f9eca45f93f270932a3d9ff  $(command -v cargo-nextest)" | sha256sum --check --strict
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: 3.52.0
          repo-token: ${{ github.token }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: loco-tests-v1
          cache-bin: false
      - name: Install temporary diagnostic tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age fish
      - name: Prepare temporary encrypted PostgreSQL diagnostics
        shell: fish --no-config {0}
        env:
          PG_DIAGNOSTIC_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          test "$GITHUB_ACTIONS" = true; or exit 1
          string match -rq '^[0-9a-f]{64}$' "$PG_DIAGNOSTIC_CONTAINER"; or exit 1
          set -l service_image (docker inspect --format '{{.Config.Image}}' "$PG_DIAGNOSTIC_CONTAINER"); or exit 1
          test "$service_image" = postgres:18-alpine; or exit 1
          age --version; or exit 1
          mkdir -m 700 "$RUNNER_TEMP/pgss-ci"; or exit 1
          docker exec "$PG_DIAGNOSTIC_CONTAINER" psql -U medtracker -d postgres -X -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'" \
            -c "ALTER SYSTEM SET compute_query_id = 'on'" \
            -c "ALTER SYSTEM SET pg_stat_statements.track = 'all'" \
            -c "ALTER SYSTEM SET pg_stat_statements.track_planning = 'on'" \
            -c "ALTER SYSTEM SET pg_stat_statements.track_utility = 'off'" \
            -c "ALTER SYSTEM SET pg_stat_statements.max = '20000'"; or exit 1
          docker restart "$PG_DIAGNOSTIC_CONTAINER" >/dev/null; or exit 1
          set -l ready 0
          for attempt in (seq 1 60)
            if docker exec "$PG_DIAGNOSTIC_CONTAINER" pg_isready -U medtracker -d postgres >/dev/null
              set ready 1
              break
            end
            sleep 1
          end
          test "$ready" -eq 1; or exit 1
          docker exec "$PG_DIAGNOSTIC_CONTAINER" psql -U medtracker -d postgres -X -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA diagnostic_ci" \
            -c "REVOKE ALL ON SCHEMA diagnostic_ci FROM PUBLIC" \
            -c "CREATE EXTENSION pg_stat_statements WITH SCHEMA diagnostic_ci" \
            -c "CREATE TABLE diagnostic_ci.capture_baseline AS SELECT dealloc,stats_reset FROM diagnostic_ci.pg_stat_statements_info" \
            -c "CREATE TABLE diagnostic_ci.capture_test_hashes (fingerprint text PRIMARY KEY)"; or exit 1
          set -l settings_ok (docker exec "$PG_DIAGNOSTIC_CONTAINER" psql -U medtracker -d postgres -X -v ON_ERROR_STOP=1 -At -c "SELECT current_setting('shared_preload_libraries') = 'pg_stat_statements' AND current_setting('compute_query_id') = 'on' AND current_setting('pg_stat_statements.track') = 'all' AND current_setting('pg_stat_statements.track_planning') = 'on' AND current_setting('pg_stat_statements.track_utility') = 'off' AND current_setting('pg_stat_statements.max') = '20000'"); or exit 1
          test "$settings_ok" = t; or exit 1
      - name: Start RustFS and provision reference database
        run: |
          docker compose -f compose.yaml --env-file /dev/null -p mtloco-ci --profile fixture-storage up -d --wait rustfs
          STORAGE_PORT=$(docker compose -f compose.yaml --env-file /dev/null -p mtloco-ci --profile fixture-storage port rustfs 9000 | cut -d: -f2)
          echo "S3_ENDPOINT=http://127.0.0.1:${STORAGE_PORT}" >> "$GITHUB_ENV"
          echo "ACTIVE_STORAGE_S3_ENDPOINT=http://127.0.0.1:${STORAGE_PORT}" >> "$GITHUB_ENV"
          task foundation:storage-init STORAGE_ENDPOINT="http://127.0.0.1:${STORAGE_PORT}"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE medtracker_reference"
      - name: Run integration tests with encrypted diagnostics
        shell: fish --no-config {0}
        env:
          MEDTRACKER_PGSS_DIAGNOSTIC: "1"
          MEDTRACKER_PGSS_RECIPIENT: age1jzdak3qe6qhskt0ua0nhacqerwsrxxz2rawf7l3zzdy0ty70acwqmucu4e
        run: |
          set -gx MEDTRACKER_PGSS_DIR "$RUNNER_TEMP/pgss-ci"
          task host:diagnostic:build; or exit $status
          set -l target_dir (cargo metadata --locked --no-deps --format-version 1 | jq -r .target_directory)
          test -x "$target_dir/debug/examples/api-fixtures"; or exit 1
          set -l wrapper 'const fs = require("node:fs"); const { spawn } = require("node:child_process"); const [result, executable] = process.argv.slice(1); const child = spawn(executable, ["diagnostic-sample"], { stdio: "ignore" }); child.once("error", () => { process.exitCode = 1; }); child.once("exit", (code, signal) => { const resultCode = code === null ? 128 + (require("node:os").constants.signals[signal] ?? 127) : code; fs.writeFileSync(result + ".tmp", `${resultCode}\n`, { mode: 0o600 }); fs.renameSync(result + ".tmp", result); });'
          node -e "$wrapper" "$MEDTRACKER_PGSS_DIR/sampler.result" "$target_dir/debug/examples/api-fixtures" >/dev/null 2>&1 &
          set -l sampler $last_pid
          set -l sampler_start (awk '{print $22}' "/proc/$sampler/stat"); or exit 1
          function stop_sampler --inherit-variable sampler --inherit-variable sampler_start
            touch "$MEDTRACKER_PGSS_DIR/stop"; or return 1
            for attempt in (seq 1 30)
              if not kill -0 "$sampler" 2>/dev/null; break; end
              sleep 1
            end
            if kill -0 "$sampler" 2>/dev/null
              set -l parent (awk '/^PPid:/ {print $2}' "/proc/$sampler/status" 2>/dev/null)
              set -l start (awk '{print $22}' "/proc/$sampler/stat" 2>/dev/null)
              if test "$parent" = "$fish_pid"; and test "$start" = "$sampler_start"
                for child in (pgrep -P "$sampler")
                  set -l child_parent (awk '/^PPid:/ {print $2}' "/proc/$child/status" 2>/dev/null)
                  if test "$child_parent" = "$sampler"; kill -TERM "$child" 2>/dev/null; end
                end
              end
              return 1
            end
            wait "$sampler" >/dev/null 2>&1
            test -f "$MEDTRACKER_PGSS_DIR/sampler.result"; and test (cat "$MEDTRACKER_PGSS_DIR/sampler.result") = 0
          end
          for attempt in (seq 1 30)
            if test -f "$MEDTRACKER_PGSS_DIR/sampler.ready"; break; end
            if not kill -0 "$sampler" 2>/dev/null
              stop_sampler
              echo 'Diagnostic sampler could not start' >&2
              exit 1
            end
            sleep 1
          end
          if not test -f "$MEDTRACKER_PGSS_DIR/sampler.ready"
            stop_sampler
            echo 'Diagnostic sampler did not become ready' >&2
            exit 1
          end
          task host:test:integration
          set -l test_status $status
          stop_sampler
          set -l sample_status $status
          set -l capture_status 0
          if test "$sample_status" -ne 0; or not test -s "$MEDTRACKER_PGSS_DIR/activity.age"; or not test -s "$MEDTRACKER_PGSS_DIR/statement-stats.age"; or not test -s "$MEDTRACKER_PGSS_DIR/inventory.age"; or not test -f "$MEDTRACKER_PGSS_DIR/snapshot.ok"
            echo 'Encrypted diagnostic capture failed or is incomplete' >&2
            set capture_status 1
          end
          if test "$test_status" -ne 0; exit "$test_status"; end
          exit "$capture_status"
      - name: Preserve encrypted diagnostic capture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pgss-ci-encrypted
          path: ${{ runner.temp }}/pgss-ci/*.age
          if-no-files-found: error
          retention-days: 1
