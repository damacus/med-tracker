name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.generate_token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    uses: ./.github/workflows/loco-images.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      publish: true
    secrets: inherit

  client-tools:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    uses: ./.github/workflows/client-tools-release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  publish-release:
    needs: [release-please, docker]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release after image verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          test "$(jq -r .tag_name <<< "$release")" = "$RELEASE_TAG"
          if [ "$(jq -r .draft <<< "$release")" = true ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --silent
          fi
