name: Loco Linux images

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - src/**
      - migration/**
      - assets/**
      - config/production.yaml
      - deploy/helm/**
      - package.json
      - package-lock.json
      - scripts/*loco_image*.mjs
      - scripts/*upgrade_release*.mjs
      - mise.toml
      - .github/workflows/ci.yml
      - Taskfile.yml
      - .github/workflows/loco-images.yml
      - .github/workflows/release-please.yml
      - release-please-config.json
  workflow_call:
    inputs:
      tag_name:
        description: Exact release tag to build and publish
        type: string
        required: true
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked multi-platform SHA image from main
        type: boolean
        default: false
      beta:
        description: Publish the checked image from main and promote its digest to beta
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: loco-images-${{ github.event_name == 'pull_request' && github.ref || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.beta) && 'beta-main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.beta) }}

jobs:
  tooling:
    name: Image tool alignment
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag_name || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: node
        with:
          node-version: "26"
          check-latest: true
      - name: Validate release source and version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: node scripts/loco_image_release.mjs
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: 3.52.0
          repo-token: ${{ github.token }}
      - name: Verify Task release binary
        run: echo "e1561194871b9c9fb3aa7c71d1cb2cbcd71eda417b62c511739823eef9f947b9  $(command -v task)" | sha256sum --check --strict
      - run: task image:check image:release:check

  image_amd64:
    needs: tooling
    name: Loco image (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ARCH: amd64
    steps: &image_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag_name || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
      - name: Install verified Buildx release
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64; checksum=e25d5cd675092bb5d1d03632fdc46cdf3fede7b514dc5f023a105e00d3ce5ad4 ;;
            ARM64) arch=arm64; checksum=3b83b3731916ba433feccaaa689fe5bcdc81c641d92c8e6c2ea865dfa141c97a ;;
            *) exit 1 ;;
          esac
          curl --fail --silent --show-error --location --proto =https --tlsv1.2 "https://github.com/docker/buildx/releases/download/v0.38.1/buildx-v0.38.1.linux-$arch" --output "$RUNNER_TEMP/docker-buildx"
          echo "$checksum  $RUNNER_TEMP/docker-buildx" | sha256sum --check --strict
          directory="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
          mkdir -p "$directory"
          install -m 0755 "$RUNNER_TEMP/docker-buildx" "$directory/docker-buildx"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          buildkitd-flags: --debug=false
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: medtracker-loco:local
          platforms: linux/${{ env.ARCH }}
          build-args: |
            MEDTRACKER_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=loco-checked-${{ env.ARCH }}
          cache-to: type=gha,mode=max,scope=loco-checked-${{ env.ARCH }}
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: 3.52.0
          repo-token: ${{ github.token }}
      - name: Verify Task release binary
        run: |
          case "$ARCH" in
            amd64) checksum=e1561194871b9c9fb3aa7c71d1cb2cbcd71eda417b62c511739823eef9f947b9 ;;
            arm64) checksum=0ede6c82d6d381ef9212363c2e38359fc7cc840116344286c70541c8ab8ea027 ;;
            *) exit 1 ;;
          esac
          echo "$checksum  $(command -v task)" | sha256sum --check --strict
      - run: task image:test
      - name: Select published upgrade baseline
        id: upgrade
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/upgrade-releases.json"
          node scripts/upgrade_release.mjs "$RUNNER_TEMP/upgrade-releases.json"
      - name: Verify upgrade from the previous release
        env:
          PREVIOUS_IMAGE: ${{ steps.upgrade.outputs.image }}
        run: task image:test:upgrade PREVIOUS_IMAGE="$PREVIOUS_IMAGE"
      - name: Save the tested image
        run: |
          mkdir -p "checked/$ARCH"
          docker image save medtracker-loco:local | gzip > "checked/$ARCH/image.tar.gz"
          docker image inspect medtracker-loco:local --format '{{.Id}}' > "checked/$ARCH/image.id"
          cd "checked/$ARCH"
          sha256sum image.tar.gz image.id > SHA256SUMS
      - name: Transfer the tested image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-loco-${{ env.ARCH }}
          path: checked/${{ env.ARCH }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  image_arm64:
    needs: tooling
    name: Loco image (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      ARCH: arm64
    steps: *image_steps

  scheduler_acceptance:
    name: Native scheduler image acceptance
    needs: image_amd64
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag_name || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: checked-loco-amd64
          path: checked
      - name: Use the release builder's Docker image store
        run: |
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json
          else
            printf '{}\n'
          fi | jq '.features["containerd-snapshotter"] = false' > "$RUNNER_TEMP/docker-daemon.json"
          sudo install -m 0644 "$RUNNER_TEMP/docker-daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Load the verified release image
        run: |
          (cd checked && sha256sum --check --strict SHA256SUMS)
          docker image load --input checked/image.tar.gz
          cat checked/image.id
          docker image inspect medtracker-loco:local --format '{{.Id}} {{.Architecture}} {{.Os}}'
          test "$(docker image inspect medtracker-loco:local --format '{{.Id}}')" = "$(cat checked/image.id)"
          test "$(docker image inspect medtracker-loco:local --format '{{.Architecture}}')" = amd64
          test "$(docker image inspect medtracker-loco:local --format '{{.Os}}')" = linux
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Install nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.149
          fallback: cargo-binstall
        env:
          BINSTALL_STRATEGIES: crate-meta-data
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      - name: Verify nextest checksum
        run: echo "7f557542ea0d9d7218c2d564987a2cebf367de1d0f9eca45f93f270932a3d9ff  $(command -v cargo-nextest)" | sha256sum --check --strict
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: 3.52.0
          repo-token: ${{ github.token }}
      - name: Verify Task checksum
        run: echo "e1561194871b9c9fb3aa7c71d1cb2cbcd71eda417b62c511739823eef9f947b9  $(command -v task)" | sha256sum --check --strict
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: loco-tests-v1
          cache-bin: false
      - run: task test:scheduler:image

  checked_images:
    name: Verify tested image transfer
    needs: [image_amd64, image_arm64, scheduler_acceptance]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: checked-loco-*
          path: checked
      - name: Use the release builder's Docker image store
        run: |
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json
          else
            printf '{}\n'
          fi | jq '.features["containerd-snapshotter"] = false' > "$RUNNER_TEMP/docker-daemon.json"
          sudo install -m 0644 "$RUNNER_TEMP/docker-daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Verify both transferred images without executing them
        run: |
          for arch in amd64 arm64; do
            directory="$PWD/checked/checked-loco-$arch"
            (cd "$directory" && sha256sum --check --strict SHA256SUMS)
            docker image load --input "$directory/image.tar.gz"
            test "$(docker image inspect medtracker-loco:local --format '{{.Id}}')" = "$(cat "$directory/image.id")"
            test "$(docker image inspect medtracker-loco:local --format '{{.Architecture}}')" = "$arch"
            test "$(docker image inspect medtracker-loco:local --format '{{.Os}}')" = linux
          done

  publish:
    if: github.repository == 'damacus/med-tracker' && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && inputs.publish && inputs.tag_name != '') || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.beta)))
    needs: [checked_images, tooling]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      group: loco-image-publish-${{ github.sha }}
      cancel-in-progress: false
      queue: max
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: checked-loco-*
          path: checked
      - name: Install verified Buildx release
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64; checksum=e25d5cd675092bb5d1d03632fdc46cdf3fede7b514dc5f023a105e00d3ce5ad4 ;;
            ARM64) arch=arm64; checksum=3b83b3731916ba433feccaaa689fe5bcdc81c641d92c8e6c2ea865dfa141c97a ;;
            *) exit 1 ;;
          esac
          curl --fail --silent --show-error --location --proto =https --tlsv1.2 "https://github.com/docker/buildx/releases/download/v0.38.1/buildx-v0.38.1.linux-$arch" --output "$RUNNER_TEMP/docker-buildx"
          echo "$checksum  $RUNNER_TEMP/docker-buildx" | sha256sum --check --strict
          directory="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
          mkdir -p "$directory"
          install -m 0755 "$RUNNER_TEMP/docker-buildx" "$directory/docker-buildx"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          driver: docker
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Use the release builder's Docker image store
        run: |
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json
          else
            printf '{}\n'
          fi | jq '.features["containerd-snapshotter"] = false' > "$RUNNER_TEMP/docker-daemon.json"
          sudo install -m 0644 "$RUNNER_TEMP/docker-daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Publish tested images and assemble their manifest
        id: publish
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          REVISION: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.tooling.outputs.release_version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="${IMAGE#ghcr.io/}"
          token=$(curl --fail --silent --show-error --proto =https --tlsv1.2 --max-time 30 \
            --user "$GITHUB_ACTOR:$GHCR_TOKEN" --get --data-urlencode service=ghcr.io \
            --data-urlencode "scope=repository:$package:pull" https://ghcr.io/token \
            | jq -er '.token | select(type == "string" and length > 0)')
          oci_index=application/vnd.oci.image.index.v1+json
          docker_index=application/vnd.docker.distribution.manifest.list.v2+json
          manifest="$RUNNER_TEMP/manifest.json"
          headers="$RUNNER_TEMP/manifest.headers"

          read_digest() {
            local tag="$1" status digest hash
            status=$(curl --silent --show-error --proto =https --tlsv1.2 --max-time 30 \
              --header "Authorization: Bearer $token" --header "Accept: $oci_index, $docker_index" \
              --output "$manifest" --dump-header "$headers" --write-out '%{http_code}' \
              "https://ghcr.io/v2/$package/manifests/$tag") || return 1
            case "$status" in
              200)
                jq -e --arg oci "$oci_index" --arg docker "$docker_index" '
                  .schemaVersion == 2 and (.mediaType == $oci or .mediaType == $docker) and
                  ([.manifests[].platform | [.os, .architecture]] | sort == [["linux", "amd64"], ["linux", "arm64"]])
                ' "$manifest" > /dev/null || return 1
                digest=$(awk 'tolower($1) == "docker-content-digest:" { sub(/\r$/, "", $2); print $2 }' "$headers") || return 1
                hash=$(sha256sum "$manifest") || return 1
                if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ || "$digest" != "sha256:${hash%% *}" ]]; then
                  printf 'GHCR returned an invalid digest for %s.\n' "$tag" >&2
                  return 1
                fi
                printf '%s\n' "$digest"
                ;;
              404)
                jq -e '.errors | length == 1 and .[0].code == "MANIFEST_UNKNOWN"' "$manifest" > /dev/null
                ;;
              *)
                printf 'GHCR lookup for %s returned HTTP %s.\n' "$tag" "$status" >&2
                return 1
                ;;
            esac
          }

          sha_tag="sha-$REVISION"
          digest=$(read_digest "$sha_tag")
          release_digest=
          if [ -n "$RELEASE_VERSION" ]; then
            release_digest=$(read_digest "$RELEASE_VERSION")
            if [[ -n "$release_digest" && "$release_digest" != "$digest" ]]; then
              printf 'Existing release tag %s differs from the canonical SHA digest.\n' "$RELEASE_VERSION" >&2
              exit 1
            fi
          fi

          if [ -z "$digest" ]; then
            sources=()
            for arch in amd64 arm64; do
              directory="$PWD/checked/checked-loco-$arch"
              (cd "$directory" && sha256sum --check --strict SHA256SUMS)
              docker image load --input "$directory/image.tar.gz"
              test "$(docker image inspect medtracker-loco:local --format '{{.Id}}')" = "$(cat "$directory/image.id")"
              test "$(docker image inspect medtracker-loco:local --format '{{.Architecture}}')" = "$arch"
              test "$(docker image inspect medtracker-loco:local --format '{{.Os}}')" = linux
              tag="$IMAGE:$sha_tag-$arch"
              docker image tag medtracker-loco:local "$tag"
              docker image push "$tag"
              source_digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
              [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              sources+=("$IMAGE@$source_digest")
            done
            docker buildx imagetools create --tag "$IMAGE:$sha_tag" "${sources[@]}"
            digest=$(read_digest "$sha_tag")
            test -n "$digest"
          fi
          if [[ -n "$RELEASE_VERSION" && -z "$release_digest" ]]; then
            docker buildx imagetools create --tag "$IMAGE:$RELEASE_VERSION" "$IMAGE@$digest"
          fi

          if [ -n "$RELEASE_VERSION" ]; then
            test "$(read_digest "$RELEASE_VERSION")" = "$digest"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'Source commit: %s\n\nImmutable image: %s@%s\n\nTag: %s\n' "$REVISION" "$IMAGE" "$digest" "$sha_tag" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$RELEASE_VERSION" ]; then
            printf 'Release tag: %s:%s\n' "$IMAGE" "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi

  beta:
    if: github.event_name == 'workflow_dispatch' && inputs.beta
    name: Promote current main beta
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: loco-image-beta
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install verified Buildx release
        run: |
          curl --fail --silent --show-error --location --proto =https --tlsv1.2 https://github.com/docker/buildx/releases/download/v0.38.1/buildx-v0.38.1.linux-amd64 --output "$RUNNER_TEMP/docker-buildx"
          echo "e25d5cd675092bb5d1d03632fdc46cdf3fede7b514dc5f023a105e00d3ce5ad4  $RUNNER_TEMP/docker-buildx" | sha256sum --check --strict
          directory="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
          mkdir -p "$directory"
          install -m 0755 "$RUNNER_TEMP/docker-buildx" "$directory/docker-buildx"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote current main beta
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          REVISION: ${{ github.sha }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid main revision' >&2; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid image digest' >&2; exit 1; }
          if [[ "$current" != "$REVISION" ]]; then
            printf 'Beta unchanged: source %s is no longer current main (%s).\n' "$REVISION" "$current" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:beta" "$IMAGE@$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:beta" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          printf 'Beta updated: %s@%s (source %s).\n' "$IMAGE" "$DIGEST" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
