---
name: API Clients

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api_client_generation:
    name: Generate and verify API clients
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: 3.52.0
          repo-token: ${{ github.token }}

      - name: Install Fish
        run: sudo apt-get update && sudo apt-get install --yes fish

      - name: Verify deterministic generation
        run: task api-clients:verify-generated

  api_client_kotlin:
    name: Compile and test Kotlin API client
    needs: api_client_generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: 3.52.0
          repo-token: ${{ github.token }}

      - name: Generate, compile, and test Kotlin client
        run: task api-clients:kotlin:test

  api_client_swift:
    name: Compile and test Swift API client
    needs: api_client_generation
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Swift
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9
        with:
          swift-version: "6.3.3"

      - name: Verify Swift version
        run: |
          swift --version
          swift --version | grep --fixed-strings --quiet "Swift version 6.3.3"

      - name: Generate, compile, and test Swift client
        run: task api-clients:swift:test
