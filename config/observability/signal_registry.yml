workflows:
  - id: http_request_completion
    entrypoints: Rails request server through Thruster and Rack
    decisions: routing, authentication, authorization, rendering, and response status
    side_effects: response delivery
    retries: client initiated retries are separate requests
    existing_signals: Thruster access output, Lograge completion output, Puma output, and Rack trace spans
    correlation_context: request id and valid trace context within one request
    privacy_classification: restricted_request_metadata
    missing_outcomes: one canonical completion event, safe route template, severity, deployment identity, and producer separation
    owner: platform_observability
    verification: test_mode_and_final_production_image_request_contracts
  - id: medication_administration
    entrypoints: schedule, person medication, API, and offline record-dose operations
    decisions: household availability, stock source, amount, overlap rules, persistence, outer commit, and rollback
    side_effects: medication take persistence and stock mutation
    retries: client UUID idempotency and distinct retry attempts
    existing_signals: five take and dose events plus one free-text outcome log
    correlation_context: request or job trace only; no workflow, causation, event, or attempt identifiers
    privacy_classification: restricted_health_data
    missing_outcomes: safe attempt, provisional persistence, committed success, rollback, and unavailable-household outcomes
    owner: medication_workflows
    verification: medication_schema_transaction_idempotency_and_fail_open_specs
  - id: scheduled_reminders
    entrypoints: ScheduleDailyRemindersJob and MissedDoseNotificationJob
    decisions: enqueue timing, occurrence eligibility, past occurrence, preference suppression, and deduplication
    side_effects: queued jobs and notification attempts
    retries: Solid Queue retry and notification deduplication
    existing_signals: direct free-text job logs and generic job lifecycle output
    correlation_context: request and job identifiers do not span the whole reminder workflow
    privacy_classification: restricted_health_and_notification_data
    missing_outcomes: correlated enqueue, eligibility, suppression, deduplication, retry, and failure outcomes
    owner: medication_notifications
    verification: reminder_workflow_stage_and_correlation_specs
  - id: low_stock_notifications
    entrypoints: medication take after_commit event, subscriber, and LowStockNotificationJob
    decisions: threshold crossing, preference eligibility, recipient selection, and delivery
    side_effects: job enqueue and notification attempts
    retries: Solid Queue retry and delivery idempotency
    existing_signals: low-stock event, subscriber enqueue, direct job log, and generic job lifecycle output
    correlation_context: raw identifiers are passed between stages without an opaque workflow identifier
    privacy_classification: restricted_health_and_notification_data
    missing_outcomes: safe evaluation, enqueue, suppression, retry, and delivery outcomes
    owner: medication_notifications
    verification: low_stock_workflow_stage_and_idempotency_specs
  - id: push_delivery
    entrypoints: PushSubscriptionsController and PushNotificationService
    decisions: subscription validity, provider response, partial failure, and permanent failure
    side_effects: external web-push provider attempt and subscription cleanup
    retries: caller or job retries; provider delivery remains unconfirmed
    existing_signals: direct free-text logs
    correlation_context: no stable workflow and attempt identifiers across provider calls
    privacy_classification: restricted_notification_and_endpoint_data
    missing_outcomes: attempted, provider accepted, partial failure, permanent failure, and delivery unknown
    owner: medication_notifications
    verification: push_provider_outcome_and_privacy_specs
  - id: rate_limiting
    entrypoints: Rack Attack throttled responder
    decisions: matched throttle and retry interval
    side_effects: HTTP 429 response
    retries: each new request is a distinct attempt
    existing_signals: rack_attack.throttled event and duplicate free-text warning
    correlation_context: request context is not explicitly included and raw IP is published
    privacy_classification: restricted_security_and_network_data
    missing_outcomes: safe throttle reason, request correlation, fail-open emission, and duplicate removal
    owner: application_security
    verification: rate_limit_mapping_privacy_and_response_preservation_specs
  - id: audit_backlog_monitoring
    entrypoints: Audit::BacklogMonitor
    decisions: healthy, warning, and critical backlog age
    side_effects: aggregate operational event
    retries: each monitor execution is a distinct evaluation
    existing_signals: audit_delivery_backlog.med_tracker with aggregate fields
    correlation_context: no stable monitor execution event identifier
    privacy_classification: operational_aggregate
    missing_outcomes: canonical mapping, execution identifier, and severity contract
    owner: audit_security
    verification: audit_backlog_schema_and_safe_mapping_specs

follow_up_changes:
  - id: standardize-authentication-workflow-observability
    discovery: Rodauth, passkey, WebAuthn, OIDC, and token-audit decisions exist outside the seven frozen workflow families
    owner: application_security
    scope_boundary: this change migrates unsafe direct logs but does not add authentication domain-stage events
  - id: standardize-medication-catalog-integration-observability
    discovery: NHS dm+d import, terminology resolution, barcode, food, product, and guidance lookup workflows have adapter decisions outside the frozen families
    owner: data_integrations
    scope_boundary: this change migrates unsafe direct logs but does not instrument new import or lookup workflows
  - id: standardize-ai-medication-workflow-observability
    discovery: AI suggestion and its audit decisions form a separate health-data workflow
    owner: medication_intelligence
    scope_boundary: this change migrates unsafe direct logs but does not add AI workflow-stage events
  - id: standardize-audit-export-delivery-observability
    discovery: audit export delivery has decisions beyond the bounded aggregate backlog monitor
    owner: audit_security
    scope_boundary: this change covers backlog health only and does not add export-delivery stage events
  - id: correct-notification-state-transitions
    discovery: notification intent sent_at and skipped state do not distinguish provider acceptance from unknown device delivery
    owner: medication_notifications
    scope_boundary: define and migrate the persisted notification state machine without changing eligibility or recipient selection
  - id: standardize-notification-occurrence-timezones
    discovery: reminder occurrence dates and times cross household and process timezone boundaries without one persisted occurrence contract
    owner: medication_notifications
    scope_boundary: define occurrence timezone storage and daylight-saving behavior without changing notification channels
  - id: clarify-notification-preference-ownership
    discovery: self and managed-recipient preferences contribute to missed-dose eligibility through different ownership paths
    owner: medication_notifications
    scope_boundary: define preference precedence and ownership without changing access-grant authorization
  - id: align-notification-channel-parity
    discovery: missed-dose eligibility recognizes web and native push while low-stock prechecks recognize web push only
    owner: medication_notifications
    scope_boundary: align channel eligibility and fallback behavior without adding email or SMS
