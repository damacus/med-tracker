schema_version: 1
source_revision: 82970afde0f90c40058f1b8fd01b7e3276f637c5

transports:
  container_stdout:
    protocol: newline_delimited_text
    collector: container_runtime
    backend: loki
  otlp_http_protobuf:
    protocol: otlp_http_protobuf
    collector: configured_otlp_endpoint
    backend: tracing_and_metrics_backend

output_producers:
  - id: thruster
    source: production image entrypoint
    formatter: thruster_json_access
    transport: container_stdout
    sink: loki
    privacy_classification: restricted_request_and_network_metadata
    owner: platform_observability
    verification: final_production_image_characterization
  - id: rails_ecs_lograge
    source: config/environments/production.rb and config/initializers/lograge.rb
    formatter: ecs_logger_with_lograge_request_json
    transport: container_stdout
    sink: loki
    privacy_classification: restricted_application_and_request_metadata
    owner: platform_observability
    verification: test_mode_and_final_production_image_contracts
  - id: puma
    source: production Rails server process
    formatter: puma_console_text
    transport: container_stdout
    sink: loki
    privacy_classification: operational
    owner: platform_observability
    verification: final_production_image_characterization
  - id: solid_queue
    source: bin/jobs
    formatter: rails_logger_and_solid_queue_console
    transport: container_stdout
    sink: loki
    privacy_classification: restricted_job_metadata
    owner: platform_observability
    verification: test_mode_and_final_production_image_contracts
  - id: opentelemetry_sdk
    source: config/initializers/opentelemetry.rb
    formatter: otlp_proto
    transport: otlp_http_protobuf
    sink: tracing_and_metrics_backend
    privacy_classification: allowlisted_telemetry
    owner: platform_observability
    verification: final_production_image_exporter_capture_and_span_privacy_contracts

introduced_signal_paths:
  - type: canonical_output_boundary
    source: lib/observability/canonical_logger.rb
    operational_sink: container_stdout
    privacy_classification: canonical_allowlisted_event_only
    failure_policy: exceptions are isolated by the publisher
    owner: platform_observability
    verification: publisher_and_final_production_image_contracts
  - type: context_enricher
    source: lib/observability/context_enricher.rb
    operational_sink: canonical_event_context
    privacy_classification: opaque_identifiers_and_valid_trace_context_only
    failure_policy: malformed or absent context is omitted
    owner: platform_observability
    verification: context_enricher_specs
  - type: correlation_context
    source: lib/observability/correlation_context.rb
    operational_sink: canonical_event_and_job_propagation_context
    privacy_classification: opaque_bounded_lifetime_identifiers
    failure_policy: invalid or expired propagation rotates to a new root workflow
    owner: platform_observability
    verification: correlation_lifecycle_contract_specs
  - type: emergency_diagnostic
    source: lib/observability/emergency_diagnostic.rb
    operational_sink: process_stderr
    privacy_classification: fixed_schema_error_type_and_event_name_only
    failure_policy: bounded non-recursive and fail open
    owner: platform_observability
    verification: publisher_and_fail_open_resilience_specs
  - type: custom_event_safe_mapper
    source: lib/observability/event_mapper.rb
    operational_sink: canonical_operational_event_builder
    privacy_classification: event_specific_allowlists
    failure_policy: invalid mappings are isolated by the publisher
    owner: platform_observability
    verification: event_mapper_and_registry_enforcement_specs
  - type: custom_event_mapping_support
    source: lib/observability/event_mapping_support.rb
    operational_sink: custom_event_safe_mapper
    privacy_classification: bounded_event_shapes_source_categories_and_counts_only
    failure_policy: mapping_failures_are_isolated_by_the_publisher
    owner: platform_observability
    verification: event_mapper_and_registry_enforcement_specs
  - type: canonical_event_serializer
    source: lib/observability/operational_event.rb
    operational_sink: canonical_logger
    privacy_classification: flat_ecs_envelope_with_event_specific_allowlists
    failure_policy: serialization failures are isolated by the publisher
    owner: platform_observability
    verification: schema_correlation_and_privacy_contract_specs
  - type: canonical_event_sanitizer
    source: lib/observability/operational_event_sanitizer.rb
    operational_sink: canonical_event_serializer
    privacy_classification: event_specific_scalar_allowlists_and_valid_opaque_context_only
    failure_policy: validation_and_serialization_failures_are_isolated_by_the_publisher
    owner: platform_observability
    verification: schema_correlation_and_privacy_contract_specs
  - type: canonical_event_validator
    source: lib/observability/operational_event_validator.rb
    operational_sink: canonical_event_serializer
    privacy_classification: registered_names_outcomes_reasons_datasets_and_opaque_event_ids_only
    failure_policy: validation_failures_are_isolated_by_the_publisher
    owner: platform_observability
    verification: schema_correlation_and_privacy_contract_specs
  - type: canonical_event_payload_builder
    source: lib/observability/operational_event_payload_builder.rb
    operational_sink: canonical_event_serializer
    privacy_classification: flat_ecs_envelope_with_event_specific_allowlists
    failure_policy: serialization_failures_are_isolated_by_the_publisher
    owner: platform_observability
    verification: schema_correlation_and_privacy_contract_specs
  - type: publisher_helper
    source: lib/observability/publisher.rb
    operational_sink: canonical_logger_with_emergency_fallback
    privacy_classification: accepts_only_registered_event_shapes
    failure_policy: fail open with at most one emergency diagnostic
    owner: platform_observability
    verification: publisher_fail_open_and_duplicate_ingestion_specs
  - type: bounded_diagnostic_adapter
    source: lib/observability/diagnostic_event.rb
    operational_sink: canonical_operational_event_publisher
    privacy_classification: categorical_component_reason_severity_and_error_type_only
    failure_policy: fail open through the publisher and bounded emergency diagnostic
    owner: platform_observability
    verification: diagnostic_event_and_final_census_specs
  - type: deployed_observability_canary
    source: lib/observability/deployed_canary.rb
    operational_sink: canonical_application_event_sampled_trace_and_bounded_metric
    privacy_classification: generated_opaque_context_and_fixed_categorical_canary_kind_only
    failure_policy: log_and_trace_emission_are_fail_open_and_metric_failure_emits_a_bounded_diagnostic
    owner: platform_observability
    verification: deployed_canary_unit_final_image_and_production_acceptance_contracts
  - type: bounded_metric_label_mapper
    source: lib/observability/metric_labels.rb
    operational_sink: opentelemetry_metrics
    privacy_classification: fixed_low_cardinality_categorical_labels_only
    failure_policy: invalid_or_unregistered_labels_are_omitted
    owner: platform_observability
    verification: operational_event_privacy_contract_spec
  - type: domain_event_publisher_helper
    source: lib/observability/domain_event_publisher.rb
    operational_sink: canonical_publication_and_subscriber_failure_events_before_active_support_dispatch
    privacy_classification: registered_event_specific_allowlists_and_error_type_only
    failure_policy: operational_failure_is_fail_open_and_business_subscriber_failure_preserves_propagation
    owner: platform_observability
    verification: domain_event_publisher_order_failure_and_propagation_specs
  - type: medication_transaction_outcome
    source: lib/observability/medication_transaction_outcome.rb
    operational_sink: committed_domain_event_or_canonical_rollback_event
    privacy_classification: source_category_and_opaque_correlation_only
    failure_policy: operational_emission_is_fail_open_and_domain_subscriber_semantics_are_preserved
    owner: medication_workflows
    verification: outer_transaction_medication_outcome_specs
  - type: notification_stage_adapter
    source: lib/observability/notification_stage.rb
    operational_sink: canonical_notification_stage_event
    privacy_classification: categorical_notification_outcomes_and_bounded_counts_only
    failure_policy: fail_open_through_the_operational_publisher
    owner: medication_notifications
    verification: reminder_low_stock_and_push_stage_specs
  - type: request_event_adapter
    source: lib/observability/request_event.rb
    operational_sink: canonical_logger_through_publisher
    privacy_classification: route_template_and_bounded_request_metadata_only
    failure_policy: fail open through the publisher
    owner: platform_observability
    verification: request_event_and_final_production_image_contracts
  - type: job_event_adapter
    source: lib/observability/job_event.rb
    operational_sink: canonical_logger_through_publisher
    privacy_classification: job_class_queue_and_opaque_job_identifier_without_arguments
    failure_policy: fail open through the publisher
    owner: platform_observability
    verification: job_event_and_final_production_image_contracts
  - type: job_completion_subscriber
    source: lib/observability/job_completion_subscriber.rb
    operational_sink: canonical_job_event
    privacy_classification: excludes_job_arguments_and_exception_text
    failure_policy: fail open through one bounded emergency diagnostic
    owner: platform_observability
    verification: job_completion_subscriber_specs
  - type: job_retry_subscriber
    source: lib/observability/job_retry_subscriber.rb
    operational_sink: canonical_notification_retry_stage_event
    privacy_classification: job_class_mapping_and_error_type_without_arguments
    failure_policy: fail_open_through_one_bounded_emergency_diagnostic
    owner: medication_notifications
    verification: job_retry_subscriber_specs
  - type: process_log_formatter
    source: lib/observability/process_log_formatter.rb
    operational_sink: container_stdout
    privacy_classification: fixed_process_metadata_without_source_message_text
    failure_policy: producer startup fails if its formatter cannot initialize
    owner: platform_observability
    verification: process_log_formatter_and_final_image_specs
  - type: process_dataset_logger
    source: lib/observability/dataset_logger.rb
    operational_sink: container_stdout
    privacy_classification: fixed_process_metadata_without_source_message_text
    failure_policy: process library controls logger call propagation
    owner: platform_observability
    verification: process_logging_configuration_and_final_image_specs
  - type: request_completion_subscriber
    source: lib/observability/request_completion_subscriber.rb
    operational_sink: canonical_request_event
    privacy_classification: excludes_raw_path_query_parameters_cookies_and_network_metadata
    failure_policy: fail open through one bounded emergency diagnostic
    owner: platform_observability
    verification: request_completion_subscriber_specs
  - type: request_subscriber_installation
    source: config/initializers/observability_request_logging.rb
    operational_sink: process_action_action_controller_notification
    privacy_classification: no_payload_serialization_at_installation
    failure_policy: production_only_installation
    owner: platform_observability
    verification: final_production_image_request_contract
  - type: process_and_job_subscriber_installation
    source: config/initializers/observability_process_logging.rb
    operational_sink: process_datasets_and_job_completion_notification
    privacy_classification: installs_only_safe_formatters_and_subscribers
    failure_policy: production process boot must reject invalid configuration
    owner: platform_observability
    verification: process_logging_configuration_and_final_image_contract
  - type: active_job_correlation_lifecycle
