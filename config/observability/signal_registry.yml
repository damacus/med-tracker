custom_events:
  - name: take_attempted.med_tracker
    publisher: app/services/medication_administration/record_dose.rb#record_dose
    payload_contract: environment, role, route, medicine_context_class, source_type, error, decision context
    production_subscribers: []
    operational_sink: planned_canonical_application_event
    disposition: migrated
    correlation_context: none_in_frozen_baseline
    transaction_timing: before validation and persistence inside the current transaction boundary
    failure_policy: subscriber failure currently propagates synchronously
    privacy_classification: restricted_health_context_requires_safe_mapping
    owner: medication_workflows
    verification: record_dose_event_and_operational_mapping_specs
  - name: take_recorded.med_tracker
    publisher: app/services/medication_administration/record_dose.rb#success
    payload_contract: environment, role, route, medicine_context_class, source_type, error, decision context
    production_subscribers: []
    operational_sink: planned_canonical_application_event
    disposition: migrated
    correlation_context: none_in_frozen_baseline
    transaction_timing: after row persistence but before a possible outer transaction commit
    failure_policy: subscriber failure currently propagates synchronously and can roll back the caller
    privacy_classification: restricted_health_context_requires_safe_mapping
    owner: medication_workflows
    verification: outer_transaction_medication_outcome_specs
  - name: take_blocked_by_rules.med_tracker
    publisher: app/services/medication_administration/record_dose.rb#rule_blocked_failure
    payload_contract: environment, role, route, medicine_context_class, source_type, stable error, decision context
    production_subscribers: []
    operational_sink: planned_canonical_application_event
    disposition: migrated
    correlation_context: none_in_frozen_baseline
    transaction_timing: before persistence inside the current transaction boundary
    failure_policy: subscriber failure currently propagates synchronously
    privacy_classification: restricted_health_context_requires_safe_mapping
    owner: medication_workflows
    verification: medication_rule_blocking_mapping_specs
  - name: take_errors.med_tracker
    publisher: app/services/medication_administration/record_dose.rb#persistence_failure
    payload_contract: environment, role, route, medicine_context_class, source_type, stable error, decision context
    production_subscribers: []
    operational_sink: planned_canonical_application_event
    disposition: migrated
    correlation_context: none_in_frozen_baseline
    transaction_timing: after a failed persistence attempt inside the current transaction boundary
    failure_policy: subscriber failure currently propagates synchronously
    privacy_classification: restricted_health_context_requires_safe_mapping
    owner: medication_workflows
    verification: medication_persistence_failure_mapping_specs
  - name: dose_taken.med_tracker
    publisher: app/services/medication_administration/record_dose.rb#publish_dose_taken
    payload_contract: raw take, source, person, medication, inventory, quantity, unit, and timestamp fields
    production_subscribers: []
    operational_sink: planned_canonical_application_event
    disposition: migrated
    correlation_context: none_in_frozen_baseline
    transaction_timing: after row persistence but before a possible outer transaction commit
    failure_policy: subscriber failure currently propagates synchronously and can roll back the caller
    privacy_classification: restricted_health_data_unsafe_for_direct_export
    owner: medication_workflows
    verification: dose_taken_safe_mapping_and_outer_transaction_specs
  - name: low_stock_threshold_reached.med_tracker
    publisher: app/models/medication_take.rb#publish_low_stock_threshold_reached
    payload_contract: raw household, medication, location, take, source, supply, threshold, and timestamp fields
    production_subscribers:
      - config/initializers/low_stock_notification_subscriber.rb
    operational_sink: planned_canonical_application_event_and_low_stock_job_stage_events
    disposition: migrated
    correlation_context: none_in_frozen_baseline
    transaction_timing: after the medication take outer transaction commits
    failure_policy: subscriber enqueue failure currently propagates from the after_commit callback
    privacy_classification: restricted_health_data_unsafe_for_direct_export
    owner: medication_notifications
    verification: low_stock_commit_mapping_and_delivery_specs
  - name: audit_delivery_backlog.med_tracker
    publisher: app/services/audit/backlog_monitor.rb#call
    payload_contract: severity, pending count, oldest age, and warning and critical thresholds
    production_subscribers: []
    operational_sink: planned_canonical_application_event
    disposition: migrated
    correlation_context: none_in_frozen_baseline
    transaction_timing: outside a write transaction after aggregate backlog evaluation
    failure_policy: subscriber failure currently propagates synchronously
    privacy_classification: operational_aggregate
    owner: audit_security
    verification: audit_backlog_safe_mapping_specs
  - name: rack_attack.throttled
    publisher: config/initializers/rack_attack.rb#throttled_responder
    payload_contract: throttle name and raw client IP address
    production_subscribers: []
    operational_sink: planned_canonical_application_event
    disposition: migrated
    correlation_context: request context is not explicitly propagated
    transaction_timing: outside a database transaction while constructing the throttled response
    failure_policy: subscriber failure currently propagates and can replace the 429 response
    privacy_classification: restricted_network_identifier_unsafe_for_direct_export
    owner: application_security
    verification: rate_limit_safe_mapping_and_fail_open_specs

direct_logger_policies:
  medication_health_migration:
    disposition: migrated
    message_contract: current free text becomes a registered medication outcome
    correlation_context: request or job context is not guaranteed in the frozen baseline
    transaction_timing: inline at the call site and not commit aware
    failure_policy: target canonical emission is fail open
    privacy_classification: restricted_health_context
    owner: medication_workflows
    verification: medication_outcome_and_privacy_specs
  notification_migration:
    disposition: migrated
    message_contract: current free text becomes a registered notification stage outcome
    correlation_context: no cross-execution workflow context in the frozen baseline
    transaction_timing: inline in the job or provider attempt
    failure_policy: target canonical emission is fail open
    privacy_classification: restricted_notification_context
    owner: medication_notifications
    verification: reminder_low_stock_and_push_outcome_specs
  integration_migration:
    disposition: migrated
    message_contract: current free text becomes a bounded external adapter outcome
    correlation_context: request or job context is not guaranteed in the frozen baseline
    transaction_timing: inline after or during an external adapter call
    failure_policy: target canonical emission is fail open
    privacy_classification: restricted_external_and_health_context
    owner: data_integrations
    verification: external_adapter_privacy_and_outcome_specs
  security_migration:
    disposition: migrated
    message_contract: current free text becomes a bounded security or audit outcome
    correlation_context: request context is inconsistent in the frozen baseline
    transaction_timing: inline at the security decision or audit boundary
    failure_policy: target canonical emission is fail open
    privacy_classification: restricted_security_context
    owner: application_security
    verification: security_audit_privacy_and_correlation_specs
  telemetry_migration:
    disposition: migrated
    message_contract: current free text becomes a bounded telemetry health outcome
    correlation_context: process or trace context where valid
    transaction_timing: inline at process boot or telemetry failure
    failure_policy: fail open through the bounded non-recursive emergency diagnostic
    privacy_classification: operational
    owner: platform_observability
    verification: telemetry_failure_and_emergency_diagnostic_specs
  duplicate_event_removal:
    disposition: removed
    message_contract: superseded by the registered canonical application event
    correlation_context: inherited by the replacement event
    transaction_timing: replacement event declares its own transaction timing
    failure_policy: replacement canonical emission is fail open
    privacy_classification: unsafe_free_text_or_duplicate
    owner: platform_observability
    verification: census_and_exact_application_emission_specs
  development_noise_removal:
    disposition: removed
    message_contract: development-only fallback noise has no production operational contract
    correlation_context: none
    transaction_timing: outside the application transaction contract
    failure_policy: removal cannot affect delivery behavior
    privacy_classification: development_only
    owner: developer_experience
    verification: final_census_spec

