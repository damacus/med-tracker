logger:
  enable: true
  pretty_backtrace: false
  level: info
  format: compact
settings:
  dose_occurrences:
    signing_key: <%= get_env(name="AUTH_SESSION_SECRET", default="synthetic-development-dose-occurrence-key") %>
  ai_medication_help:
    enabled: <%= get_env(name="MEDTRACKER_AI_MEDICATION_HELP_ENABLED", default="false") %>
    model: <%= get_env(name="MEDTRACKER_AI_MEDICATION_HELP_MODEL", default="") %>
    provider: <%= get_env(name="MEDTRACKER_AI_MEDICATION_HELP_PROVIDER", default="") %>
    api_key: <%= get_env(name="MEDTRACKER_AI_MEDICATION_HELP_API_KEY", default="") %>
    api_base_url: <%= get_env(name="MEDTRACKER_AI_MEDICATION_HELP_API_BASE_URL", default="") %>
    source_proxy_origin: <%= get_env(name="MEDTRACKER_AI_MEDICATION_SOURCE_PROXY_ORIGIN", default="") %>
  browser_session:
    key: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBw==
    secure: false
server:
  port: <%= get_env(name="PORT", default="5150") %>
  binding: <%= get_env(name="BINDING", default="127.0.0.1") %>
  host: http://localhost
  middlewares:
    logger:
      enable: false
    static:
      enable: true
      must_exist: true
      folder:
        uri: /static
        path: assets/static
      fallback: assets/static/404.html
      cache_control: no-cache
workers:
  mode: BackgroundQueue
scheduler:
  jobs:
    nhs_dmd_reconcile:
      run: nhs_dmd_reconcile
      schedule: "0 */5 * * * *"
    browser_reminders:
      run: browser-reminders
      schedule: "0 * * * * *"
queue:
  kind: Postgres
  uri: <%= get_env(name="DATABASE_URL", default="postgres://medtracker:medtracker_password@localhost:5432/medtracker_loco") %>
  reaper:
    age_minutes: 10
    interval_seconds: 60
database:
  uri: <%= get_env(name="DATABASE_URL", default="postgres://medtracker:medtracker_password@localhost:5432/medtracker_loco") %>
  enable_logging: false
  connect_timeout: 5000
  idle_timeout: 5000
  min_connections: 1
  max_connections: 4
  auto_migrate: false
  dangerously_truncate: false
  dangerously_recreate: false
