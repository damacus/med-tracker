services:
  postgres:
    volumes:
      - database:/var/lib/postgresql
  tool:
    profiles: [dev, test]
    build:
      context: .
      target: development
    image: ${MT_PROJECT}-tool
    working_dir: /app
    init: true
    environment: &tool_environment
      DATABASE_URL: postgres://medtracker:medtracker_password@postgres/medtracker_loco
      MEDTRACKER_OWNED_DATABASE: "1"
      MEDTRACKER_OWNED_STORAGE: "1"
      CARGO_INCREMENTAL: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      BINDING: 0.0.0.0
      MEDTRACKER_SESSION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBw==
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: scanner-fixture
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: storage-smoke-access
      AWS_SECRET_ACCESS_KEY: storage-smoke-secret
      ACTIVE_STORAGE_S3_ENDPOINT: http://rustfs:9000
      ACTIVE_STORAGE_S3_BUCKET: medtracker-fixture
      ACTIVE_STORAGE_S3_REGION: us-east-1
      ACTIVE_STORAGE_S3_ACCESS_KEY_ID: storage-smoke-access
      ACTIVE_STORAGE_S3_SECRET_ACCESS_KEY: storage-smoke-secret
      ACTIVE_STORAGE_S3_FORCE_PATH_STYLE: "true"
    volumes: &tool_volumes
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/app/target
      - node-modules:/app/node_modules
      - browser-cache:/root/.cache
    command: [sleep, infinity]
  dev-app:
    extends: tool
    profiles: !override [dev]
    environment:
      DATABASE_URL: postgres://medtracker_runtime:synthetic_local_runtime_password@postgres/medtracker_loco
    command: [cargo, watch, --poll, -w, src, -w, migration, -w, assets, -w, config, -w, Cargo.toml, -w, Cargo.lock, -w, build.rs, --ignore, assets/static/css/compiled.css, --ignore, assets/static/js/html5-qrcode.min.js, -s, "task --taskfile Taskfiles/frontend.yml --dir /app prepare && cargo run --locked -- start --server-and-worker --environment development"]
    ports:
      - target: 5150
        host_ip: 127.0.0.1
  dev-scheduler:
    extends: tool
    profiles: !override [dev]
    environment:
      DATABASE_URL: postgres://medtracker_runtime:synthetic_local_runtime_password@postgres/medtracker_loco
    command: [cargo, watch, --poll, -w, src, -w, migration, -w, config, -x, "run --locked -- scheduler --environment development"]
  test-app:
    extends: dev-app
    profiles: !override [test]
    command: [cargo, watch, --poll, -w, src, -w, migration, -w, assets, -w, config, -w, Cargo.toml, -w, Cargo.lock, -w, build.rs, --ignore, assets/static/css/compiled.css, --ignore, assets/static/js/html5-qrcode.min.js, -s, "task --taskfile Taskfiles/frontend.yml --dir /app prepare && cargo run --locked -- start --server-and-worker --environment test"]
    environment:
      MEDTRACKER_COOKIE_SECURE: "false"
  test-scheduler:
    extends: dev-scheduler
    profiles: !override [test]
    command: [cargo, watch, --poll, -w, src, -w, migration, -w, config, -x, "run --locked -- scheduler --environment test"]
  app:
    profiles: [prod]
    build:
      context: .
      target: runtime
    image: ${LOCO_IMAGE:-${MT_PROJECT}-runtime}
    environment: &runtime_environment
      DATABASE_URL: postgres://medtracker_runtime:synthetic_local_runtime_password@postgres/medtracker_loco
      MEDTRACKER_PUBLIC_HOST: http://localhost
      MEDTRACKER_SESSION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBw==
      AUTH_SESSION_SECRET: synthetic-local-production-secret-at-least-32-characters
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:uid=65532,gid=65532"]
    command: [start, --server-and-worker, --environment, production]
    ports:
      - target: 5150
        host_ip: 127.0.0.1
  scheduler:
    extends: app
    profiles: [prod]
    ports: !reset []
    command: [scheduler, --environment, production]
volumes:
  database:
    labels:
      io.medtracker.local-owner: ${MT_PROJECT}
  scanner-data:
    labels:
      io.medtracker.local-owner: ${MT_PROJECT}
  scanner-logs:
    labels:
      io.medtracker.local-owner: ${MT_PROJECT}
  cargo-registry:
  cargo-git:
  target:
  node-modules:
  browser-cache:
