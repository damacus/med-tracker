---
version: "3"
silent: true
run: once

includes:
  rails:
    taskfile: rails/Taskfile.yml
    dir: rails
  rust:
    taskfile: rust/Taskfile.yml
    dir: .
  api:
    taskfile: rust/api/Taskfile.yml
    dir: .
  contracts:
    taskfile: rust/contract-tests/Taskfile.yml
    dir: .
    aliases: [contract]
  client-tools:
    taskfile: client-tools/Taskfile.yml
    dir: client-tools
  api-clients:
    taskfile: client-tools/openapi-generator/Taskfile.yml
    dir: .
  mobile:android:
    taskfile: mobile/android/Taskfile.yml
    dir: mobile/android
    aliases: [android]
  docs:
    taskfile: docs/Taskfile.yml
    dir: .
  ci:
    taskfile: Taskfiles/ci.yml
    dir: .
  worktree:
    taskfile: Taskfiles/worktree.yml
    dir: .
  openspec:
    taskfile: Taskfiles/openspec.yml
    dir: .
  agents:
    taskfile: Taskfiles/agents.yml
    dir: .
    flatten: true

tasks:
  slice:test-runner:
    cmds: [node --test scripts/migration/run-slice.test.mjs]
  slice:test:
    requires:
      vars: [TARGET]
    env:
      SLICE_TARGET: '{{.TARGET}}'
      SLICE_FILTER: '{{.FILTER | default ""}}'
    cmds: [node scripts/migration/run-slice.mjs]
  slice:test-all:
    cmds: [node scripts/migration/run-slice.mjs --all]
  slice:catalog:
    env:
      PERSISTENCE_CATALOG_OUTPUT_DIR: '{{.OUTPUT_DIR | default ""}}'
    cmds: [node scripts/migration/run-slice.mjs --capture-catalog]
  inventory:write:
    desc: Record reconciled migration inputs
    cmds: [node scripts/migration/inventory.mjs --write]
  inventory:check:
    desc: Reject unreconciled source inventory drift
    cmds: [node scripts/migration/inventory.mjs]
  preservation:write:
    desc: Record relocation checksums and preserve source comments
    cmds: [node scripts/migration/preservation.mjs --write]
  preservation:check:
    desc: Check preserved source files and comments
    cmds: [node scripts/migration/preservation.mjs]
  deps:
    desc: Resolve the root Loco lockfile
    cmds: [cargo generate-lockfile]
  deps:migration:
    cmds: [cargo update --offline --package migration]
  foundation:db-up:
    requires:
      vars: [FOUNDATION_PROJECT]
    cmds: ['docker compose -f "{{.ROOT_DIR}}/compose.yaml" --env-file /dev/null -p {{.FOUNDATION_PROJECT}} up -d --wait postgres']
  foundation:db-port:
    requires:
      vars: [FOUNDATION_PROJECT]
    cmds: ['docker compose -f "{{.ROOT_DIR}}/compose.yaml" --env-file /dev/null -p {{.FOUNDATION_PROJECT}} port postgres 5432']
  foundation:db-provision:
    requires:
      vars: [FOUNDATION_PROJECT]
    cmds:
      - 'docker compose -f "{{.ROOT_DIR}}/compose.yaml" --env-file /dev/null -p {{.FOUNDATION_PROJECT}} exec -T postgres psql -X -v ON_ERROR_STOP=1 -U medtracker -d medtracker_loco -c "CREATE DATABASE medtracker_reference"'
      - 'cat "{{.ROOT_DIR}}/tests/fixtures/persistence-roles.sql" "{{.ROOT_DIR}}/migration/baseline.sql" | docker compose -f "{{.ROOT_DIR}}/compose.yaml" --env-file /dev/null -p {{.FOUNDATION_PROJECT}} exec -T postgres psql -X -v ON_ERROR_STOP=1 --single-transaction -U medtracker -d medtracker_reference'
  foundation:db-down:
    requires:
      vars: [FOUNDATION_PROJECT]
    cmds: ['docker compose -f "{{.ROOT_DIR}}/compose.yaml" --env-file /dev/null -p {{.FOUNDATION_PROJECT}} down --volumes']
  foundation:test-ci-paths:
    cmds: [node --test scripts/ci/tests/loco_paths.test.mjs]
  foundation:test-workspaces:
    cmds: [node --test scripts/migration/workspaces.test.mjs]
  dev:
    desc: Start the Loco server
    cmds: ['cargo run --locked -- start --environment {{.LOCO_ENV | default "development"}}']
  build:
    desc: Build Loco
    cmds: [cargo build --locked]
  check:
    desc: Check Loco targets
    cmds: [cargo check --locked --all-targets]
  lint:
    desc: Lint Loco
    cmds: [cargo clippy --locked --all-targets -- -D warnings]
  fmt:
    desc: Check Loco formatting
    cmds: [cargo fmt --all -- --check]
  fmt:apply:
    cmds: [cargo fmt --all]
  test:
    desc: Verify Loco and root ownership contracts
    cmds:
      - task: slice:test-runner
      - task: slice:test-all
      - task: foundation:test
      - task: foundation:test-workspaces
      - task: foundation:test-relocation
      - task: foundation:test-preservation
      - task: inventory:check
      - task: preservation:check
      - task: foundation:test-cleanup
      - task: foundation:test-database
      - task: foundation:test-http
  routes:
    desc: List Loco routes
    cmds: ['cargo run --locked -- routes --environment {{.LOCO_ENV | default "development"}}']
  db:migrate:
    desc: Persistence adoption gate (tranche 2)
    cmds: ['fish -c ''echo "Loco schema adoption awaits tranche 2 acceptance" >&2; exit 1''']
  db:seed:
    desc: Fixture migration gate (tranche 2)
    cmds: ['fish -c ''echo "Loco fixtures await tranche 2 acceptance" >&2; exit 1''']
  worker:
    desc: Start the Loco worker process
    cmds: ['cargo run --locked -- start --worker --environment {{.LOCO_ENV | default "development"}}']
  browser:
    desc: Exercise Loco health and Tera over HTTP
    cmds: [{task: foundation:test-http}]
  release-image:
    desc: Release runtime gate (tranche 6)
    cmds: ['fish -c ''echo "Production Loco image awaits full migration acceptance" >&2; exit 1''']
  ci:
    desc: Verify root Loco foundation
    cmds:
      - task: fmt
      - task: lint
      - task: test
  foundation:test:
    cmds: [node --test scripts/migration/foundation.test.mjs]
  foundation:test-http:
    cmds: [node --test scripts/migration/foundation-http.test.mjs]
  foundation:test-cleanup:
    cmds: [node --test scripts/migration/process-cleanup.test.mjs]
  foundation:test-preservation:
    cmds: [node --test scripts/migration/preservation.test.mjs]
  foundation:test-relocation:
    cmds: [node --test scripts/migration/relocation.test.mjs]
  foundation:test-database:
    cmds: [node --test scripts/migration/foundation-database.test.mjs]
  default:
    desc: List all available tasks
    summary: Default task - shows all available commands
    silent: true
    cmds: [task --list]
