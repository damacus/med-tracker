---
version: "3"
silent: true
run: once

includes:
  browser-care:
    taskfile: Taskfiles/browser-care.yml
    dir: .
  frontend:
    taskfile: Taskfiles/frontend.yml
    dir: .
  rails:
    taskfile: rails/Taskfile.yml
    dir: rails
  rust:
    taskfile: rust/Taskfile.yml
    dir: .
  api:
    taskfile: rust/api/Taskfile.yml
    dir: .
  contracts:
    taskfile: rust/contract-tests/Taskfile.yml
    dir: .
    aliases: [contract]
  client-tools:
    taskfile: client-tools/Taskfile.yml
    dir: client-tools
  api-clients:
    taskfile: client-tools/openapi-generator/Taskfile.yml
    dir: .
  mobile:android:
    taskfile: mobile/android/Taskfile.yml
    dir: mobile/android
    aliases: [android]
  docs:
    taskfile: docs/Taskfile.yml
    dir: .
  ci:
    taskfile: Taskfiles/ci.yml
    dir: .
  worktree:
    taskfile: Taskfiles/worktree.yml
    dir: .
  openspec:
    taskfile: Taskfiles/openspec.yml
    dir: .
  agents:
    taskfile: Taskfiles/agents.yml
    dir: .
    flatten: true

tasks:
  slice:browser:
    cmds:
      - task: frontend:test-browser
        vars:
          GROUP: '{{.GROUP | default "shell"}}'
  slice:test-runner:
    cmds: [node --test scripts/migration/run-slice.test.mjs]
  slice:test:
    requires:
      vars: [TARGET]
    env:
      SLICE_TARGET: '{{.TARGET}}'
      SLICE_FILTER: '{{.FILTER | default ""}}'
    cmds: [node scripts/migration/run-slice.mjs]
  slice:test-all:
    env:
      RUST_TEST_THREADS: "4"
    cmds: [node scripts/migration/run-slice.mjs --all]
  slice:catalog:
    env:
      PERSISTENCE_CATALOG_OUTPUT_DIR: '{{.OUTPUT_DIR | default ""}}'
    cmds: [node scripts/migration/run-slice.mjs --capture-catalog]
  inventory:write:
    desc: Record reconciled migration inputs
    cmds: [node scripts/migration/inventory.mjs --write]
  inventory:check:
    desc: Reject unreconciled source inventory drift
    cmds: [node scripts/migration/inventory.mjs]
  preservation:write:
    desc: Record relocation checksums and preserve source comments
    cmds: [node scripts/migration/preservation.mjs --write]
  preservation:check:
    desc: Check preserved source files and comments
    cmds: [node scripts/migration/preservation.mjs]
  deps:
    desc: Resolve the root Loco lockfile
    cmds: [cargo generate-lockfile]
  deps:migration:
    vars:
      ONLINE: '{{.ONLINE | default "false"}}'
    cmds: ['cargo update {{if ne .ONLINE "true"}}--offline{{end}} --package migration']
  foundation:db-up:
    requires:
      vars: [FOUNDATION_PROJECT]
    cmds: ['docker compose -f "{{.ROOT_DIR}}/compose.yaml" --env-file /dev/null -p {{.FOUNDATION_PROJECT}} up -d --wait postgres']
  foundation:db-port:
    requires:
      vars: [FOUNDATION_PROJECT]
    cmds: ['docker compose -f "{{.ROOT_DIR}}/compose.yaml" --env-file /dev/null -p {{.FOUNDATION_PROJECT}} port postgres 5432']
  foundation:db-provision:
    requires:
      vars: [FOUNDATION_PROJECT]
    cmds:
      - 'docker compose -f "{{.ROOT_DIR}}/compose.yaml" --env-file /dev/null -p {{.FOUNDATION_PROJECT}} exec -T postgres psql -X -v ON_ERROR_STOP=1 -U medtracker -d medtracker_loco -c "CREATE DATABASE medtracker_reference"'
      - 'cat "{{.ROOT_DIR}}/tests/fixtures/persistence-roles.sql" "{{.ROOT_DIR}}/migration/baseline.sql" | docker compose -f "{{.ROOT_DIR}}/compose.yaml" --env-file /dev/null -p {{.FOUNDATION_PROJECT}} exec -T postgres psql -X -v ON_ERROR_STOP=1 --single-transaction -U medtracker -d medtracker_reference'
  foundation:db-down:
    requires:
      vars: [FOUNDATION_PROJECT]
    cmds: ['docker compose -f "{{.ROOT_DIR}}/compose.yaml" --env-file /dev/null -p {{.FOUNDATION_PROJECT}} down --volumes']
  foundation:test-ci-paths:
    cmds: [node --test scripts/ci/tests/loco_paths.test.mjs]
  foundation:test-workspaces:
    cmds: [node --test scripts/migration/workspaces.test.mjs]
  dev:
    desc: Start the Loco server
    cmds:
      - task: frontend:prepare
      - 'cargo run --locked -- start {{if eq (.SERVER_AND_WORKER | default "false") "true"}}--server-and-worker{{end}} --environment {{.LOCO_ENV | default "development"}}'
  build:
    desc: Build Loco
    cmds:
      - task: frontend:prepare
      - cargo build --locked
  check:
    desc: Check Loco targets
    cmds: [cargo check --locked --all-targets]
  lint:
    desc: Lint Loco
    cmds: [cargo clippy --locked --all-targets -- -D warnings]
  lint:fix:
    desc: Apply safe Loco Clippy suggestions
    cmds: [cargo clippy --locked --all-targets --fix --allow-dirty --allow-staged -- -D warnings]
  lint:advisory:
    desc: Report selected additional Clippy findings
    cmds: [task --taskfile Taskfiles/lint-advisory.yml report]
  fmt:
    desc: Check Loco formatting
    cmds: [cargo fmt --all -- --check]
  fmt:apply:
    cmds: [cargo fmt --all]
  test:
    desc: Verify Loco and root ownership contracts
    cmds:
      - task: frontend:prepare
      - task: frontend:test
      - task: slice:test-runner
      - task: slice:test-all
      - task: foundation:test-cleanup
      - task: foundation:test-database
      - task: release:test-rehearsal
      - task: browser
  test:unit:
    desc: Run Loco library tests with an optional name filter
    cmds: ['cargo test --locked --lib {{.FILTER | default ""}} -- --test-threads=1']
  migration:audit:
    desc: Audit retained migration inputs explicitly
    cmds:
      - task: foundation:test
      - task: foundation:test-workspaces
      - task: foundation:test-relocation
      - task: foundation:test-preservation
      - task: inventory:check
      - task: preservation:check
  routes:
    desc: List Loco routes
    cmds: ['cargo run --locked -- routes --environment {{.LOCO_ENV | default "development"}}']
  db:migrate:
    desc: Adopt and migrate the configured PostgreSQL database
    requires:
      vars: [MIGRATION_DATABASE_URL]
    env:
      MEDTRACKER_MIGRATION_DATABASE_URL: '{{.MIGRATION_DATABASE_URL}}'
    cmds: ['env DATABASE_URL="$MEDTRACKER_MIGRATION_DATABASE_URL" cargo run --locked -- db migrate --environment {{.LOCO_ENV | default "development"}}']
  db:seed:
    desc: Seed an empty development or test database with synthetic fixtures
    requires:
      vars: [SEED_DATABASE_URL]
    env:
      MEDTRACKER_SEED_DATABASE_URL: '{{.SEED_DATABASE_URL}}'
    cmds: ['{{if .SEED_EXECUTABLE}}env DATABASE_URL="$MEDTRACKER_SEED_DATABASE_URL" {{.SEED_EXECUTABLE | shellQuote}} db seed --environment {{.LOCO_ENV | default "development"}}{{else}}env DATABASE_URL="$MEDTRACKER_SEED_DATABASE_URL" cargo run --locked -- db seed --environment {{.LOCO_ENV | default "development"}}{{end}}']
  worker:
    desc: Start the Loco worker process
    cmds: ['cargo run --locked -- start --worker --environment {{.LOCO_ENV | default "development"}}']
  browser:
    desc: Exercise the application through desktop and mobile browsers
    cmds:
      - task: frontend:test-browser
        vars:
          GROUP: all
  release-image:
    desc: Release runtime gate (tranche 6)
    cmds: ['fish -c ''echo "Production Loco image awaits full migration acceptance" >&2; exit 1''']
  ci:
    desc: Verify root Loco foundation
    cmds:
      - task: fmt
      - task: lint
      - task: test
  foundation:test:
    cmds: [node --test scripts/migration/foundation.test.mjs]
  foundation:test-cleanup:
    cmds: [node --test scripts/migration/process-cleanup.test.mjs]
  foundation:test-preservation:
    cmds: [node --test scripts/migration/preservation.test.mjs]
  foundation:test-relocation:
    cmds: [node --test scripts/migration/relocation.test.mjs]
  foundation:test-database:
    cmds: [node --test scripts/migration/foundation-database.test.mjs]
  default:
    desc: List all available tasks
    summary: Default task - shows all available commands
    silent: true
    cmds: [task --list]

  release:rehearse:
    desc: Rehearse Loco writes and saved-state Rails rollback on an owned database
    cmds:
      - task: build
      - task rails:test:build CONTRACT_PROJECT=mtloco-rollback-image
      - >-
        fish --no-config -c 'set -l rollback_image (docker image inspect mtloco-rollback-image-web-test | jq -er ".[0].Id");
        or exit $status;
        env RAILS_ROLLBACK_IMAGE="$rollback_image" node scripts/migration/cutover-rehearsal.mjs'
  release:test-rehearsal:
    desc: Verify saved-state rehearsal orchestration
    cmds: [node --test scripts/migration/cutover-rehearsal.test.mjs]
  release:cutover:loco-journey:
    requires:
      vars: [CUTOVER_DATABASE_URL, MEDTRACKER_OWNED_DATABASE]
    env:
      CUTOVER_DATABASE_URL: '{{.CUTOVER_DATABASE_URL}}'
      MEDTRACKER_OWNED_DATABASE: '{{.MEDTRACKER_OWNED_DATABASE}}'
    cmds: [cargo test --locked --features cutover-rehearsal --test cutover]
  rails:rollback:journey:
    requires:
      vars: [FOUNDATION_PROJECT, CARE_DATABASE_URL, RAILS_ROLLBACK_IMAGE]
    cmds:
      - >-
        fish --no-config -c 'set -l project $argv[1]; set -l endpoint $argv[2]; set -l image $argv[3];
        string match -qr "^sha256:[0-9a-f]{64}\$" -- "$image"; or exit 1;
        string match -qr "^mtloco-http-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\$" -- "$project"; or exit 1;
        string match -qr "^postgres://medtracker:medtracker_password@127[.]0[.]0[.]1:[0-9]+/medtracker_reference\$" -- "$endpoint"; or exit 1;
        docker network inspect "$project"_default |
        jq -e --arg project "$project" ".[0].Labels[\"com.docker.compose.project\"] == \$project and .[0].Labels[\"com.docker.compose.network\"] == \"default\"" > /dev/null'
        -- {{.FOUNDATION_PROJECT | shellQuote}} {{.CARE_DATABASE_URL | shellQuote}} {{.RAILS_ROLLBACK_IMAGE | shellQuote}}
      - >-
        docker run --rm --pull never
        --network {{printf "%s_default" .FOUNDATION_PROJECT | shellQuote}}
        --env RAILS_ENV=test
        --env MEDTRACKER_OWNED_DATABASE=1
        --env MEDTRACKER_REHEARSAL_RAILS_ROOT=/app
        --env DATABASE_URL=postgresql://medtracker:medtracker_password@postgres:5432/medtracker_reference
        --mount {{printf "type=bind,source=%s/scripts/migration/rails_rollback_spec.rb,target=/tmp/rails_rollback_spec.rb,readonly" .ROOT_DIR | shellQuote}}
        {{.RAILS_ROLLBACK_IMAGE | shellQuote}} bundle exec rspec /tmp/rails_rollback_spec.rb
