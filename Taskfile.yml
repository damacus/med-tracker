---
version: "3"
silent: true
run: when_changed

includes:
  host:
    taskfile: Taskfiles/host.yml
    dir: .
  dev:
    taskfile: Taskfiles/dev.yml
    dir: .
  test:
    taskfile: Taskfiles/test.yml
    dir: .
  prod:
    taskfile: Taskfiles/prod.yml
    dir: .
  db:
    taskfile: Taskfiles/database.yml
    dir: .
  frontend:
    taskfile: Taskfiles/frontend.yml
    dir: .
  rails:
    taskfile: rails/Taskfile.yml
    dir: rails
  client-tools:
    taskfile: client-tools/Taskfile.yml
    dir: client-tools
  api-clients:
    taskfile: client-tools/openapi-generator/Taskfile.yml
    dir: .
  mobile:android:
    taskfile: mobile/android/Taskfile.yml
    dir: mobile/android
    aliases: [android]
  docs:
    taskfile: docs/Taskfile.yml
    dir: .
  worktree:
    taskfile: Taskfiles/worktree.yml
    dir: .
  openspec:
    taskfile: Taskfiles/openspec.yml
    dir: .
  agents:
    taskfile: Taskfiles/agents.yml
    dir: .
    flatten: true

tasks:
  whitespace:
    desc: Check staged, unstaged and untracked files without changing staging
    cmds:
      - 'fish --no-config scripts/check_whitespace.fish {{.BASE | default "HEAD" | shellQuote}}'
  test:whitespace:
    desc: Test the local whitespace check with disposable Git repositories
    cmds: [node --test scripts/test_whitespace.mjs]
  image:check:
    desc: Detect release-image tool drift from application CI
    cmds:
      - node --test scripts/test_loco_image_tooling.mjs
      - node scripts/check_loco_image_tooling.mjs
  image:build:
    desc: Build the root Loco release image for the local architecture
    cmds:
      - task: image:check
      - 'docker build --build-arg CARGO_BUILD_JOBS={{.CARGO_BUILD_JOBS | default "2" | shellQuote}} --tag {{.LOCO_IMAGE | default "medtracker-loco:local" | shellQuote}} .'
  image:test:
    desc: Check release commands, runtime assets and non-root image ownership
    env:
      LOCO_IMAGE: '{{.LOCO_IMAGE | default "medtracker-loco:local"}}'
      LOCO_IMAGE_SUBNET: '{{.LOCO_IMAGE_SUBNET | default ""}}'
    cmds: [python3 scripts/test_loco_image.py]
  deps:
    desc: Resolve the root Loco lockfile
    cmds: [cargo generate-lockfile]
  default:
    desc: List all available tasks
    summary: Default task - shows all available commands
    silent: true
    cmds: [task --list]
  build:
    cmds: [{task: "host:build"}]
  check:
    cmds: [{task: "host:check"}]
  machete:
    cmds: [{task: "host:machete"}]
  lint:
    cmds: [{task: "host:lint"}]
  lint:fix:
    cmds: [{task: "host:lint:fix"}]
  fmt:
    cmds: [{task: "host:fmt"}]
  fmt:apply:
    cmds: [{task: "host:fmt:apply"}]
  ci:
    cmds: [{task: "host:ci"}]
  scheduler:
    cmds: [{task: "host:scheduler"}]
  routes:
    cmds: [{task: "host:routes"}]
  worker:
    cmds: [{task: "host:worker"}]
  test:scheduler:process:
    cmds: [{task: "host:test:scheduler:process"}]
  test:scheduler:image:
    cmds: [{task: "host:test:scheduler:image"}]
  foundation:db-up:
    cmds: [{task: "host:foundation:db-up"}]
  foundation:storage-init:
    cmds: [{task: "host:foundation:storage-init"}]
  foundation:db-port:
    cmds: [{task: "host:foundation:db-port"}]
  foundation:storage-up:
    cmds: [{task: "host:foundation:storage-up"}]
  foundation:storage-port:
    cmds: [{task: "host:foundation:storage-port"}]
  foundation:db-provision:
    cmds: [{task: "host:foundation:db-provision"}]
  foundation:db-down:
    cmds: [{task: "host:foundation:db-down"}]
  dev:
    cmds: [{task: "dev:up"}]
  test:
    cmds: [{task: "test:unit"}, {task: "test:integration"}, {task: "test:browser"}]
  test:tooling:
    cmds: [node --test scripts/test_compose_tasks.mjs scripts/test_invitation_mail.mjs]
