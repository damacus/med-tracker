---
version: "3"
silent: true
run: once

includes:
  rails:
    taskfile: rails/Taskfile.yml
    dir: .
  legacy-rails:
    taskfile: rails/Taskfile.yml
    dir: .
    flatten: true
  rust:
    taskfile: rust/Taskfile.yml
    dir: .
  api:
    taskfile: rust/api/Taskfile.yml
    dir: .
  contracts:
    taskfile: rust/contract-tests/Taskfile.yml
    dir: .
    aliases: [contract]
  client-tools:
    taskfile: client-tools/Taskfile.yml
    dir: client-tools
  api-clients:
    taskfile: client-tools/openapi-generator/Taskfile.yml
    dir: .
  mobile:android:
    taskfile: mobile/android/Taskfile.yml
    dir: mobile/android
    aliases: [android]
  docs:
    taskfile: docs/Taskfile.yml
    dir: .
  ci:
    taskfile: Taskfiles/ci.yml
    dir: .
  worktree:
    taskfile: Taskfiles/worktree.yml
    dir: .
  openspec:
    taskfile: Taskfiles/openspec.yml
    dir: .
  agents:
    taskfile: Taskfiles/agents.yml
    dir: .
    flatten: true

tasks:
  default:
    desc: List all available tasks
    summary: Default task - shows all available commands
    silent: true
    cmds: [task --list]
