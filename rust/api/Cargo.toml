[package]
name = "medtracker-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8.6", features = ["multipart"] }
base64 = "0.23"
bcrypt = "0.19"
aes-gcm = "0.11"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
crc32fast = "1"
ct-codecs = "1.1"
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
openssl = { version = "0.10", features = ["vendored"] }
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "rustls-tls",
] }
md-5 = "0.11"
medtracker-web = { path = "../web" }
pbkdf2 = "0.13"
printpdf = { version = "=0.12.8", default-features = false }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "form",
    "http2",
    "json",
    "rustls",
] }
scraper = "0.27"
sea-orm = { version = "=2.0.4", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-chrono",
    "with-json",
    "with-rust_decimal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
totp-rs = { version = "=6.0.0", features = ["otpauth"] }
tower = "0.5"
url = "2"
uuid = { version = "1", features = ["v4"] }
web-push = { version = "0.11", default-features = false }
zip = "8.6.0"
quick-xml = "0.42.0"
webauthn-rs-core = "=0.5.5"
serde_cbor_2 = "0.13"
oxide-auth = { version = "0.6.1", default-features = false }
cookie = { version = "0.18", features = ["private", "key-expansion"] }

[dev-dependencies]
ciborium = "0.2"
ece = "2.4"
openssl = "0.10"
p256 = { version = "0.14", features = ["ecdsa"] }

[patch.crates-io]
jwt-simple = { path = "../vendor/jwt-simple" }
