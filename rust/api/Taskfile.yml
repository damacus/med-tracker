    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
    cmds:
      - MEDTRACKER_GIT_COMMON_DIR={{ .GIT_COMMON_DIR }} docker compose -p {{ .CONTRACT_PROJECT }} --profile test run --rm --no-deps rust-api-tests cargo test --locked --no-fail-fast --manifest-path rust/contract-tests/Cargo.toml --test openapi_locations --test openapi_location_writes --test openapi_rate_limit -- --test-threads=1

  openapi-locations-acceptance:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - fish rust/contract-tests/run.fish rails openapi-locations

  contract-openapi-notifications-test:
