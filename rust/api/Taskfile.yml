        -v household_id={{ .HOUSEHOLD_ID | shellQuote }}
        -v view_membership_id={{ .VIEW_MEMBERSHIP_ID | shellQuote }}
        -v view_account_id={{ .VIEW_ACCOUNT_ID | shellQuote }}
        -v web_view_email={{ .WEB_VIEW_EMAIL | shellQuote }}
        -f - < {{ .SQL_PATH | shellQuote }}

