---
version: "3"

tasks:
  vendor-jwt-test:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - cargo test --manifest-path rust/vendor/jwt-simple/Cargo.toml --no-default-features --features pure-rust --lib

  security-contract-check:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - cargo check --manifest-path rust/contract-tests/Cargo.toml --test passkey_security

  passkey-security-acceptance:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - task api:browser-rust HOUSEHOLD_ACCEPTANCE=true HOUSEHOLD_TEST_FILE=passkey_security BROWSER_TEST_FILES=tests/login.smoke.test.mjs

  contract-recovery-inventory:
    cmds:
      - docker ps --format '{{"{{"}}.Names{{"}}"}} {{"{{"}}.Image{{"}}"}} {{"{{"}}.Ports{{"}}"}}'

  contract-engine-ping:
    cmds:
      - curl --max-time 5 --silent --show-error --unix-socket /Users/damacus/.docker/run/docker.sock http://localhost/_ping

  contract-process-diagnostics:
    cmds:
      - df -h .
      - ps -axo pid,ppid,etime,state,comm | rg 'docker|buildx|cargo|rustc|fish|task'

  contract-build-diagnostics:
    cmds:
      - docker buildx history ls
      - docker system df
      - ps -axo pid,ppid,etime,state,comm | rg 'docker|buildx|cargo|rustc|fish|task'

  clean-household-incremental:
    cmds:
      - rm -rf rust/api/target/debug/incremental rust/web/target/debug/incremental rust/ui-preview/target/debug/incremental rust/contract-tests/target/debug/incremental

  dashboard-ui-build:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - task -d rust/ui-preview build

  build:
    dir: "{{.TASKFILE_DIR}}/../.."
    deps: [dashboard-ui-build]
    cmds:
      - cargo build --manifest-path rust/api/Cargo.toml

  fmt:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - cargo fmt --manifest-path rust/api/Cargo.toml --all -- --check

  fmt:write:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - cargo fmt --manifest-path rust/api/Cargo.toml --all

  check:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - cargo check --manifest-path rust/api/Cargo.toml --all-targets

  test:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - cargo test --manifest-path rust/api/Cargo.toml {{ if .TEST_FILE }}--test {{ .TEST_FILE }}{{ end }}

  clippy:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - cargo clippy --manifest-path rust/api/Cargo.toml --all-targets -- -D warnings

  acceptance:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - fish rust/contract-tests/run.fish rails medication-read-api

  browser-rails:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - fish rust/contract-tests/run.fish rails browser-journey-rails

  browser-rust:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - >-
        env
        HOUSEHOLD_ACCEPTANCE={{ .HOUSEHOLD_ACCEPTANCE | default "" | shellQuote }}
        HOUSEHOLD_COMPLETION_ACCEPTANCE={{ .HOUSEHOLD_COMPLETION_ACCEPTANCE | default "" | shellQuote }}
        HOUSEHOLD_STOCK_ACCEPTANCE={{ .HOUSEHOLD_STOCK_ACCEPTANCE | default "" | shellQuote }}
        HOUSEHOLD_TEST_FILE={{ .HOUSEHOLD_TEST_FILE | default "" | shellQuote }}
        HOUSEHOLD_TEST_FILTER={{ .HOUSEHOLD_TEST_FILTER | default "" | shellQuote }}
        PROFILE_ACCEPTANCE={{ .PROFILE_ACCEPTANCE | default "" | shellQuote }}
        BROWSER_TEST_FILES={{ .BROWSER_TEST_FILES | default "tests/medication-journey.test.mjs tests/medication-journey-form.test.mjs" | shellQuote }}
        fish rust/contract-tests/run.fish rails browser-journey-rust

  profile-acceptance:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - mkdir -p docs/screenshots/profile-rust
      - task api:browser-rust HOUSEHOLD_ACCEPTANCE=true PROFILE_ACCEPTANCE=true BROWSER_TEST_FILES="tests/settings-timezone.test.mjs tests/profile-notifications.test.mjs tests/profile-security.test.mjs tests/profile-security-unit.test.mjs tests/profile-advanced.test.mjs"

  browser-dashboard-rust:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - fish rust/contract-tests/run.fish rails browser-dashboard-rust

  web-session-acceptance:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - fish rust/contract-tests/run.fish rails web-session-api

  web-reads-acceptance:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - fish rust/contract-tests/run.fish rails web-reads-api

  web-reads-rails:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - fish rust/contract-tests/run.fish rails web-reads-rails

  contract-runner-test:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - fish --no-config rust/contract-tests/runner_compose_test.fish

  contract-browser-context-test:
    cmds:
      - fish --no-config rust/contract-tests/browser_context_test.fish

  contract-household-selector-test:
    cmds:
      - fish --no-config rust/contract-tests/household_selector_test.fish

  contract-minor-wrapper-test:
    cmds:
      - fish --no-config rust/contract-tests/browser_minor_wrapper_test.fish

  contract-runner-lint:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - fish --no-config -n rust/contract-tests/run.fish
      - fish --no-config -n rust/contract-tests/run_complete_api.fish
      - fish --no-config -n rust/contract-tests/run_complete_lane.fish
      - fish --no-config -n rust/contract-tests/run_lookup_subset.fish
      - fish --no-config -n rust/contract-tests/runner_compose_test.fish
      - fish --no-config -n rust/contract-tests/browser_context_test.fish
      - fish --no-config -n rust/contract-tests/household_selector_test.fish
      - fish --no-config -n rust/contract-tests/fixtures/household_wrapper_probe.fish
      - fish --no-config -n rust/contract-tests/browser_minor_wrapper.fish
      - fish --no-config -n rust/contract-tests/browser_minor_wrapper_test.fish
      - fish --no-config -n rust/contract-tests/fixtures/browser_minor_fake_task.fish
      - fish --no-config -n rust/contract-tests/fixtures/browser_minor_legacy.fish
      - fish --no-config -n rust/contract-tests/test_support/rtk

  contract-harness-fmt:
    cmds:
      - rustfmt --edition 2021 --check rust/contract-tests/src/lib.rs

  contract-harness-fmt:write:
    cmds:
      - rustfmt --edition 2021 rust/contract-tests/src/lib.rs

  contract-harness-test:
    cmds:
      - cargo test --locked --manifest-path rust/contract-tests/Cargo.toml --lib

  complete-acceptance:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - fish --no-config rust/contract-tests/run_complete_api.fish

  contract-warm:
    dir: "{{.TASKFILE_DIR}}/../.."
    deps: [contract-dependencies, contract-browser-dependencies]

  contract-dependencies:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - docker build --target dependencies -f rust/contract-tests/Dockerfile .

  contract-browser-dependencies:
    dir: "{{.TASKFILE_DIR}}/../.."
    cmds:
      - docker build --target dependencies -f rust/web/Dockerfile.smoke rust/web

  contract-up:
    dir: "{{.TASKFILE_DIR}}/../.."
    deps: [dashboard-ui-build]
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
    cmds:
      - MEDTRACKER_GIT_COMMON_DIR={{ .GIT_COMMON_DIR }} docker compose -p {{ .CONTRACT_PROJECT }} --profile test up -d --wait --build rust-api

  contract-source-snapshot:
    dir: "{{.TASKFILE_DIR}}/../.."
    deps: [dashboard-ui-build]
    requires:
      vars: [CONTRACT_SOURCE_DIR]
    cmds:
      - mkdir -p '{{ .CONTRACT_SOURCE_DIR }}/rust/api' '{{ .CONTRACT_SOURCE_DIR }}/rust/web' '{{ .CONTRACT_SOURCE_DIR }}/rust/ui-preview' '{{ .CONTRACT_SOURCE_DIR }}/rust/contract-tests' '{{ .CONTRACT_SOURCE_DIR }}/config/locales' '{{ .CONTRACT_SOURCE_DIR }}/vendor/fonts' '{{ .CONTRACT_SOURCE_DIR }}/app/assets/fonts'
      - rsync -a --exclude target/ rust/api/ '{{ .CONTRACT_SOURCE_DIR }}/rust/api/'
      - rsync -a --exclude target/ rust/vendor/ '{{ .CONTRACT_SOURCE_DIR }}/rust/vendor/'
      - rsync -a --exclude target/ rust/web/ '{{ .CONTRACT_SOURCE_DIR }}/rust/web/'
      - rsync -a --exclude target/ --exclude node_modules/ rust/ui-preview/ '{{ .CONTRACT_SOURCE_DIR }}/rust/ui-preview/'
      - rsync -a --exclude target/ rust/contract-tests/ '{{ .CONTRACT_SOURCE_DIR }}/rust/contract-tests/'
      - cp config/ai_medication_sources.yml config/nhs_dmd_curated_products.yml '{{ .CONTRACT_SOURCE_DIR }}/config/'
      - cp config/locales/*.yml '{{ .CONTRACT_SOURCE_DIR }}/config/locales/'
      - cp vendor/fonts/NotoSans-Regular.ttf vendor/fonts/OFL-1.1.txt '{{ .CONTRACT_SOURCE_DIR }}/vendor/fonts/'
      - rsync -a app/assets/fonts/ '{{ .CONTRACT_SOURCE_DIR }}/app/assets/fonts/'
      - mkdir -p '{{ .CONTRACT_SOURCE_DIR }}/app/assets/tailwind' '{{ .CONTRACT_SOURCE_DIR }}/app/views/profiles'
      - cp app/assets/tailwind/application.css '{{ .CONTRACT_SOURCE_DIR }}/app/assets/tailwind/'
      - cp app/views/profiles/theme_picker_card.rb '{{ .CONTRACT_SOURCE_DIR }}/app/views/profiles/'

  contract-external-up:
    dir: "{{.TASKFILE_DIR}}/../.."
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
    cmds:
      - MEDTRACKER_GIT_COMMON_DIR={{ .GIT_COMMON_DIR }} docker compose -p {{ .CONTRACT_PROJECT }} --profile test up -d --wait --no-build rust-api-ai-openai rust-api-ai-openrouter rust-api-ai-anthropic rust-api-ai-gemini

  contract-compose-validate:
    dir: "{{.TASKFILE_DIR}}/../.."
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
    cmds:
      - MEDTRACKER_GIT_COMMON_DIR={{ .GIT_COMMON_DIR }} docker compose -p {{ .CONTRACT_PROJECT }} --profile test config --quiet

  contract-ready:
    dir: "{{.TASKFILE_DIR}}/../.."
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
    cmds:
      - MEDTRACKER_GIT_COMMON_DIR={{ .GIT_COMMON_DIR }} docker compose -p {{ .CONTRACT_PROJECT }} --profile test exec -T rust-api curl --fail --silent --show-error http://127.0.0.1:39998/up

  contract-test:
    dir: "{{.TASKFILE_DIR}}/../.."
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
    cmds:
      - MEDTRACKER_GIT_COMMON_DIR={{ .GIT_COMMON_DIR }} docker compose -p {{ .CONTRACT_PROJECT }} --profile test run --rm --no-deps rust-api-tests fish rust/contract-tests/run_medication_api_tests.fish

  contract-image-remove:
    dir: "{{.TASKFILE_DIR}}/../.."
    requires:
      vars: [CONTRACT_PROJECT]
    cmds:
      - fish rust/contract-tests/remove_image.fish {{ .CONTRACT_PROJECT }}

  contract-web-session-test:
    dir: "{{.TASKFILE_DIR}}/../.."
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
    cmds:
      - MEDTRACKER_GIT_COMMON_DIR={{ .GIT_COMMON_DIR }} docker compose -p {{ .CONTRACT_PROJECT }} --profile test run --rm --no-deps rust-api-tests cargo test --locked --manifest-path rust/contract-tests/Cargo.toml --test web_session_api -- --test-threads=1

  contract-web-reads-test:
