---
version: "3"

tasks:
  dashboard-ui-build:
    cmds:
      - task -d rust/ui-preview build

  build:
    deps: [dashboard-ui-build]
    cmds:
      - cargo build --manifest-path rust/api/Cargo.toml

  fmt:
    cmds:
      - cargo fmt --manifest-path rust/api/Cargo.toml --all -- --check

  fmt:write:
    cmds:
      - cargo fmt --manifest-path rust/api/Cargo.toml --all

  check:
    cmds:
      - cargo check --manifest-path rust/api/Cargo.toml --all-targets

  test:
    cmds:
      - cargo test --manifest-path rust/api/Cargo.toml

  clippy:
    cmds:
      - cargo clippy --manifest-path rust/api/Cargo.toml --all-targets -- -D warnings

  acceptance:
    cmds:
      - fish rust/contract-tests/run.fish rails medication-read-api

  browser-rails:
    cmds:
      - fish rust/contract-tests/run.fish rails browser-journey-rails

  browser-rust:
    cmds:
      - fish rust/contract-tests/run.fish rails browser-journey-rust

  browser-dashboard-rust:
    cmds:
      - fish rust/contract-tests/run.fish rails browser-dashboard-rust

  web-session-acceptance:
    cmds:
      - fish rust/contract-tests/run.fish rails web-session-api

  web-reads-acceptance:
    cmds:
      - fish rust/contract-tests/run.fish rails web-reads-api

  web-reads-rails:
    cmds:
      - fish rust/contract-tests/run.fish rails web-reads-rails

  contract-runner-test:
    cmds:
      - fish --no-config rust/contract-tests/runner_compose_test.fish

  contract-runner-lint:
    cmds:
      - fish --no-config -n rust/contract-tests/run.fish
      - fish --no-config -n rust/contract-tests/run_complete_api.fish
      - fish --no-config -n rust/contract-tests/run_complete_lane.fish
      - fish --no-config -n rust/contract-tests/run_lookup_subset.fish
      - fish --no-config -n rust/contract-tests/runner_compose_test.fish
      - fish --no-config -n rust/contract-tests/test_support/rtk

  complete-acceptance:
    cmds:
      - fish --no-config rust/contract-tests/run_complete_api.fish

  contract-warm:
    deps: [contract-dependencies, contract-browser-dependencies]

  contract-dependencies:
    cmds:
      - docker build --target dependencies -f rust/contract-tests/Dockerfile .

  contract-browser-dependencies:
    cmds:
      - docker build --target dependencies -f rust/web/Dockerfile.smoke rust/web

  contract-up:
    deps: [dashboard-ui-build]
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
    cmds:
      - MEDTRACKER_GIT_COMMON_DIR={{ .GIT_COMMON_DIR }} docker compose -p {{ .CONTRACT_PROJECT }} --profile test up -d --wait --build rust-api

  contract-source-snapshot:
    deps: [dashboard-ui-build]
    requires:
      vars: [CONTRACT_SOURCE_DIR]
    cmds:
      - mkdir -p '{{ .CONTRACT_SOURCE_DIR }}/rust/api' '{{ .CONTRACT_SOURCE_DIR }}/rust/web' '{{ .CONTRACT_SOURCE_DIR }}/rust/ui-preview' '{{ .CONTRACT_SOURCE_DIR }}/rust/contract-tests' '{{ .CONTRACT_SOURCE_DIR }}/config' '{{ .CONTRACT_SOURCE_DIR }}/vendor/fonts'
      - rsync -a --exclude target/ rust/api/ '{{ .CONTRACT_SOURCE_DIR }}/rust/api/'
      - rsync -a --exclude target/ rust/web/ '{{ .CONTRACT_SOURCE_DIR }}/rust/web/'
      - rsync -a --exclude target/ --exclude node_modules/ rust/ui-preview/ '{{ .CONTRACT_SOURCE_DIR }}/rust/ui-preview/'
      - rsync -a --exclude target/ rust/contract-tests/ '{{ .CONTRACT_SOURCE_DIR }}/rust/contract-tests/'
      - cp config/ai_medication_sources.yml config/nhs_dmd_curated_products.yml '{{ .CONTRACT_SOURCE_DIR }}/config/'
      - cp vendor/fonts/NotoSans-Regular.ttf vendor/fonts/OFL-1.1.txt '{{ .CONTRACT_SOURCE_DIR }}/vendor/fonts/'

  contract-external-up:
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
    cmds:
      - MEDTRACKER_GIT_COMMON_DIR={{ .GIT_COMMON_DIR }} docker compose -p {{ .CONTRACT_PROJECT }} --profile test up -d --wait --no-build rust-api-ai-openai rust-api-ai-openrouter rust-api-ai-anthropic rust-api-ai-gemini

  contract-compose-validate:
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
    cmds:
      - MEDTRACKER_GIT_COMMON_DIR={{ .GIT_COMMON_DIR }} docker compose -p {{ .CONTRACT_PROJECT }} --profile test config --quiet

  contract-ready:
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
    cmds:
      - MEDTRACKER_GIT_COMMON_DIR={{ .GIT_COMMON_DIR }} docker compose -p {{ .CONTRACT_PROJECT }} --profile test exec -T rust-api curl --fail --silent --show-error http://127.0.0.1:39998/up

  contract-test:
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
    cmds:
      - MEDTRACKER_GIT_COMMON_DIR={{ .GIT_COMMON_DIR }} docker compose -p {{ .CONTRACT_PROJECT }} --profile test run --rm --no-deps rust-api-tests fish rust/contract-tests/run_medication_api_tests.fish

  contract-image-remove:
    requires:
      vars: [CONTRACT_PROJECT]
    cmds:
      - fish rust/contract-tests/remove_image.fish {{ .CONTRACT_PROJECT }}

  contract-web-session-test:
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
