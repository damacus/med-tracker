---
version: "3"

tasks:
  build:
    cmds:
      - cargo build --manifest-path rust/api/Cargo.toml

  fmt:
    cmds:
      - cargo fmt --manifest-path rust/api/Cargo.toml --all -- --check

  fmt:write:
    cmds:
      - cargo fmt --manifest-path rust/api/Cargo.toml --all

  check:
    cmds:
      - cargo check --manifest-path rust/api/Cargo.toml --all-targets

  test:
    cmds:
      - cargo test --manifest-path rust/api/Cargo.toml

  clippy:
    cmds:
      - cargo clippy --manifest-path rust/api/Cargo.toml --all-targets -- -D warnings

  acceptance:
    cmds:
      - fish rust/contract-tests/run.fish rails medication-read-api

  browser-rails:
    cmds:
      - fish rust/contract-tests/run.fish rails browser-journey-rails

  browser-rust:
    cmds:
      - fish rust/contract-tests/run.fish rails browser-journey-rust

  web-session-acceptance:
    cmds:
      - fish rust/contract-tests/run.fish rails web-session-api

  web-reads-acceptance:
    cmds:
      - fish rust/contract-tests/run.fish rails web-reads-api

  web-reads-rails:
    cmds:
      - fish rust/contract-tests/run.fish rails web-reads-rails

  contract-runner-test:
    cmds:
      - fish --no-config rust/contract-tests/runner_compose_test.fish

  contract-runner-lint:
    cmds:
      - fish --no-config -n rust/contract-tests/run.fish
      - fish --no-config -n rust/contract-tests/runner_compose_test.fish
      - fish --no-config -n rust/contract-tests/test_support/rtk

  contract-warm:
    deps: [contract-dependencies, contract-browser-dependencies]

  contract-dependencies:
    cmds:
      - docker build --target dependencies -f rust/contract-tests/Dockerfile .

  contract-browser-dependencies:
    cmds:
      - docker build --target dependencies -f rust/web/Dockerfile.smoke rust/web

  contract-up:
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
    cmds:
      - MEDTRACKER_GIT_COMMON_DIR={{ .GIT_COMMON_DIR }} docker compose -p {{ .CONTRACT_PROJECT }} --profile test up -d --wait --build rust-api

  contract-ready:
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
    cmds:
      - MEDTRACKER_GIT_COMMON_DIR={{ .GIT_COMMON_DIR }} docker compose -p {{ .CONTRACT_PROJECT }} --profile test exec -T rust-api curl --fail --silent --show-error http://127.0.0.1:39998/up

  contract-test:
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
    cmds:
      - MEDTRACKER_GIT_COMMON_DIR={{ .GIT_COMMON_DIR }} docker compose -p {{ .CONTRACT_PROJECT }} --profile test run --rm --no-deps rust-api-tests fish rust/contract-tests/run_medication_api_tests.fish

  contract-image-remove:
    requires:
      vars: [CONTRACT_PROJECT]
    cmds:
      - fish rust/contract-tests/remove_image.fish {{ .CONTRACT_PROJECT }}

  contract-web-session-test:
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
    cmds:
      - MEDTRACKER_GIT_COMMON_DIR={{ .GIT_COMMON_DIR }} docker compose -p {{ .CONTRACT_PROJECT }} --profile test run --rm --no-deps rust-api-tests cargo test --locked --manifest-path rust/contract-tests/Cargo.toml --test web_session_api -- --test-threads=1

  contract-web-reads-test:
    requires:
      vars: [CONTRACT_PROJECT]
    vars:
      GIT_COMMON_DIR:
        sh: git rev-parse --path-format=absolute --git-common-dir
