[package]
name = "portable-ui-hydrated-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
damacus-web-ui = { path = "../..", default-features = false, features = ["hydrate"] }
leptos = { version = "=0.8.21", default-features = false, features = ["hydrate"] }
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }
