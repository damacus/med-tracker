[package]
name = "damacus-web-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "Unstyled Leptos controls and native browser interactions for Rust web applications"
publish = false
include = ["src/**", "tests/semantics.rs", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md"]

[features]
default = ["ssr"]
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate"]

[dependencies]
leptos = { version = "=0.8.21", default-features = false }
