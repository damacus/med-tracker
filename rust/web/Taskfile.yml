version: '3'

tasks:
  deps:
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - npm ci --offline

  fmt:
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - fish ../build/run.fish cargo fmt --check
  format:
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - fish ../build/run.fish cargo fmt
  lint:
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - fish ../build/run.fish cargo clippy --locked --all-targets -- -D warnings
  test:
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - fish ../build/run.fish cargo test --locked {{ if .TEST_FILE }}--test {{ .TEST_FILE }}{{ end }}
  test:dashboard:
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - fish ../build/run.fish cargo test --locked --test dashboard_rendering
  test:browser-dashboard:
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - LEPTODON_SCREENSHOT_DIR=../../docs/screenshots node --test tests/leptodon-dashboard.test.mjs
  smoke:
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - npm run smoke
  serve:
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - fish ../build/run.fish cargo run
