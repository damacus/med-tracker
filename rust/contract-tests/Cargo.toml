[package]
name = "medtracker-contract-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
lopdf = { version = "0.40", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "cookies", "form", "json", "rustls"] }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
