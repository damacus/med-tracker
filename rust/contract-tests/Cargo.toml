[package]
name = "medtracker-contract-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.23.1"
lopdf = { version = "0.45.0", default-features = false }
postgres = "0.19.14"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "cookies", "form", "json", "multipart", "rustls"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
