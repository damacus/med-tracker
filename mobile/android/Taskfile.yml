---
version: "3"

tasks:
  jvm:check:
    desc: Verify Gradle runs on the pinned JDK 17 daemon
    cmds:
      - fish --no-config ./scripts/check-jdk.fish

  test:
    desc: Run protocol, phone, and Wear unit tests
    cmds:
      - ./gradlew :wear-protocol:test :phone:testDebugUnitTest :wear:testDebugUnitTest --no-daemon

  projects:
    desc: List Android Gradle modules
    cmds:
      - ./gradlew projects --no-daemon

  phone:test:
    desc: Run phone unit tests
    cmds:
      - ./gradlew :phone:testDebugUnitTest {{.CLI_ARGS}} --no-daemon

  integration:canary:
    desc: Run the opt-in live canary integration test
    cmds:
      - fish --no-config ./scripts/canary-integration.fish

  lint:
    desc: Run phone and Wear lint
    cmds:
      - ./gradlew :phone:lint :wear:lint --no-daemon

  assemble:
    desc: Assemble phone and Wear debug, staging, and release APKs
    cmds:
      - ./gradlew :phone:assembleDebug :phone:assembleStaging :phone:assembleRelease :wear:assembleDebug :wear:assembleStaging :wear:assembleRelease --no-daemon --stacktrace

  wear:boundary:
    desc: Verify Wear source, runtime dependencies, and packaged permission boundaries
    cmds:
      - fish --no-config ./scripts/verify-wear-boundary.fish
      - ./gradlew :wear:verifyCompanionDependencies --no-daemon

  wear:smoke:
    desc: Verify persistent signed-out connectivity on an explicitly selected emulator pair
    env:
      PHONE_SERIAL: '{{ .PHONE_SERIAL | default "" }}'
      WATCH_SERIAL: '{{ .WATCH_SERIAL | default "" }}'
    cmds:
      - fish --no-config ./scripts/wear-smoke.fish

  release:check:
    desc: Verify the release APK excludes staging authentication UI
    cmds:
      - fish --no-config ./scripts/verify-release-security.fish

  release:validate:
    desc: Validate explicit Android release server and OIDC configuration
    cmds:
      - fish --no-config ./scripts/validate-release-config.fish

  package:release:
    desc: Build a release APK with explicit validated server and OIDC configuration
    cmds:
      - fish --no-config ./scripts/package-release.fish

  api:check:
    desc: Verify the pinned Android OpenAPI client has no drift
    cmds:
      - ./scripts/api-check.fish

  api:update:
    desc: Update the pinned Android OpenAPI client from the root contract
    cmds:
      - ./scripts/api-update.fish
      - task: api:check

  ci:
    desc: Run phone, Wear and protocol checks plus release, boundary and API verification
    cmds:
      - task: jvm:check
      - task: test
      - task: lint
      - task: assemble
      - task: release:check
      - task: wear:boundary
      - task: api:check
