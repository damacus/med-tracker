default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: notifications
      fibers: <%= ENV.fetch("JOB_FIBERS", 2) %>
      polling_interval: 0.1
    - queues: default
      threads: 1
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
