services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: medtracker
      POSTGRES_PASSWORD: medtracker_password
      POSTGRES_DB: medtracker_loco
    ports:
      - target: 5432
        host_ip: 127.0.0.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medtracker -d medtracker_loco"]
      interval: 2s
      timeout: 2s
      retries: 30
  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.90
    profiles: [fixture-storage]
    environment:
      RUSTFS_ACCESS_KEY: storage-smoke-access
      RUSTFS_SECRET_KEY: storage-smoke-secret
      RUSTFS_VOLUMES: /data
    command: [/data]
    ports:
      - target: 9000
        host_ip: 127.0.0.1
    volumes:
      - rustfs-fixture:/data
volumes:
  rustfs-fixture:
