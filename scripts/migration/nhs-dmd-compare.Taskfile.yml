version: '3'

tasks:
  check:
    dir: ../..
    cmds:
      - node --check scripts/migration/nhs-dmd-release-compare.mjs
      - ruby -c scripts/migration/nhs-dmd-reference-snapshot.rb
      - mise exec ruby -- ruby -S rubocop --config rails/.rubocop.yml --cache false --except Naming/FileName,Rails/SquishedSQLHeredocs scripts/migration/nhs-dmd-reference-snapshot.rb
  test:
    dir: ../..
    cmds:
      - node --test scripts/migration/nhs-dmd-reference-bootstrap.test.mjs
      - node --test scripts/migration/nhs-dmd-benchmark-monitor.test.mjs
  benchmark:
    dir: ../..
    env:
      NHS_DMD_BENCHMARK: '1'
    cmds:
      - node scripts/migration/nhs-dmd-release-compare.mjs
  compare:
    dir: ../..
    cmds:
      - node scripts/migration/nhs-dmd-release-compare.mjs
