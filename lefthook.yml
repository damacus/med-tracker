---
pre-push:
  parallel: true
  jobs:
    - name: protect-main
      run: |
        current_branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$current_branch" = "main" ]; then
          echo "❌ Direct pushes to main are not allowed. Use a feature branch and PR."
          exit 1
        fi

    - name: gems audit
      tags:
        - backend
        - security
      run: task rails:gems:audit

    - name: rubocop
      tags:
        - backend
        - linting
      glob: "rails/**/*.rb"
      run: task rails:rubocop

    - name: rspec
      tags:
        - backend
        - testing
      glob: "rails/**/*.rb"
      run: |
        echo "🧪 Running RSpec tests..."
        if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
          task rails:test
        else
          echo "⚠️  Docker not available, skipping RSpec tests"
          echo "Please start Docker daemon to run full test suite"
        fi

pre-commit:
  parallel: true
  jobs:
    - name: translator
      glob:
        - "rails/config/locales/**/*.yml"
        - "rails/app/components/ruby_ui/typography/**/*.rb"
      run: task translator:hook

    - name: rubocop
      glob: "rails/**/*.rb"
      exclude:
        - rails/config/application.rb
        - rails/config/routes.rb
      run: task rails:rubocop
