<article class="dashboard-prn-card card card-sm card-border bg-base-100" data-dashboard-task data-row-id="{{ row.id }}"><div class="card-body gap-1">
  <div class="dashboard-row-content min-w-0"><h3 class="card-title text-base leading-snug">{{ row.medication }}</h3><p class="text-sm">{{ row.dose }}</p></div>
  {% include "dashboard/identity.html" %}
  <div class="dashboard-row-footer card-actions items-center gap-2">{% if row.outcome != 'taken' %}<span class="dashboard-status badge badge-outline text-xs">{{ row.status_label }}</span>{% endif %}{% include "dashboard/actions.html" %}</div>
</div></article>
