<div class="dashboard-identity avatar avatar-placeholder" role="img" aria-label="{{ row.person_name }}" title="{{ row.person_name }}"><div class="relative size-8 items-center justify-center overflow-hidden rounded-full bg-base-300 text-xs font-semibold"><span aria-hidden="true">{{ row.initials }}</span>{% if row.avatar %}<img class="absolute inset-0 size-full object-cover" src="/households/{{ slug }}/people/{{ row.person_id }}/avatar" alt="" aria-hidden="true" data-avatar-image>{% elif row.gravatar_url %}<img class="absolute inset-0 size-full object-cover" src="{{ row.gravatar_url }}" alt="" aria-hidden="true" referrerpolicy="no-referrer" data-avatar-image>{% endif %}</div></div>
