<div class="flex items-center gap-3 min-w-0">
  <span class="dashboard-avatar h-10 w-10 shrink-0" aria-hidden="true">{{ row.initials }}{% if row.avatar %}<img src="/households/{{ slug }}/people/{{ row.person_id }}/avatar" alt="" data-avatar-image>{% elif row.gravatar_url %}<img src="{{ row.gravatar_url }}" alt="" referrerpolicy="no-referrer" data-avatar-image>{% endif %}</span>
  <a class="font-bold truncate" href="{{ row.person_url }}">{{ row.person_name }}</a>
</div>
