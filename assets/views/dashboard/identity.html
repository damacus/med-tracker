<div class="dashboard-identity">
  <span class="dashboard-avatar" aria-hidden="true">{{ row.initials }}{% if row.avatar %}<img src="/households/{{ slug }}/people/{{ row.person_id }}/avatar" alt="" data-avatar-image>{% elif row.gravatar_url %}<img src="{{ row.gravatar_url }}" alt="" referrerpolicy="no-referrer" data-avatar-image>{% endif %}</span>
  <a href="{{ row.person_url }}">{{ row.person_name }}</a>
</div>
