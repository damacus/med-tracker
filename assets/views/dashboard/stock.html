<section aria-labelledby="dashboard-stock-title"><h2 id="dashboard-stock-title" class="dashboard-section-title">{{ labels.dashboard.inventory.title }}</h2><div class="dashboard-panel dashboard-stock">
  <ul role="list">{% for medicine in dashboard.inventory %}{% if loop.index <= 3 %}<li><a href="/households/{{ slug }}/medications/{{ medicine.id }}">{{ medicine.name }}</a><span class="dashboard-supporting">{{ medicine.supply }}</span><progress class="progress {% if medicine.low %}progress-error{% else %}progress-primary{% endif %}" value="{{ medicine.percentage }}" max="100" aria-label="{{ medicine.name }}: {{ medicine.supply }}"></progress></li>{% endif %}{% endfor %}</ul>
  <a class="btn btn-outline rounded-full" href="/households/{{ slug }}/medications">{{ labels.layouts.mobile_rail.inventory }}</a>
</div></section>
