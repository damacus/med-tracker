{% extends "layouts/base.html" %}
{% block content %}
<section class="max-w-xl mx-auto card bg-base-100 border border-base-300"><div class="card-body">
  <h1 class="text-3xl font-semibold">{{ invitation_labels.recovery_title }}</h1>
  <p role="alert">{{ invitation_labels.recovery_guidance }}</p>
  <form method="post" action="/invitations/accept">
    <input type="hidden" name="authenticity_token" value="{{ authenticity_token }}">
    <input type="hidden" name="token" value="{{ invitation_token }}">
    {% if explicit_language %}<input type="hidden" name="lang" value="{{ lang }}">{% endif %}
    <button class="btn btn-neutral" type="submit">{{ invitation_labels.retry }}</button>
  </form>
  <a class="link" href="/households/choose">{{ invitation_labels.choose_household }}</a>
  <a class="link" href="/">{{ invitation_labels.back }}</a>
</div></section>
{% endblock content %}
