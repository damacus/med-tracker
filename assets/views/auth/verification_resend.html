{% extends "layouts/base.html" %}
{% block content %}
<section class="card shell-card max-w-lg mx-auto"><div class="card-body">
  <h1 class="text-3xl font-semibold">Resend Verification Email</h1>
  {% if error %}<p role="alert" class="shell-error">{{ error }}</p>{% endif %}
  <form method="post" action="/verify-account-resend" class="grid gap-4 mt-4">
    <input type="hidden" name="authenticity_token" value="{{ authenticity_token }}">
    <label class="grid gap-2" for="email">Email address<input class="input shell-input w-full" id="email" name="email" type="email" autocomplete="email" maxlength="320" required></label>
    <button class="btn shell-primary" type="submit">Resend verification email</button>
  </form>
  <a class="link mt-4" href="/login">Back to sign in</a>
</div></section>
{% endblock content %}
