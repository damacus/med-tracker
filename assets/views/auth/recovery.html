{% extends "layouts/base.html" %}
{% block content %}
<section class="max-w-md mx-auto">
  <div class="card shell-card"><div class="card-body gap-6">
    <div>
      <h1 class="text-3xl font-semibold">Use a recovery code</h1>
      <p class="mt-3">Enter one of your saved recovery codes. Each code can be used once.</p>
    </div>
    {% if error %}<p id="recovery-error" role="alert" class="rounded-lg border border-error p-3">{{ error }}</p>{% endif %}
    <form method="post" action="/recovery-auth" data-recovery-form class="flex flex-col gap-4">
      <input type="hidden" name="authenticity_token" value="{{ authenticity_token }}">
      <label for="recovery-code" class="font-semibold">Recovery Code</label>
      <input id="recovery-code" name="recovery-code" class="input input-bordered w-full" autocomplete="one-time-code" required {% if error %}aria-invalid="true" aria-describedby="recovery-error"{% endif %}>
      <button type="submit" class="btn btn-neutral">Authenticate via Recovery Code</button>
      {% if otp_available %}<a href="/otp-auth" class="link">Use an authentication code</a>{% endif %}
      <a href="/login" class="link">Back to sign in</a>
    </form>
  </div></div>
</section>
{% endblock content %}
