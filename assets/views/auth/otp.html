{% extends "layouts/base.html" %}
{% block content %}
<section class="max-w-md mx-auto">
  <div class="card shell-card"><div class="card-body gap-6">
    <div>
      <h1 class="text-3xl font-semibold">Verify your identity</h1>
      <p class="mt-3">Enter the six-digit code from your authenticator app.</p>
    </div>
    {% if error %}<p id="otp-error" role="alert" class="rounded-lg border border-error p-3">{{ error }}</p>{% endif %}
    <form method="post" action="/otp-auth" data-otp-form class="flex flex-col gap-4">
      <input type="hidden" name="authenticity_token" value="{{ authenticity_token }}">
      <label for="otp" class="font-semibold">Authentication code</label>
      <input id="otp" name="otp" class="input input-bordered w-full" inputmode="numeric" autocomplete="one-time-code" required maxlength="32" {% if error %}aria-invalid="true" aria-describedby="otp-error"{% endif %}>
      <button type="submit" class="btn btn-neutral">Verify</button>
      <a href="/login" class="link">Back to sign in</a>
    </form>
  </div></div>
</section>
{% endblock content %}
