<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
@page { size: A4; margin: 18mm 16mm 20mm; @bottom-right { content: {{ page_counter_css | safe }}; color: #5B6864; font-size: 8pt; } }
* { box-sizing: border-box; }
body { margin: 0; color: #17211F; background: #FFFFFF; font-family: sans-serif; font-size: 10pt; line-height: 1.5; }
.report-header { margin: 0 -16mm 10mm; padding: 12mm 16mm 10mm; background: #174A46; color: #FFFFFF; }
.report-brand { font-size: 8pt; font-weight: 700; letter-spacing: 0.14em; }
.report-header h1 { margin: 3mm 0 2mm; font-size: 18pt; line-height: 1.15; }
.report-context, .report-generated { margin: 0; color: #DDEBE7; }
.report-generated { font-size: 8pt; }
section { margin: 0 0 7mm; break-inside: avoid; page-break-inside: avoid; }
h2, h3 { color: #174A46; break-after: avoid; page-break-after: avoid; }
h2 { margin: 0 0 3mm; font-size: 15pt; }
h3 { margin: 0 0 2mm; font-size: 11pt; }
p, li { widows: 3; orphans: 3; }
.callout { margin: 4mm 0; padding: 4mm; border: 0.4mm solid #174A46; background: #DDEBE7; }
.empty-state { margin: 12mm 0; padding: 8mm; border: 0.3mm solid #D7DEDB; background: #F7F9F8; color: #5B6864; text-align: center; }
.pdf-appendix { break-before: page; page-break-before: always; }
.report-summary { display: table; width: 100%; background: #F7F9F8; }
.summary-item { display: table-cell; width: 33%; padding: 4mm; text-align: center; }
.summary-item strong, .summary-item span { display: block; }
.summary-item strong { color: #174A46; font-size: 16pt; }
.summary-item span, .review-status { color: #5B6864; font-size: 8pt; text-transform: uppercase; }
.review-prompt { padding: 4mm; border: 0.3mm solid #D7DEDB; }
.review-person { margin: 0 0 2mm; color: #174A46; font-weight: 700; }
.risk-high { color: #B94B43; }
.risk-moderate { color: #B27718; }
.risk-low { color: #4E725A; }
.risk-unknown { color: #6B7280; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 4mm 0; }
thead { display: table-header-group; background: #F7F9F8; color: #174A46; }
tr { break-inside: avoid; page-break-inside: avoid; }
th, td { padding: 2.5mm; border: 0.3mm solid #D7DEDB; overflow-wrap: anywhere; text-align: left; vertical-align: top; }
th { font-size: 8pt; letter-spacing: 0.04em; text-transform: uppercase; }
</style>
</head>
<body>
<header class="report-header">
<p class="report-brand">MEDTRACKER</p>
<h1>{{ title }}</h1>
<p class="report-context">{% block context %}{% endblock context %}</p>
<p class="report-generated">{{ report.generated_label | default(value=report.generated_at) }}</p>
</header>
<main>{% block content %}{% endblock content %}</main>
</body>
</html>
