<!doctype html>
<html lang="en-GB" data-theme="neutral-light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Return to application | MedTracker</title>
    <link rel="stylesheet" href="/static/css/compiled.css">
    <script src="/static/js/oauth-response.js" defer></script>
  </head>
  <body>
    <main class="max-w-xl mx-auto p-6">
      <h1 class="text-2xl font-semibold">Return to application</h1>
      <p class="mt-4">If you are not redirected, select Continue.</p>
      <form id="oauth-response-form" method="post" action="{{ callback }}" class="mt-6">
        {% for field in fields %}<input type="hidden" name="{{ field.name }}" value="{{ field.value }}">{% endfor %}
        <button type="submit" class="btn btn-neutral">Continue</button>
      </form>
    </main>
  </body>
</html>
