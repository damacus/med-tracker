{% extends "layouts/base.html" %}
{% block content %}
<section class="max-w-3xl mx-auto">
  <a class="link" href="/households/{{ slug }}/admin/carer_relationships">Carer Relationships</a>
  <h1 class="text-3xl font-semibold mt-4">New Relationship</h1>
  <div class="mt-6">{% include "components/form_errors.html" %}</div>
  <div class="card bg-base-100 border border-base-300 mt-6"><div class="card-body">
    <form id="administration-form" action="/households/{{ slug }}/admin/carer_relationships" method="post" class="flex flex-col gap-4">
      <input type="hidden" name="authenticity_token" value="{{ authenticity_token }}">
      <label for="carer_id" class="font-semibold">Carer</label>
      <select id="carer_id" name="carer_id" class="select w-full" required {% if carer_id_invalid %}aria-invalid="true" aria-describedby="form-error-carer_id"{% endif %}>
        <option value="">Choose a carer</option>
        {% for carer in carers %}<option value="{{ carer.id }}" {% if carer.selected %}selected{% endif %}>{{ carer.name }}</option>{% endfor %}
      </select>
      <label for="patient_id" class="font-semibold">Patient</label>
      <select id="patient_id" name="patient_id" class="select w-full" required {% if patient_id_invalid %}aria-invalid="true" aria-describedby="form-error-patient_id"{% endif %}>
        <option value="">Choose a patient</option>
        {% for patient in patients %}<option value="{{ patient.id }}" {% if patient.selected %}selected{% endif %}>{{ patient.name }}</option>{% endfor %}
      </select>
      <label for="relationship_type" class="font-semibold">Relationship type</label>
      <select id="relationship_type" name="relationship_type" class="select w-full" {% if relationship_type_invalid %}aria-invalid="true" aria-describedby="form-error-relationship_type"{% endif %}>
        <option value="" {% if draft.relationship_type == "" %}selected{% endif %}>Choose a relationship type</option>
        {% for kind in relationship_types %}<option value="{{ kind }}" {% if draft.relationship_type == kind %}selected{% endif %}>{{ kind | replace(from="_", to=" ") | capitalize }}</option>{% endfor %}
      </select>
      <div class="flex flex-col sm:flex-row gap-3 mt-4"><button class="btn btn-neutral" type="submit">Create Relationship</button><a class="btn btn-ghost" href="/households/{{ slug }}/admin/carer_relationships">Cancel</a></div>
    </form>
  </div></div>
</section>
{% endblock content %}
