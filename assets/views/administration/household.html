{% extends "layouts/base.html" %}
{% block content %}
<section class="max-w-3xl mx-auto">
  <a class="link" href="/households/{{ slug }}/admin">Administration</a>
  <h1 class="text-3xl font-semibold mt-4">Household Settings</h1>
  <div class="mt-6">{% include "components/form_errors.html" %}</div>
  <div class="card bg-base-100 border border-base-300 mt-6"><div class="card-body">
    <form id="administration-form" action="/households/{{ slug }}/admin/household" method="post" class="flex flex-col gap-4">
      <input type="hidden" name="authenticity_token" value="{{ authenticity_token }}">
      <label for="name" class="font-semibold">Household name</label>
      <input id="name" name="name" class="input w-full" value="{{ draft.name }}" required {% if name_invalid %}aria-invalid="true" aria-describedby="form-error-name"{% endif %}>
      <div class="flex flex-col sm:flex-row gap-3 mt-4">
        <button class="btn btn-neutral" type="submit">Save household</button>
        <a class="btn btn-ghost" href="/households/{{ slug }}/admin">Cancel</a>
      </div>
    </form>
  </div></div>
</section>
{% endblock content %}
