{% extends "layouts/base.html" %}
{% block content %}
<section class="max-w-2xl">
  <a class="link" href="/">Back to your households</a>
  <h1 class="text-3xl font-semibold mt-4">Create household</h1>
  <p class="mt-3">Create a household for your care. You will be its owner.</p>
  <div class="card shell-card mt-6"><div class="card-body">
    {% if invalid %}<p id="household-errors" role="alert">Enter a household name and choose a valid time zone.</p>{% endif %}
    <form method="post" action="/households" class="flex flex-col gap-4" {% if invalid %}aria-describedby="household-errors"{% endif %}>
      <input type="hidden" name="authenticity_token" value="{{ authenticity_token }}">
      <label class="font-semibold" for="household-name">Household name</label>
      <input class="input w-full" id="household-name" name="name" value="{{ name }}" required>
      <label class="font-semibold" for="household-timezone">Time zone</label>
      <select class="select w-full" id="household-timezone" name="timezone" required>
        {% for zone in timezones %}<option value="{{ zone }}" {% if zone == timezone %}selected{% endif %}>{{ zone }}</option>{% endfor %}
      </select>
      <button class="btn btn-neutral" type="submit">Create household</button>
    </form>
  </div></div>
</section>
{% endblock content %}
