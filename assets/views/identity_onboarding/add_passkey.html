{% extends "layouts/base.html" %}
{% block content %}
<section class="max-w-xl mx-auto card shell-card"><div class="card-body gap-4">
  <h1 class="text-3xl font-semibold">Add passkey</h1>
  <p>Register this passkey within five minutes of confirming your identity.</p>
  <p role="alert" tabindex="-1" data-registration-error hidden></p>
  <form data-add-passkey data-operation="{{ operation_id }}" class="space-y-4">
    <label class="form-control" for="passkey-name">Passkey name<input id="passkey-name" name="name" class="input input-bordered" maxlength="100" required></label>
    <button type="submit" class="btn shell-primary">Register Passkey</button>
  </form>
</div></section>
<script src="/static/js/add-passkey.js" defer></script>
{% endblock content %}
