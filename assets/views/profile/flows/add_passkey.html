{% include "identity_onboarding/security_labels.html" %}
<section class="max-w-xl mx-auto card shell-card"><div class="card-body gap-4">
  <h1 class="text-3xl font-semibold">{{ flow.add_passkey }}</h1>
  <p>{{ flow.passkey_hint }}</p>
  <p role="alert" tabindex="-1" data-registration-error hidden></p>
  <p data-passkey-script-required>{{ flow.passkey_requires_js | default(value='Passkey registration requires browser scripting. Enable it to continue.') }}</p><form data-add-passkey class="space-y-4">
    <label class="grid gap-2" for="passkey-name">{{ flow.passkey_name }}<input id="passkey-name" name="name" class="input input-bordered w-full" maxlength="100" required></label>
    <button type="submit" disabled class="btn btn-primary">{{ flow.register_passkey }}</button>
  </form>
</div></section>
