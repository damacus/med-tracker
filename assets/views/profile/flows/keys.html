{% include "identity_onboarding/security_labels.html" %}
<section class="card shell-card w-full max-w-3xl mx-auto">
  <div class="card-body gap-5 p-4 sm:p-6">
    <h1 class="text-2xl font-semibold">{{ flow.create_key_title }}</h1>
    <p class="shell-muted">{{ flow.keys_hint }}</p>
    <form method="post" action="/account/security/keys{{ profile_flow_query | default(value='') }}" class="grid gap-5">
      <input type="hidden" name="authenticity_token" value="{{ authenticity_token }}">
      <label class="grid gap-2" for="key-name">{{ flow.name }}<input class="input input-bordered w-full" id="key-name" name="name" required maxlength="100"></label>
      <fieldset>
        <legend class="font-medium mb-2">{{ flow.households }}</legend>
        <div class="grid gap-2">
          {% for household in households %}<label class="flex items-start gap-2"><input class="checkbox checkbox-sm shrink-0" type="checkbox" name="household_{{ household.id }}" value="1"><span>{{ household.name }}</span></label>{% endfor %}
        </div>
      </fieldset>
      <fieldset>
        <legend class="font-medium mb-2">{{ flow.permissions }}</legend>
        <div class="grid gap-2">
          <label class="flex items-start gap-2"><input class="checkbox checkbox-sm shrink-0" type="checkbox" name="permission_care:read" value="1"><span>{{ flow.read_care }}</span></label>
          <label class="flex items-start gap-2"><input class="checkbox checkbox-sm shrink-0" type="checkbox" name="permission_care:write" value="1"><span>{{ flow.manage_care }}</span></label>
          <label class="flex items-start gap-2"><input class="checkbox checkbox-sm shrink-0" type="checkbox" name="permission_doses:write" value="1"><span>{{ flow.record_doses }}</span></label>
          <label class="flex items-start gap-2"><input class="checkbox checkbox-sm shrink-0" type="checkbox" name="permission_members:write" value="1"><span>{{ flow.manage_members }}</span></label>
          <label class="flex items-start gap-2"><input class="checkbox checkbox-sm shrink-0" type="checkbox" name="permission_invitations:write" value="1"><span>{{ flow.manage_invitations }}</span></label>
        </div>
      </fieldset>
      <label class="grid gap-2" for="key-expiry">{{ flow.expiry_days }}<input class="input input-bordered w-32" id="key-expiry" name="expires_days" type="number" value="90" min="1" max="365" required></label>
      <button class="btn btn-primary justify-self-start" type="submit">{{ flow.create_key }}</button>
    </form>
    {% if not profile_flow %}<a class="btn btn-ghost self-start" href="/profile#security">{{ done_label }}</a>{% endif %}
  </div>
</section>
