<span class="relative grid place-items-center overflow-hidden bg-neutral text-neutral-content rounded-full w-16 h-16 shrink-0 text-xl font-semibold" data-profile-avatar><span aria-hidden="true">{{ initials }}</span>{% if avatar_attached %}<img class="absolute inset-0 rounded-full w-full h-full object-cover" src="{{ profile_path }}/avatar" alt="{{ name }}" data-avatar-image>{% elif gravatar_url %}<img class="absolute inset-0 rounded-full w-full h-full object-cover" src="{{ gravatar_url }}" alt="{{ name }}" referrerpolicy="no-referrer" data-avatar-image>{% endif %}</span>
