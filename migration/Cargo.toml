[package]
name = "migration"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde_json = "1"
sea-orm-migration = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }

[dev-dependencies]
heck = "=0.5.0"
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-json", "with-rust_decimal"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "=2.5.8"
uuid = { version = "1", features = ["v4"] }
