{{- range $kind := list "runtime" "update" }}
{{- $access := index $.Values.database $kind }}
{{- if not $access.existingSecret }}
{{- $name := printf "%s-%s" (include "med-tracker.name" $) $kind }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name }}
{{- $data := $existing.data | default dict }}
{{- $url := index $data "DATABASE_URL" | default "" | b64dec }}
{{- if not $url }}
{{- $host := required "database.host is required when generating credentials" $.Values.database.host }}
{{- $user := printf "%s_%s" (include "med-tracker.name" $ | replace "-" "_") $kind }}
{{- $url = printf "postgresql://%s:%s@%s:%v/%s" $user (randAlphaNum 48) $host $.Values.database.port ($.Values.database.name | urlquery | replace "+" "%20") }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/resource-policy: keep
type: Opaque
data:
  DATABASE_URL: {{ $url | b64enc | quote }}
  {{- if eq $kind "runtime" }}
  AUTH_SESSION_SECRET: {{ index $data "AUTH_SESSION_SECRET" | default (randAlphaNum 64 | b64enc) | quote }}
  MEDTRACKER_SESSION_KEY: {{ index $data "MEDTRACKER_SESSION_KEY" | default (randAlphaNum 64 | b64enc | b64enc) | quote }}
  {{- end }}
{{- end }}
{{- end }}
