{{- range $name, $route := .Values.route }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "med-tracker.name" $ }}-{{ $name }}
  {{- with $route.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs: {{ $route.parentRefs | toJson }}
  hostnames: {{ $route.hostnames | toJson }}
  {{- if $route.rules }}
  rules: {{ $route.rules | toYaml | nindent 4 }}
  {{- else }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ include "med-tracker.name" $ }}
          port: {{ $.Values.service.port }}
  {{- end }}
{{- end }}
