apiVersion: v1
kind: Service
metadata:
  name: {{ include "med-tracker.name" . }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/controller: {{ include "med-tracker.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
