{{- if .Values.setup.enabled }}
{{- range $initial := list true false }}
{{- if or (not $initial) $.Release.IsInstall $.Values.setup.bootstrapOnUpgrade }}
{{- $secret := include "med-tracker.update-secret" $ }}
{{- $key := $.Values.database.update.key }}
{{- if $initial }}
{{- $secret = required "database.bootstrap.existingSecret is required for initial setup" $.Values.database.bootstrap.existingSecret }}
{{- $key = $.Values.database.bootstrap.key }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "med-tracker.name" $ }}-{{ ternary "setup" "update" $initial }}
  annotations:
    helm.sh/hook: {{ if and $initial $.Release.IsInstall }}pre-install{{ else }}pre-upgrade{{ end }}
    helm.sh/hook-weight: {{ ternary "-10" "-5" $initial | quote }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ $.Values.setup.timeoutSeconds }}
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets: {{ $.Values.imagePullSecrets | toJson }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: database
          image: {{ include "med-tracker.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: {{ ternary (list "task" "database-setup" "--environment" "production") (list "db" "migrate" "--environment" "production") $initial | toJson }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
            {{- if $initial }}
            - name: MEDTRACKER_RUNTIME_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "med-tracker.runtime-secret" $ }}
                  key: {{ $.Values.database.runtime.key }}
            - name: MEDTRACKER_UPDATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "med-tracker.update-secret" $ }}
                  key: {{ $.Values.database.update.key }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources: {{ $.Values.resources | toJson }}
{{- end }}
{{- end }}
{{- end }}
