[package]
edition = "2024"
rust-version = "1.94"
name = "loco-rs"
version = "1.2.0"
build = "build.rs"
exclude = [
    "website/",
    "media/",
    ".vscode/",
    ".github/",
    "snipdoc.yml",
    "AGENTS.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "The one-person framework for Rust"
homepage = "https://loco.rs/"
documentation = "https://docs.rs/loco-rs"
readme = "README.md"
keywords = [
    "web",
    "framework",
    "rails",
    "api",
    "backend",
]
categories = [
    "web-programming::http-server",
    "web-programming",
    "development-tools",
]
license = "Apache-2.0"
repository = "https://github.com/loco-rs/loco"

[package.metadata.docs.rs]
features = [
    "testing",
    "multi-tenancy",
]

[features]
all_storage = [
    "storage_aws_s3",
    "storage_azure",
    "storage_gcp",
]
auth = [
    "dep:jsonwebtoken",
    "jsonwebtoken/rust_crypto",
]
cache_inmem = ["dep:moka"]
cache_redis = [
    "dep:bb8-redis",
    "dep:bb8",
]
cli = ["dep:clap"]
db-sqlite = [
    "sea-orm?/sqlx-sqlite",
    "sea-orm-migration?/sqlx-sqlite",
    "sqlx?/sqlite",
]
default = [
    "auth",
    "cli",
    "with-db",
    "cache_inmem",
    "worker",
    "db-sqlite",
]
embedded_assets = []
multi-tenancy = ["with-db"]
redis_tls = [
    "redis/tokio-rustls-comp",
    "redis/tls-rustls-webpki-roots",
    "dep:rustls",
]
storage_aws_s3 = ["opendal/services-s3"]
storage_azure = ["opendal/services-azblob"]
storage_gcp = ["opendal/services-gcs"]
testing = [
    "dep:axum-test",
    "dep:scraper",
    "dep:tree-fs",
]
with-db = [
    "dep:sea-orm",
    "dep:sea-orm-migration",
    "dep:sqlx",
    "loco-gen/with-db",
]
worker = [
    "dep:sqlx",
    "dep:ulid",
]
worker_redis = [
    "worker",
    "dep:redis",
]

[lib]
name = "loco_rs"
path = "src/lib.rs"

[[test]]
name = "mod"
path = "tests/mod.rs"

